# The parts the real agents play in the first pass of tests whose agents play parts (design document `testing`, 12),
# run with the parts installation's settings (`wf-agents run --settings --script`), one round at a time (26). Every
# round, act and tool is the real one; each item is added, and each act of a person done, by hand. A round named here
# is given its part; a later run of a cell, or a later round, that is not named plays none and is read the same way.

# The items, in order, so that the kth item's work is the kth work.

# The plain path: every round does its cell's work briefly.
[[items]]
title = "Greet by name"
flow = "engineer"
writes = [{ block = "background", content = "greet() says \"Hello.\" whoever it greets; it should say \"Hello, Ada.\" when given the name Ada, and \"Hello.\" when given none." }]

# A question to the owner, answered by hand with its second option, not the one it recommends.
[[items]]
title = "Greet in the evening"
flow = "engineer"
writes = [{ block = "background", content = "greet() says \"Hello.\" at any hour; in the evening it might say \"Good evening.\" instead." }]

# A review that objects once, which sends the work back to the implementation.
[[items]]
title = "Greet two people"
flow = "engineer"
writes = [{ block = "background", content = "greet() greets one person; given two names it should greet both, \"Hello, Ada and Bo.\"" }]

# The engine stopped by hand while the implementation's round is under way, and started again.
[[items]]
title = "Say goodbye"
flow = "engineer"
writes = [{ block = "background", content = "There is greet() and no farewell; farewell() should say \"Goodbye.\"" }]

# Every work's: the first round of each agent's cell, and of the implementation's and the review's second run, does
# its cell's work as briefly as it allows.
[[flows.engineer.rounds]]
cell = "R0"
part = "Do this cell's work on the item as briefly as it allows, and return what your task asks."

[[flows.engineer.rounds]]
cell = "R1"
part = "Do this cell's work on the item as briefly as it allows, and return what your task asks."

