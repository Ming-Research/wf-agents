what = "Whether the items the work's item depends on have merged or been cancelled: `merged` once each has, or it depends on none; `waiting` while one has not."
values = ["waiting", "merged"]
from = "dependencies"

# What the engine writes with each value. Filled in a run: `{items}` each item it waits for, by its number, with
# `between` between two.
[writes]
merged = "Every item this one depends on has merged or was cancelled."
waiting = "The work waits for the items {items} to merge."
between = ", "
