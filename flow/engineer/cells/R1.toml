# Why this cell exists: so that the work starts from facts checked in the code: what the item says, found to hold, and
# a plan the implementation can follow; or, where the facts cannot settle the direction in a round or two, the deep
# research is called with what it must settle.
title = "Initial research"
kind = "agent"
line = "engineer"
effort = "high"
task = '''
Research how to do what the item asks with code. Read the design tree as its rules say, beyond `tree_entries`, for what
the research reaches. Where the plan reaches entries that `tree_entries` does not name, hand in `tree_entries` again,
the whole list. Check that what the item says is true, where it can be seen. For a fault it reports, see the fault
happen, for example on the page in a real browser or in the program on its own data, and find its root cause. A cause
read from the code, or a test in a stand-in such as a simulated page, has not seen it. For something it asks for, check
that it is not there already. If it is still not true after looking as far as the tools reach, ask the owner how to go
on, in a question that waits. Commit a test with the project's tests, and anything else you make in
`project.research`. If the design itself is at fault, say so.

Decide `deep_needed`. If yes, write only `found`, and ask no questions. If no, write the plan (`plan_owner`,
`plan_agent` and `acceptance`) and no `found`. Research every approach that could work. When the design tree's rules
say a choice is the owner's, ask about it in a question of its own: what to do, with each approach as an option and
what it gains and costs. If the solution conflicts with the design tree, ask instead of bending the solution.
Before handing in, ask yourself where the plan is most likely wrong, and check that point.
'''
when = { deep_needed = "no" }
watches = [
  "background",
  "better_found",
  "plan_review",
  "tree_review",
  "plan_doubts",
  "r1_questions",
  "r1_words",
]
reads = ["tree", "tree_entries"]
outputs = [
  "deep_needed",
  "found",
  "plan_owner",
  "plan_agent",
  "r1_questions",
  "acceptance",
  "tree_entries",
  "better_found",
  "plan_review",
  "tree_review",
  "plan_doubts",
  "r1_words",
]
must_write = ["deep_needed"]

# What the cell does when each datum it watches is new; a datum with none is the task's alone.
[do]
background = """Look at what changed since the version you last worked from (all of it, if you have worked from none), and update the research and the plan for it."""
better_found = """Consider the approach in `better_found`: change the plan to it, or say why not, and answer in `better_found`."""
plan_review = """Go through each point in `plan_review`: change the plan only where the point applies, or say why not, and answer in `plan_review`."""
tree_review = """Go through each point in `tree_review`: change the plan only where the point applies, or say why not, and answer in `tree_review`."""
plan_doubts = """Go through each point in `plan_doubts`: change the plan only where the point applies, or say why not, and answer in `plan_doubts`."""
r1_questions = """The owner has answered one of your questions in `r1_questions`, either with an option other than the one you recommended or one you were waiting for: update the plan to match."""
r1_words = """The owner has written to you in `r1_words`: deal with that first. Go through each point: change the plan only where it applies, or say why not, and answer in `r1_words`."""

# `all` for a dialogue, `last_and_latest` where the cell works from what changed, `latest` for the rest. The cell's own
# questions and words are of the kind every agent cell takes them in.
[kinds]
# Given as the files that changed since the tree this session read.
tree = "last_and_latest"
# The entries of the design tree the plan was worked from, whole.
tree_entries = "latest"
background = "last_and_latest"
better_found = "all"
plan_review = "all"
tree_review = "all"
plan_doubts = "all"
