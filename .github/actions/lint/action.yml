name: lint
description: Everything of the CI that checks the code without running its Rust tests, for the workflows ci and fast

# The steps of the job `lint`, written once for the two workflows that run it (ci.yml and fast.yml). The repository is
# checked out before this runs. A red format check or a stale generated file leaves the files the code makes of itself
# in the artifact `page-types`, each at its path in the repository: the engine's ci tool puts those that differ from
# the head in the work's worktree, the project's configuration naming the artifact (`generated_artifact`).
runs:
  using: composite
  steps:
    # Installs the toolchain rust-toolchain.toml pins, with its components.
    - run: echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      shell: bash
    - run: rustup toolchain install
      shell: bash
    # On GitHub's machines only: the project's own keep what the last run built.
    - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      if: runner.environment == 'github-hosted'
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      if: runner.environment == 'github-hosted'
      with:
        node-version: 24.21.0
        cache: npm
        cache-dependency-path: client/package-lock.json
    - run: |
        echo /opt/node/bin >> "$GITHUB_PATH"
        [ "$(/opt/node/bin/node --version)" = v24.21.0 ]
      if: runner.environment != 'github-hosted'
      shell: bash
    # Formatting first: it needs no build, so a misformatted push fails in seconds.
    - name: Format
      id: format
      run: cargo fmt --all --check
      shell: bash
    # The page's TypeScript types are generated from the Rust types; the page is checked against what they generate
    # now, and the step that compares them fails when that differs from the committed file. The same run writes the
    # flow as the engine stores it, which the page's tests read.
    - name: Generate the page's types and the flow its tests read
      run: WF_AGENTS_GENERATE=1 cargo test -p api --locked --test typescript
      shell: bash
    # What the page's checks read: its files, the types and the flow just generated. On the project's machine, whose
    # runners keep it, checks that passed on the same of these are not run again, so that a change to the Rust alone
    # pays only for what it can break.
    - name: Find whether the page's checks passed on this already
      id: page
      run: |
        key=$(git rev-parse HEAD:client)-$(git hash-object client/src/api.ts client/src/stored-flow.json | tr -d '\n' | sha256sum | cut -c1-16)
        echo "key=$key" >> "$GITHUB_OUTPUT"
        if [ -f "$HOME/page-builds/checked/$key" ]; then echo "passed=true" >> "$GITHUB_OUTPUT"; fi
      shell: bash
    - name: Install the page's dependencies
      working-directory: client
      run: |
        lock=$(git rev-parse HEAD:client/package-lock.json)
        if [ "$(cat node_modules/.wf-lock 2>/dev/null)" != "$lock" ]; then
          npm ci
          echo "$lock" > node_modules/.wf-lock
        fi
      shell: bash
    - name: Type-check the page
      if: steps.page.outputs.passed != 'true'
      working-directory: client
      run: npm run typecheck
      shell: bash
    - name: Lint the page
      if: steps.page.outputs.passed != 'true'
      working-directory: client
      run: npm run lint
      shell: bash
    # Every colour, size and spacing in the page's styles is a token, as its design system says
    # (design/wf-agents/frontend/design-system.md); the tests of the next step leave this to it.
    - name: Check the page's styles against its design system
      if: steps.page.outputs.passed != 'true'
      working-directory: client
      run: npm run check:ui
      shell: bash
    # The page's tests include the ones that draw it in a real Chromium (`npm test` runs the project `browser`), so
    # Chromium is installed here too, and only where the tests will run.
    - name: Chromium for the page's browser tests
      if: steps.page.outputs.passed != 'true'
      uses: ./.github/actions/browser
    - name: Test the page
      if: steps.page.outputs.passed != 'true'
      working-directory: client
      run: npm test
      shell: bash
    - name: Keep that the page's checks passed on this
      if: steps.page.outputs.passed != 'true'
      run: mkdir -p "$HOME/page-builds/checked" && touch "$HOME/page-builds/checked/${{ steps.page.outputs.key }}"
      shell: bash
    # Before any cargo step that compiles the crate the page is built into; the build of the page's files as they are is
    # kept for every runner of the project's machine.
    - name: Build the page
      working-directory: client
      run: |
        tree=$(git rev-parse HEAD:client)
        kept="$HOME/page-builds/$tree"
        if [ "$(cat node_modules/.wf-tree 2>/dev/null)" = "$tree" ] && [ -f dist/index.html ]; then
          :
        elif [ -f "$kept/index.html" ]; then
          # With today's times: cargo takes files older than its last build for unchanged, and would read the old list.
          rm -rf dist && cp -R "$kept" dist
        else
          npm run build
          mkdir -p "$HOME/page-builds"
          tmp=$(mktemp -d "$HOME/page-builds/.new.XXXXXX") && cp -a dist/. "$tmp" && chmod 755 "$tmp" && { mv -T "$tmp" "$kept" 2>/dev/null || rm -rf "$tmp"; }
          find "$HOME/page-builds" -mindepth 1 -maxdepth 1 -mtime +3 -exec rm -rf {} +
        fi
        echo "$tree" > node_modules/.wf-tree
      shell: bash
    - name: Lint
      run: cargo clippy --workspace --all-targets --locked -- -D warnings
      shell: bash
    - name: The page's types are current
      id: types
      run: git diff --exit-code -- client/src/api.ts
      shell: bash
    # What the Rust types generate, to commit when the step before fails, at its path in the repository.
    - name: Keep what the Rust types generate
      if: always() && steps.types.outcome == 'failure'
      run: |
        mkdir -p "$RUNNER_TEMP/generated/client/src"
        cp client/src/api.ts "$RUNNER_TEMP/generated/client/src/"
      shell: bash
    # What rustfmt makes of the files, to commit when the format check fails, so that no one rewrites by hand what a
    # tool rewrites: the tree is formatted here, and each file that changed is kept at its path in the repository.
    - name: Keep what rustfmt makes of the files
      if: always() && steps.format.outcome == 'failure'
      run: |
        cargo fmt --all
        mkdir -p "$RUNNER_TEMP/generated"
        git diff --name-only -z | xargs -0 -I{} cp --parents {} "$RUNNER_TEMP/generated"
      shell: bash
    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      if: always() && (steps.types.outcome == 'failure' || steps.format.outcome == 'failure')
      with:
        name: page-types
        path: ${{ runner.temp }}/generated
        if-no-files-found: ignore
