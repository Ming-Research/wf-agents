[package]
name = "engine"
description = "The wf-agents engine: runs each work through the compiled flow."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
config = { path = "../config" }
db = { path = "../db" }
flow = { path = "../flow" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["preserve_order"] }
# The hash each material of an agent's message is known by.
sha2 = "0.11.1"

[lints]
workspace = true
