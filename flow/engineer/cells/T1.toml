# Why this cell exists: so that the change is judged by a session that did not make it and knows no less than its
# maker: whether the code does what the plan says, by the engineering rules. One of three reviews of the change on one
# line, each answering its questions one by one (decision the-change-is-reviewed-in-three).
title = "Code review"
kind = "agent"
line = "code_reviewer"
effort = "high"
task = '''
Review the code of the change in `code`, in a session of your own, and change no file. Read the diff from main to
`head`. Judge only by what the implementation was asked to do (`plan_owner`, `acceptance`) and the repository's rules;
old code that lagged behind a decision before this work is no point. Not the tests and not the tree: the other two
reviews have them.

1. Does the code do what the plan says, with no short cut, other method, change of direction, or more than the work needs?
2. Is it well built, by the standards of software engineering?
3. Does the change reach every place where the same thing happens, not only the one the item names?
4. Does each decision in `decisions`, and each the code makes that `decisions` does not give, rest on a reason that holds?
5. Is each exception or expected value the change gives a check a choice of the design, not a fault it hides?
6. Is each change of a file the project protects one the work needs?

In the why of `review_ok`, answer each question by its number: what you checked and what you found. A question you did
not check is a point: what must be shown. Write every point in `review` at once: this is your one chance, and nothing
is raised later that could be raised now. Leave out preferences: the engineer fixes nearly all a review raises, so a
wrong point makes good code worse. With `review_ok` yes, leave `review` out of your return.
'''
watches = ["change", "review"]
reads = ["plan", "background", "tree"]
outputs = ["review", "review_ok"]
must_write = ["review_ok"]

# What the cell does when each datum it watches is new; a datum with none is the task's alone.
[do]
# The change is watched as one, what the implementation and the testing hand in; the plan is only read, since the
# implementation brings the code to it first, and no session is watched, since a reopened session gives a reviewer
# nothing to do again.
change = """See what changed since the version you last reviewed, the whole of it where you reviewed none, and review it."""
review = """Look at what changed: accept each answer in `review` or say why not; raise nothing new the fix did not bring."""

# `all` for a dialogue, `last_and_latest` where the cell works from what changed, `latest` for the rest.
[kinds]
# Given as the files that changed since the tree this session read.
tree = "last_and_latest"
review = "all"
code = "last_and_latest"
title = "latest"
decisions = "last_and_latest"
evidence = "latest"
plan_owner = "last_and_latest"
plan_agent = "last_and_latest"
acceptance = "last_and_latest"
tree_edits = "last_and_latest"
tests = "last_and_latest"
head = "last_and_latest"
background = "latest"
