[[cases.history]]
cell = "D1"
blocks.plan_owner.content = '''
`tally report --monthly` 改为：整个文件读进内存后，分成与 CPU 核数相同的几段，每段一个线程，逐行只取日期的前七个字符和金额，按月求和，不为每行分配 `String`，最后把各段的结果合起来。CI 上两百万行（67 MB）量过：现在的做法 367 ms，其中解析 281 ms；只改成不分配的单线程扫描 93 ms；再分 8 个线程扫描 14 ms，连读文件 37 ms，在 50 ms 以内。mmap 只省得下读文件那 22 ms 的一部分，单线程反而 97 ms，不用。不加新的依赖（用标准库的 `std::thread::scope`）。决定 reports-read-the-whole-file 改写成新的决定。没做的：`tally total` 和 `tally categories` 仍走原来的路。'''
blocks.plan_agent.content = '''
1. crates/tally/src/report.rs: `pub fn monthly_fast(text: &str) -> Result<Vec<(String, Amount)>, String>`: check the header; split the rest of `text` into N chunks of equal bytes (N = `std::thread::available_parallelism`); in `std::thread::scope`, each thread walks its chunk line by line, takes the line's first seven bytes as the month (`[u8; 7]`) and parses the second field with `amount::parse`, skipping the note, and sums into a `BTreeMap<[u8; 7], Amount>`; the maps are merged in chunk order. A line that cannot be read fails the report with its line number (principle no-silent-skips): each thread counts its lines, and the number adds the lines of the chunks before it.
2. crates/tally-cli/src/main.rs: `report --monthly FILE` reads the file and calls `monthly_fast`.
3. Tests in crates/tally/tests/report.rs: `fast_matches_monthly`: on examples/ledger.csv and on a generated 10,000-line ledger, `monthly_fast` gives the rows `monthly` gives (`assert_eq!`); `fast_fails_a_bad_line_with_its_number`; both red before (no `monthly_fast`), green after.
4. research/monthly-report-2m/README.md: the question, the criterion (50 ms), the numbers below and the run's link.
