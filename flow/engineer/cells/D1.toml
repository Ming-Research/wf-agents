# Why this cell exists: so that a direction the facts could not settle in the research is settled by a deeper look, in
# a session of its own with a stronger model, before anything is built on it.
title = "Deep research"
kind = "agent"
line = "deep_researcher"
effort = "xhigh"
takes_main = true
task = '''
Research what `found` left open, and work out how to do what `background` asks. This session has not read the tree:
read it for this work as the tree's rules say, and read the code yourself. Treat `found` as a hypothesis to check. Use
what the research left in `project.research` instead of running it again, and commit anything you make there too. Find
out the facts left open, try the approaches worth trying, and analyse a fault in the design itself as a design
problem. Check any fact that would change the direction before you rely on it, and weigh the upkeep the solution adds.

Write the plan: `plan_owner`, `plan_agent` and `acceptance`. In `plan_owner` say also what it leaves out. Settle what
the facts settle. When the design tree's rules say a choice must go to the owner, ask about it in a question of its
own: what to do, with each approach as an option and what it gains and costs. If the solution conflicts with the
design tree, ask instead of bending the solution. Decide the rest yourself.

If the solution is too large for one work and splits into parts that can each be merged on their own, ask the
owner in a question that waits, listing the parts in order.
'''
when = { deep_needed = "yes" }
watches = [
  "background",
  "found",
  "better_found",
  "plan_review",
  "tree_review",
  "plan_doubts",
  "r1_questions",
  "d1_questions",
  "d1_words",
]
reads = ["tree"]
outputs = [
  "plan_owner",
  "plan_agent",
  "d1_questions",
  "acceptance",
  "better_found",
  "plan_review",
  "tree_review",
  "plan_doubts",
  "d1_words",
]

# What the cell does when each datum it watches is new; a datum with none is the task's alone. No session is watched:
# the task has the cell read the tree where its session has not.
[do]
background = """Look at what changed since the version you last worked from (all of it, if you have worked from none), and update the research and the plan for it."""
better_found = """Consider the approach in `better_found`: change the plan to it, or say why not, and answer in `better_found`."""
plan_review = """Go through each point in `plan_review`: change the plan only where the point applies, or say why not, and answer in `plan_review`."""
tree_review = """Go through each point in `tree_review`: change the plan only where the point applies, or say why not, and answer in `tree_review`."""
plan_doubts = """Go through each point in `plan_doubts`: change the plan only where the point applies, or say why not, and answer in `plan_doubts`."""
r1_questions = """The owner has answered a question in `r1_questions`, either with an option other than the one it recommended or one that was waiting: update the plan to match."""
d1_questions = """The owner has answered one of your questions in `d1_questions`, either with an option other than the one you recommended or one you were waiting for: update the plan to match."""
d1_words = """The owner has written to you in `d1_words`: deal with that first. Go through each point: change the plan only where it applies, or say why not, and answer in `d1_words`."""

# `all` for a dialogue, `last_and_latest` where the cell works from what changed, `latest` for the rest. The cell's own
# questions and words, and the research's questions, are of the kind every agent cell takes them in.
[kinds]
# Given as the files that changed since the tree this session read.
tree = "last_and_latest"
background = "last_and_latest"
found = "latest"
better_found = "all"
plan_review = "all"
tree_review = "all"
plan_doubts = "all"
