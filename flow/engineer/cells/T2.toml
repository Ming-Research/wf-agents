# Why this cell exists: so that the tests and the evidence of the change are judged by a session that did not make it:
# whether they show each condition the work is accepted by, and whether the change needs adversarial testing. One of
# three reviews of the change on one line, each answering its questions one by one (decision
# the-change-is-reviewed-in-three).
title = "Test review"
kind = "agent"
line = "code_reviewer"
effort = "high"
task = '''
Review the tests and the evidence of the change in `code`, in a session of your own, and change no file. Read the diff
from main to `head`. Judge only by what the implementation was asked to do (`plan_agent`, `acceptance`) and the
repository's rules. Not the code and not the design tree.

1. Does `evidence` show each condition of `acceptance` on the change?
2. Was each new or extended test red on the code before the change, where its kind needs it, as a run shows?
3. Of each test the change removes, skips, narrows or weakens: is what it checked still checked, or is a technical reason given?
4. Is each new test worth its time: what it catches that no other test does, and why it cannot be smaller?
5. Where cost per operation or request can change, is what it can make slower measured?
6. Does the change touch a kind that `needs_testing` names?

In the why of `test_ok`, answer each question by its number: what you checked and what you found; in the why of
`needs_testing`, the kind the change touches, or that it touches none. A question you did not check is a point: what
must be shown. Write every point in `test_review` at once: this is your one chance, and nothing is raised later that
could be raised now. Leave out preferences: the engineer fixes nearly all a review raises, so a wrong point makes good
code worse. With `test_ok` yes, leave `test_review` out of your return. Having said yes to `needs_testing`, keep it while
the part of the change that made you say so is still there.
'''
watches = ["change", "test_review"]
reads = ["plan", "background", "tree"]
outputs = ["test_review", "test_ok", "needs_testing"]
must_write = ["test_ok", "needs_testing"]

# What the cell does when each datum it watches is new; a datum with none is the task's alone.
[do]
# The change is watched as one, what the implementation and the testing hand in; the plan is only read, since the
# implementation brings the code to it first, and no session is watched, since a reopened session gives a reviewer
# nothing to do again.
change = """See what changed since the version you last reviewed, the whole of it where you reviewed none, and review it."""
test_review = """Look at what changed: accept each answer in `test_review` or say why not; raise nothing new the fix did not bring."""

# `all` for a dialogue, `last_and_latest` where the cell works from what changed, `latest` for the rest.
[kinds]
# Given as the files that changed since the tree this session read.
tree = "last_and_latest"
test_review = "all"
code = "last_and_latest"
title = "latest"
decisions = "last_and_latest"
evidence = "latest"
plan_owner = "last_and_latest"
plan_agent = "last_and_latest"
acceptance = "last_and_latest"
tree_edits = "last_and_latest"
tests = "last_and_latest"
head = "last_and_latest"
background = "latest"
