3. Not settled: whether every date that reaches `report::monthly` has the shape `YYYY-MM-DD`. The owner's ledgers were converted from the old format in 0.3 by `legacy::import`, which builds entries from `date;amount;category` lines; if an old ledger held dates such as `2025-1-5`, a cut of seven characters would mix months again.
For the deep research: settle whether a date of another shape can reach the monthly report, then plan the fix.'''

