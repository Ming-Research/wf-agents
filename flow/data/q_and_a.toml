# The questions the cells ask the owner and the owner's answers: one record, which each cell that asks is given, all of
# it, so that an answer is never given without its question. Its entries are the engine's: a question as the run that
# asks it, asks it anew or withdraws it finishes, or as the engine asks it with a round's end; an answer as the owner
# answers the latest version of a question. It is the record the trigger of an answer (`../triggers/of_a_cell/`) has
# its agent read, and runs no cell. A cell that writes it in `outputs` asks the owner: `words` is told to it, after the
# list of what it returns, and `[shape]` is what the form of its line holds it to.
what = "The questions the cells ask the owner, each under its name, and the owner's answers to them, each the question, the version answered, the option taken and why."
from = "answer"
shown = true
words = '''
`q_and_a`: what you ask the owner, only where ways that each would do are left, no fact decides between them, and
a wrong choice costs much; decide the rest yourself. Set `waits` where you cannot go on without the answer, or where
going on by your recommendation would likely be undone at a cost: the work stops at this cell, and you are entered
again with the answer. Otherwise the work goes on by your recommendation. A text points to a question as `{{name}}`;
`recommends` counts the options from 1. Write a question again under its name to rewrite it, or give its name and why
to withdraw it; a question you do not write stands, with its answer.

A return with a question you wait for may leave out the blocks marked "hand it in every time", since the work stops at this cell until the answer comes.'''

[shape]
type = "array"

[[shape.items.anyOf]]
type = "object"
properties = { name = { type = "string" }, waits = { type = "boolean" }, recommends = { type = "integer" }, ask = { type = "string" }, options = { type = "array", items = { type = "object", properties = { does = { type = "string" }, follows = { type = "string" } }, required = ["does", "follows"], additionalProperties = false } } }
required = ["name", "waits", "recommends", "ask", "options"]
additionalProperties = false

[[shape.items.anyOf]]
type = "object"
properties = { name = { type = "string" }, withdrawn = { type = "string" } }
required = ["name", "withdrawn"]
additionalProperties = false

# What the engine writes of each entry. An answer, as the owner answers the latest version of a question: `{question}`
# its name, `{version}` the version answered, `{option}` the option's number, `{does}` and `{follows}` the option's,
# and `{why}` the owner's reason as `why` says it, where one is given. A question asked: `{question}` its name,
# `{version}` its version, `{ask}` what it asks, `{options}` each option as `option` says it, with `{option}` its
# number, `{recommends}` the option it recommends as `recommends` says it, where it recommends one, and `{waits}`
# whether its cell waits for the answer, as `waits` or `goes_on` says it; asked anew, `{was}` the version it replaces.
# A question withdrawn: `{version}` the version that withdraws it, `{was}` the version withdrawn, `{why}` why, as
# `why` says it.
[writes]
text = "`{question}`, version {version}: option {option}, {does}: {follows}.{why}"
why = " Why: {why}"
asked = "`{question}`, version {version}: {ask}{options}{recommends}{waits}"
asked_anew = "`{question}`, version {version}, the new version of version {was}: {ask}{options}{recommends}{waits}"
option = "\n- option {option}, {does}: {follows}"
recommends = "\nRecommended: option {option}."
waits = "\nThe work waits for the answer."
goes_on = "\nThe work goes on by the recommendation."
withdrawn = "`{question}`, version {version}: version {was} withdrawn.{why}"
