[package]
name = "config"
description = "The wf-agents configuration: what differs by installation and by project."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
repository.workspace = true

[dependencies]
flow = { path = "../flow" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["preserve_order"] }
toml = "1.1.8"
# Edits a file of the configuration in place, its comments and layout kept, for what the owner changes on the page.
toml_edit = "0.25.17"
# How many columns a character takes when shown (a Chinese character takes two), for the longest a title may be.
unicode-width = "0.2.3"

[lints]
workspace = true
