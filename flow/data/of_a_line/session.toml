# A datum of each line one of whose cells watches it, under the name below: a new session of the line writes its own
# alone, so that it runs again only the cell of that line that watches it (design document `data-and-context`, 25).
name = "{line}_session"
what = "That the line's session was reopened: it holds nothing, and a cell entered in it is given everything again from the start."
from = "session"

# What the engine writes as a line begins a new session: `text`, with `{line}` the line and `{why}` the words below of
# why it began one; and, as its session is compacted during a round, which begins none, `compacted` with `{line}`.
# Filled in a run: `{context}` the tokens of the session's context as its last round ended, `{limit}` the limit, the
# installation's `sessions.context_limit`; `{was}` the model it was begun on.
[writes]
text = "A new session of the line `{line}`: {why}."
limit = "its context was {context} tokens as its last round ended, past the limit of {limit} for its line"
model = "its rounds now run on a different model from {was}, the one it was begun on"
changed = "the rules or the form of return its agents are given changed since it began"
account = "its rounds now run under a different account from the one it was begun under"
owner = "the owner asked for one"
flagged = "the service's safety check flagged its last round"
guarded = "the run guard stopped its last round, whose context grew past what its cell's history explains"
too_long = "its last round's prompt was too long for the model"
lost = "the agents' program no longer had the session it was in"
compacted = "The session of the line `{line}` was compacted: it holds only a summary of what it read."
