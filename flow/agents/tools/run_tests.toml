# Runs tests and checks in the project's CI, run by the engine.
words = '''
`run_tests`: runs the tests and checks you name in the project's CI, on a commit the engine pushes. Ask as
  `{"tests": [...], "checks": [...], "commit": "..."}`. Name each test exactly as its JUnit result names it; this
  project's naming is `project.test_names`. Name checks among {named_checks}; only what you name is run, and a request
  that names neither runs nothing.
  `commit` is the commit to run on, as git names one in your worktree; with none, it is
  the last commit of the work's branch, and anything not committed is not run. It gives each test you named,
  passed or failed, with the time it took and what a failed one said, and each job, with how it ended and its
  wall time.{measure}
  Add `"publish": true` to leave `commit` on GitHub, on a branch of this work's own until the work ends, where a
  workflow you start yourself can run it; the result names the branch. It runs nothing by itself.'''

# What it says in place of `words` where the host is the local repository.
words_local = '''
`run_tests`: runs the project's check command on your worktree as it is, including what is not committed. Ask as
  `{"tests": [...], "checks": [...]}`; the whole command runs, whatever you name, and no commit can be named. It gives
  whether the command passed and what it said.'''

# What a request that cannot be read as that shape is told, nothing having been run: `{error}` what the reading said.
unread = "Nothing was run: the request is not `{\"tests\": [...], \"checks\": [...], \"commit\": \"...\"}`, with `\"measure\": [...]` where the project times measurements and `\"publish\": true` to leave the commit on GitHub; each list holds names, the commit is one name, and each may be left out: {error}."

# What it is told where the check could not be run at all, whatever the host: `{why}` what stopped it.
could_not_check = "The check could not be run: {why}"

[request]
type = "object"
properties = { tests = { type = "array", items = { type = "string" } }, checks = { type = "array", items = { type = "string" } }, measure = { type = "array", items = { type = "string" } }, commit = { type = "string" }, publish = { type = "boolean" } }
additionalProperties = false

# How much of a result is given. The engine keeps it whole in its records, and in a file in the temporary directory, and
# gives a round the first `bound` bytes of it, then `cut`: `{given}` the bytes given, `{size}` the bytes the result is
# whole, `{file}` the file that holds it whole.
[given]
bound = 20000
cut = "(The result is cut here: {given} of its {size} bytes are given. The whole result is in the file {file}.)"

# What a result says of what a workflow found, whatever the host. A workflow reports each test as JUnit XML, and the
# engine reads no log to guess a result. `{...}` are filled in a run.
[result]
head = "The {which} ran on the commit {commit} ({url}): {came}."
which_fast = "fast workflow"
which_full = "full workflows"
which_measure = "measure workflow"
came_tests = "{passed} of the {total} tests passed"
came_measures = "{passed} of the {total} measurements ran"
came_checks = "{passed} of the {total} checks passed"
came_join = "; "
tests_title = "The tests that did not pass:"
passed_title = "The tests that passed:"
timings_title = "The timings of the measurements that ran:"
jobs_title = "The jobs:"
test = "- {name}: {became}{time}"
# A timing of a measurement: what was timed, between brackets, since the timings of one name differ only by it.
measure_case = "- {name} [{unit}]: {became}{time}"
# A test's time, and a job's wall time as GitHub records it from its start to its end.
time = " in {time} s"
passed = "passed"
failed = "failed"
skipped = "skipped"
not_run = "not run: {why}"
not_built = "not built: {why}"
output = "  What it said:\n{said}"
job = "- {name}: {how}{time}{link}"
link = " {url}"
job_passed = "passed"
job_failed = "failed ({how})"
job_broken = "ended without judging the code ({how})"
job_pending = "not complete"
job_skipped = "did not run"
job_untimed = " (GitHub gives no time for it)"
job_missing = "the run has no job of that name"
# Beneath a job that failed with no failed test of its own to say why, as a lint: `{said}` the end of what the step that
# failed it printed, as the job's log on GitHub holds it, without its colours and times; or `{why}` its log could not be
# read.
step_end = "  The end of what its failed step printed:\n{said}"
log_unread = "  Its log could not be read: {why}"
no_junit = "The run uploaded no JUnit results the engine can read, so no test's result is known, and the engine reads no log to guess one: {why}."
verdict_by = "the full workflows of the commit ({urls})"
verdict_jobs = "The jobs of the full workflows, each with how it ended and its wall time:\n  {jobs}"
unit_not_built = "{unit}: {why}"
no_such_test = "no test in the run has this name: a name is a test's name exactly as the results give it, with nothing added"
no_such_test_unbuilt = "no test in the run has this name, but these units were not built, so it may be in one of them: {units}"
all_skipped = "each test it names was skipped"
# The tests the budget of a fast run did not let finish, said apart from those that did not pass: one the run stopped as
# the budget ran out, and one it did not start, the budget used up.
short_title = "The tests the fast check's time did not let finish:"
stopped = "stopped: the fast check's time ran out"
not_started = "not run: the fast check's time was used up"

# What it says where the host is GitHub. `merge_under_way`, `uncommitted` and `untracked` are said only where no commit
# is named: a commit that is named is the one run, whatever the worktree holds.
[github]
merge_under_way = "A merge is under way in the worktree and is not committed: finish it and commit it, or take it back. Nothing was pushed.\n{changes}"
uncommitted = "The worktree has changes to tracked files that are not committed, and only what is committed is run: commit them, or take them back, and ask again. Nothing was pushed.\n{changes}"
untracked = "These files are not tracked by git, so they are not in the run, which runs only what is committed. Commit those that belong to the change:\n{files}"
none_named = "Nothing was run: you named no test and no check, and only what is named is run. Name what to run, and ask again. Nothing was pushed."
commit_unknown = "Nothing was run: git finds no commit in your worktree by the name you gave: {why}. Nothing was pushed."
no_fast = "Nothing was run: the project declares no workflows, so nothing can be run through run_tests."
unknown_checks = "Nothing was run: the fast workflow runs only these checks by name: {runs}; not {unknown}."
runner_missing = "Nothing was run: the workflow runs on {runner}, and this installation has only {have}."
no_measure = "Nothing was run: the project declares no workflow that times measurements, so none can be named. Nothing was pushed."
# Said before what a request that publishes the commit found, or alone: `{commit}` the commit, `{branch}` the branch on GitHub.
published = "The commit {commit} is on GitHub as the branch {branch} until the work ends; start a workflow on it with that branch as its ref."
# Said where the tests named are known by the medians of their times in the project's earlier fast runs to take longer
# than the budget, so that nothing is run: `{budget}` in seconds, `{tests}` each as `test` of [result] says it, its
# `{became}` one of the three below, `{median}` and `{sum}` in whole seconds.
over_budget = "Nothing was run, and nothing was pushed: by their times in this project's earlier fast runs, the tests you named would take longer than the fast check's budget of {budget} s. Name fewer or shorter tests; the check before the merge runs every test.\n{tests}"
refused_over = "refused: its median of {median} s is over the budget of {budget} s"
refused_sum = "refused: its median of {median} s brings the tests named to {sum} s, over the budget of {budget} s"
refused_untimed = "not run with the others, though not refused itself: no earlier fast run timed it"

# How the fast workflow is run for a request, where the project's declaration says nothing else. `budget`: the time the
# tests named may take together in the run, which the workflow is given where it takes it (`ci.fast.budget_input`) and
# stops the tests at; a project's `ci.fast.budget` takes its place.
[fast]
budget = "10m"

# What it says where the host is the local repository.
[local]
ran = "The check `{command}` {outcome}. What it said:\n{said}"
passed = "passed"
failed = "failed ({status})"
could_not = "The check `{command}` could not be run: {why}"
not_apart = "The tests and checks you named are not run separately: the whole command runs."
no_commit = "Nothing was run: the check runs on your worktree as it is, so no commit can be named. Ask again with none."
no_measure = "Nothing was run: the check runs the project's tests alone, so no measurement can be named."
no_publish = "Nothing was run: this repository has no host to leave a commit on, so none can be published."

# What fills `{measure}` in the words: `declared`, where the project declares a measure workflow (`[ci.measure]` of
# wf-agents.toml), and `none` where it declares none or its host is the local repository, whose words say nothing of it.
[places.measure]
declared = "\n  Add `\"measure\": [...]` to time measurements: name them as `project.measure_names` says. Each is timed in one run, on the commit your change began from and on `commit`, and every timing comes back in seconds."
none = ""

# What fills `{named_checks}`, the checks an agent may name, as the project declares its fast workflow (`[ci.fast]` of
# its declaration): `named`, `{checks}` the checks it runs by name, each between backticks and joined by commas;
# `none_named`, where it runs none by name; `whole`, where the project declares no workflows, so that nothing is run.
[places.named_checks]
named = "{checks}"
none_named = "none, since the project's fast workflow runs no check by name"
whole = "none, since the project declares no workflows: nothing can be run through run_tests"
