# The dialogue of the testing with the implementation (design document `data-and-context`, 36): it writes its points and
# the implementation its answers, each a version of it, and both watch it, so that each version is new to the other side
# alone.
what = "What the testing and the implementation say to each other. The testing lists each test that stays red, with what goes wrong according to its reference. It also lists each place it suspects but did not test, such as what shows only on one machine or under concurrency, and why it did not test it. The implementation answers each point: fixed, with the commit, or why not."
