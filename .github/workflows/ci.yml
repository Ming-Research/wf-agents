name: ci

# Every check of the code: the page's types, lint, tests and build; the Rust format and clippy with warnings as errors;
# and the Rust tests, which take most of the time, split across three jobs beside the others. The job `check` is red
# whenever the page, the lint or a job of the tests is. It is the project's full workflow (`ci.full` of
# flow/project.toml): what the check before a work's merge runs on the exact commit to merge, once, and what a request of
# an agent's `run_tests` that names no test runs. The engine dispatches it by hand on main's file, with the commit to
# test and a value only its request knows, which the run's name holds, and judges the run by the jobs' conclusions and
# by the JUnit of every test in the artifact `test-results`: nextest's of each third of the Rust tests and vitest's of
# the page's, each in a file named by its job. It runs on each pull request into `main` and on each push to `main` as well.
# What an agent names to `run_tests` while it works, the fast CI runs instead (fast.yml).
#
# Its jobs run on the owner's own machine (the runners labelled 14900k, eight of them, which fast.yml uses too), whose
# runners keep each what its last run built, as fast.yml says: the checkout, the compiled target and the page's
# dependencies stay between runs, and only what changed is built again. Only `check`, which builds nothing and takes
# seconds, runs on GitHub's machines. A pull request from a fork runs none of the jobs that run on the owner's machine,
# since the repository is public and its code would run there: the run is red, with those jobs skipped, until one who
# may write to the repository pushes the branch itself.
run-name: ${{ inputs.call && format('ci {0}', inputs.call) || '' }}

on:
  workflow_dispatch:
    inputs:
      commit:
        description: The commit to check out and test, pushed to a branch of the repository already
        required: true
      call:
        description: A value only the request that asks for this run knows, which the run's name holds
        required: true
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

# A newer push to the same pull request makes the older run pointless; `main` keeps every run, and so does every run an
# engine asked for by hand, which an agent or a merge waits for.
concurrency:
  group: ci-${{ github.event_name == 'workflow_dispatch' && inputs.call || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' && github.ref != 'refs/heads/main' }}

jobs:
  # The owner's page (client/): checked and tested on its own, so that what is wrong with it shows without waiting for
  # the Rust build.
  page:
    runs-on: [self-hosted, 14900k]
    # Not for a fork's pull request: its code must not run on the owner's machine.
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    timeout-minutes: 10
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        id: checkout
        with:
          # The commit an engine's request gives; for a pull request or a push, empty, which is the commit of the event.
          ref: ${{ inputs.commit }}
          # No later step pushes, so the token is not left in the checkout.
          persist-credentials: false
          # The checkout the runner keeps from its last run, which only what changed is brought up to date in.
          clean: false
      - id: clean
        run: git clean -ffdxq -e target -e client/node_modules -e client/dist
      - id: path
        run: echo "$HOME/.cargo/bin:/opt/node/bin" >> "$GITHUB_PATH"
      - id: node
        run: '[ "$(node --version)" = v24.21.0 ]'
      # The dependencies are installed only when their lock changed since the last run of this runner.
      - id: install
        run: |
          lock=$(git rev-parse HEAD:client/package-lock.json)
          if [ "$(cat node_modules/.wf-lock 2>/dev/null)" != "$lock" ]; then
            npm ci
            echo "$lock" > node_modules/.wf-lock
          fi
      - name: Type-check the page
        id: typecheck
        run: npm run typecheck
      - name: Lint the page
        id: lint
        run: npm run lint
      # The page's browser tests (`*.browser.test.tsx`) draw it in headless Chromium: the headless shell of the one the
      # version of Playwright the lock file locks drives, installed once for each version into the runner user's cache;
      # the system libraries it needs are installed on the machine by hand, which a workflow has no root to do.
      - name: Chromium for the page's browser tests
        id: chromium
        run: npx --no-install playwright install --only-shell chromium
      # With vitest's JUnit beside its own report: what became of each test, by its describes and its title joined by
      # ` > `, which is the name an agent asks for it by.
      - name: Test the page
        id: tests
        run: npm test -- --reporter=default --reporter=junit --outputFile.junit="$RUNNER_TEMP/page.xml"
      - name: Build the page
        id: build
        run: npm run build
      # What became of each test of the job, in a file named by the job, so that the engine tells what each job
      # reported: a step of the job's own that failed, or its tests' where they wrote nothing, is said in it as a
      # testsuite of the job's name with an error naming the step, as a unit not built is, whatever became of the steps
      # before; a job red with no failed test of its own is then not run again by the check before a merge.
      - name: Name the results
        if: ${{ !cancelled() }}
        env:
          JOB: page
          RESULTS: ${{ runner.temp }}/page.xml
          TESTED: ${{ steps.tests.outcome }} Test the page
          STEPS: |
            ${{ steps.checkout.outcome }} Check out the commit
            ${{ steps.clean.outcome }} Clear what the last run left
            ${{ steps.path.outcome }} Put the tools on the path
            ${{ steps.node.outcome }} Check the version of node
            ${{ steps.install.outcome }} Install the page's dependencies
            ${{ steps.typecheck.outcome }} Type-check the page
            ${{ steps.lint.outcome }} Lint the page
            ${{ steps.chromium.outcome }} Chromium for the page's browser tests
            ${{ steps.build.outcome }} Build the page
        run: |
          mkdir -p "$(dirname "$RESULTS")"
          failed=$(printf '%s\n' "$STEPS" | awk '$1 == "failure" { $1 = ""; print substr($0, 2); exit }')
          if [ -z "$failed" ] && [ ! -f "$RESULTS" ] && [ "${TESTED%% *}" = failure ]; then failed=${TESTED#* }; fi
          if [ -n "$failed" ]; then
            suite="<testsuite name=\"$JOB\"><error message=\"the step $failed of the job failed\"/></testsuite>"
            if [ -f "$RESULTS" ]; then
              sed -i "s|</testsuites>|$suite</testsuites>|" "$RESULTS"
            else
              printf '<testsuites>%s</testsuites>\n' "$suite" > "$RESULTS"
            fi
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: junit-page
          path: ${{ runner.temp }}/page.xml
          if-no-files-found: ignore

  # The Rust format, the form of the design tree's files and clippy with warnings as errors, beside the tests.
  lint:
    runs-on: [self-hosted, 14900k]
    # Not for a fork's pull request: its code must not run on the owner's machine.
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    timeout-minutes: 15
    env:
      CARGO_TERM_COLOR: always
      CARGO_INCREMENTAL: 1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The commit an engine's request gives; for a pull request or a push, empty, which is the commit of the event.
          ref: ${{ inputs.commit }}
          # No later step pushes, so the token is not left in the checkout.
          persist-credentials: false
          # The checkout the runner keeps from its last run, which only what changed is brought up to date in.
          clean: false
      - run: git clean -ffdxq -e target -e client/node_modules -e client/dist
      - run: echo "$HOME/.cargo/bin:/opt/node/bin" >> "$GITHUB_PATH"
      - run: |
          rustc --version
          [ "$(node --version)" = v24.21.0 ]
      # Formatting first: it needs no build, so a misformatted push fails in seconds.
      - name: Format
        run: cargo fmt --all --check
      # The design tree's files against the forms of design/README.md: it needs no build either.
      - name: Design tree
        run: python3 design/lint.py
      # The page is built into the binary (crates/web/build.rs), so it is built before anything compiles that crate. Its
      # build of the files as they are is kept for every runner of the machine (as fast.yml keeps it), and its
      # dependencies are installed only when their lock changed.
      - name: Build the page
        working-directory: client
        run: |
          tree=$(git rev-parse HEAD:client)
          lock=$(git rev-parse HEAD:client/package-lock.json)
          if [ "$(cat node_modules/.wf-lock 2>/dev/null)" != "$lock" ]; then
            npm ci
            echo "$lock" > node_modules/.wf-lock
          fi
          kept="$HOME/page-builds/$tree"
          if [ "$(cat node_modules/.wf-tree 2>/dev/null)" = "$tree" ] && [ -f dist/index.html ]; then
            :
          elif [ -f "$kept/index.html" ]; then
            # With today's times: cargo takes files older than its last build for unchanged, and would read the old list.
            rm -rf dist && cp -R "$kept" dist
          else
            npm run build
            mkdir -p "$HOME/page-builds"
            tmp=$(mktemp -d "$HOME/page-builds/.new.XXXXXX") && cp -a dist/. "$tmp" && chmod 755 "$tmp" && { mv -T "$tmp" "$kept" 2>/dev/null || rm -rf "$tmp"; }
            find "$HOME/page-builds" -mindepth 1 -maxdepth 1 -mtime +3 -exec rm -rf {} +
          fi
          echo "$tree" > node_modules/.wf-tree
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

  # The Rust tests, which take most of the time, split across three jobs: each builds every test binary and runs a
  # third of each binary's tests (nextest's partition count:k/3).
  test:
    name: test ${{ matrix.partition }} of 3
    runs-on: [self-hosted, 14900k]
    # Not for a fork's pull request: its code must not run on the owner's machine.
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    timeout-minutes: 15
    strategy:
      # Every job runs to its end, so that a red run shows every test that fails.
      fail-fast: false
      matrix:
        partition: [1, 2, 3]
    env:
      CARGO_TERM_COLOR: always
      CARGO_INCREMENTAL: 1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        id: checkout
        with:
          # The commit an engine's request gives; for a pull request or a push, empty, which is the commit of the event.
          ref: ${{ inputs.commit }}
          # No later step pushes, so the token is not left in the checkout.
          persist-credentials: false
          # The checkout the runner keeps from its last run, which only what changed is brought up to date in.
          clean: false
      - id: clean
        run: git clean -ffdxq -e target -e client/node_modules -e client/dist
      - id: path
        run: echo "$HOME/.cargo/bin:/opt/node/bin" >> "$GITHUB_PATH"
      - id: tools
        run: |
          rustc --version
          [ "$(node --version)" = v24.21.0 ]
      # cargo-nextest at the version fast.yml checks for, installed on the machine by hand.
      - id: nextest
        run: cargo nextest --version | grep -q '0.9.146'
      # The page is built into the binary (crates/web/build.rs), so it is built before anything compiles that crate. Its
      # build of the files as they are is kept for every runner of the machine (as fast.yml keeps it), and its
      # dependencies are installed only when their lock changed.
      - name: Build the page
        id: page
        working-directory: client
        run: |
          tree=$(git rev-parse HEAD:client)
          lock=$(git rev-parse HEAD:client/package-lock.json)
          if [ "$(cat node_modules/.wf-lock 2>/dev/null)" != "$lock" ]; then
            npm ci
            echo "$lock" > node_modules/.wf-lock
          fi
          kept="$HOME/page-builds/$tree"
          if [ "$(cat node_modules/.wf-tree 2>/dev/null)" = "$tree" ] && [ -f dist/index.html ]; then
            :
          elif [ -f "$kept/index.html" ]; then
            # With today's times: cargo takes files older than its last build for unchanged, and would read the old list.
            rm -rf dist && cp -R "$kept" dist
          else
            npm run build
            mkdir -p "$HOME/page-builds"
            tmp=$(mktemp -d "$HOME/page-builds/.new.XXXXXX") && cp -a dist/. "$tmp" && chmod 755 "$tmp" && { mv -T "$tmp" "$kept" 2>/dev/null || rm -rf "$tmp"; }
            find "$HOME/page-builds" -mindepth 1 -maxdepth 1 -mtime +3 -exec rm -rf {} +
          fi
          echo "$tree" > node_modules/.wf-tree
      # With the cargo profile ci (Cargo.toml) and nextest's profile ci (.config/nextest.toml), as fast.yml runs them:
      # a test still running at 60 s (the tests of random histories at 300 s) is stopped and fails under its own name.
      # Every test of the job's third runs to its end, so that a red run shows every test that fails, not the first one's.
      - name: Test
        id: tests
        env:
          PARTITION: ${{ matrix.partition }}
        run: |
          cargo nextest run --workspace --locked --cargo-profile ci --profile ci --no-fail-fast \
            --partition "count:$PARTITION/3"
      # What became of each test of the job, in a file named by the job, so that the engine tells what each job
      # reported: a step of the job's own that failed, or its tests' where they wrote nothing, is said in it as a
      # testsuite of the job's name with an error naming the step, as a unit not built is, whatever became of the steps
      # before; a job red with no failed test of its own is then not run again by the check before a merge.
      - name: Name the results
        if: ${{ !cancelled() }}
        env:
          JOB: test ${{ matrix.partition }} of 3
          RESULTS: target/nextest/ci/test ${{ matrix.partition }} of 3.xml
          TESTED: ${{ steps.tests.outcome }} Test
          STEPS: |
            ${{ steps.checkout.outcome }} Check out the commit
            ${{ steps.clean.outcome }} Clear what the last run left
            ${{ steps.path.outcome }} Put the tools on the path
            ${{ steps.tools.outcome }} Check the versions of rustc and node
            ${{ steps.nextest.outcome }} Check the version of nextest
            ${{ steps.page.outcome }} Build the page
        run: |
          junit=target/nextest/ci/junit.xml
          if [ -f "$junit" ]; then mv "$junit" "$RESULTS"; fi
          mkdir -p "$(dirname "$RESULTS")"
          failed=$(printf '%s\n' "$STEPS" | awk '$1 == "failure" { $1 = ""; print substr($0, 2); exit }')
          if [ -z "$failed" ] && [ ! -f "$RESULTS" ] && [ "${TESTED%% *}" = failure ]; then failed=${TESTED#* }; fi
          if [ -n "$failed" ]; then
            suite="<testsuite name=\"$JOB\"><error message=\"the step $failed of the job failed\"/></testsuite>"
            if [ -f "$RESULTS" ]; then
              sed -i "s|</testsuites>|$suite</testsuites>|" "$RESULTS"
            else
              printf '<testsuites>%s</testsuites>\n' "$suite" > "$RESULTS"
            fi
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: junit-${{ matrix.partition }}
          path: target/nextest/ci/test ${{ matrix.partition }} of 3.xml
          if-no-files-found: ignore

  # Red whenever the page, the lint or a job of the tests did not pass, cancelled ones included; and the one place the
  # JUnit of every job is made one artifact, `test-results`, which the engine reads.
  #
  # The jobs of a run are what the engine judges the run by, each by its conclusion; this job prints, in its own log,
  # the steps of each job that did not pass, each after a line as a step begins that names the job, with GitHub's times
  # taken off and its workflow commands stopped, so that they are printed as the job printed them, for whoever reads the
  # run on GitHub.
  check:
    needs: [page, lint, test]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      # To read the logs of the run's other jobs.
      actions: read
    steps:
      # The JUnit of the page and of each third of the Rust tests, in one artifact. Where none was kept (each job was
      # cancelled, say) there is nothing to merge, and the engine says the run uploaded none.
      - uses: actions/upload-artifact/merge@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        continue-on-error: true
        with:
          name: test-results
          pattern: junit-*
      # The ten slowest tests of the run, read from the JUnit the jobs of the tests kept, in the run's summary and its
      # log: what a test costs, for whoever adds one. It never makes the check red.
      - name: The slowest tests
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        # Where no job of the tests kept its results (each was cancelled, say), there is nothing to list, and the step
        # ends without an error all the same: the engine gives an agent every step of this log that holds one. Results
        # kept half written end it so too, the status of the lines below being that of `tee`.
        run: |
          gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --pattern 'junit-[123]' --dir "$RUNNER_TEMP/junit" \
            || { echo "No job of the tests kept its results."; exit 0; }
          python3 -I - "$RUNNER_TEMP/junit" <<'EOF' | tee -a "$GITHUB_STEP_SUMMARY"
          import pathlib, sys, xml.etree.ElementTree as ET
          rows = []
          for path in sorted(pathlib.Path(sys.argv[1]).rglob("*.xml")):
              for case in ET.parse(path).iter("testcase"):
                  rows.append((float(case.get("time") or 0), f"{case.get('classname')} {case.get('name')}"))
          rows.sort(key=lambda r: -r[0])
          print(f"### The ten slowest of the {len(rows)} Rust tests\n")
          print("| Seconds | Test |")
          print("|---:|---|")
          for time, name in rows[:10]:
              print(f"| {time:.1f} | `{name}` |")
          EOF
      - name: Every other job passed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "page, lint and test: $RESULTS"
          red=false
          for r in $RESULTS; do [ "$r" = success ] || red=true; done
          [ $red = true ] || exit 0
          jobs="repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/attempts/$GITHUB_RUN_ATTEMPT/jobs"
          mapfile -t not_passed < <(gh api --paginate "$jobs" --jq '.jobs[]
            | select(.name == "page" or .name == "lint" or (.name | startswith("test ")))
            | select(.conclusion != "success") | "\(.id)\t\(.name)\t\(.conclusion // .status)"')
          stop="stop-$(cat /proc/sys/kernel/random/uuid)"
          for line in "${not_passed[@]}"; do
            IFS=$'\t' read -r id name how <<< "$line"
            echo "##[group]Run the steps of the job $name, which ended in $how"
            echo "##[endgroup]"
            echo "##[error]The job $name ended in $how; its steps follow."
            echo "::stop-commands::$stop"
            # From its first step to the runner's clean-up, as the job printed it: with the escapes that colour it,
            # which gh gives only when told to, and the engine reads a job's log with them.
            if gh api --allow-escape-sequences "repos/$GITHUB_REPOSITORY/actions/jobs/$id/logs" \
              > "$RUNNER_TEMP/log" 2> "$RUNNER_TEMP/why"; then
              sed -E 's/^\xEF\xBB\xBF//; s/^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9:.]+Z ?//' "$RUNNER_TEMP/log" \
                | awk '/^##\[group\]Run /{on=1} /^Post job cleanup/{on=0} on'
            else
              echo "Its log could not be read: $(cat "$RUNNER_TEMP/why")"
            fi
            echo "::$stop::"
          done
          echo "##[group]Run what check found"
          echo "##[endgroup]"
          names=$(printf '%s\n' "${not_passed[@]}" | cut -f2 | paste -sd ',' | sed 's/,/, /g')
          echo "Did not pass: ${names:-no job found; the page of the run says which}."
          exit 1
