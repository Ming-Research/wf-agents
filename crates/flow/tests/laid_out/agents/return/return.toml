# The return of the tests: its form, the part on returning of a line's system prompt, and what a cell is told it
# writes.
[form]
calls = ["tools", "summary"]
outcome = ["dealt_with", "summary", "meaning_unchanged", "reply", "outputs"]

[how_you_return]
heading = "## How you return"
first = "You end every round with one return."
kinds = "A return is `outcome` or `calls`."
item = "- {text}"
listed = ["reply", "summary"]
every_time = "A block marked so you always hand in."
fields = "Fields that are not blocks of the work:"
owner_reads = "The owner reads {fields}."
reads = ["reply", "summary"]
and = " and "
calls = "A tool is asked for under its name."
tools = "## What you may ask the engine for"

[asked]
text = "{ask}\n{options}"
option = "{number}. {does}, {follows}"
recommended = "{number}. {does}, {follows} (yes)"

[outputs]
heading = "## What this cell returns"
block = "- `{block}`{choice}{shown}{must_write}: {what}"
none = "This cell writes no block."
choice = ", a choice, one of {values}"
shown = " (the owner reads it)"
must_write = " (hand it in every time)"
