# A block with no content of each cell that names it, under the block's name below, `{cell}` being the cell's id in
# small letters. What the owner said is in `discussion`. The words of `do` are a draft of the assistant's (2026-11-14),
# from the settled sentence on `reply`, which the owner has not gone through.
what = "Fires when the owner speaks to the cell."
block = "{cell}_spoken_to"
from = "owner"
read = ["discussion"]
do = """The owner has said something to this cell in `discussion`: that comes first; deal with it before the rest of what is new, and answer it in `reply`."""
