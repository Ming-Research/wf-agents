# How cargo-nextest runs the tests. CI runs them with the profile ci (.github/workflows/ci.yml).

[profile.ci]
# A test still running after 60 s is stopped and fails under its own name, instead of holding the job until its time
# limit: no test needs that long. Nextest says at 30 s which tests are getting slow.
slow-timeout = { period = "30s", terminate-after = 2 }

# Item 226 (timing of the counters views): on one commit only. The test runs alone, and is given the time it needs.
[[profile.ci.overrides]]
filter = 'binary(=counters_timing)'
slow-timeout = { period = "300s", terminate-after = 3 }
threads-required = "num-cpus"
