name: ci

# Every check of the code: the page's types, lint, tests and build, then the Rust format, clippy with warnings as
# errors, and the tests. It runs on each pull request into `next` and on each push to `next`, on GitHub's machines from
# a clean start: this is the CI the check before a work's merge waits for. What an agent names to its check while it
# works, and the tests it runs on the code before its change, the fast CI runs instead (fast.yml), on the owner's
# machine; so a push to a branch of the code before a change (`wf-agents-before/`) runs nothing here.
on:
  pull_request:
    branches:
      - next
  push:
    branches:
      - next

permissions:
  contents: read

# A newer push to the same pull request makes the older run pointless; `next` keeps every run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/next' }}

jobs:
  # The owner's page (client/): checked and tested on its own, so that what is wrong with it shows without waiting for
  # the Rust build.
  page:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # No later step pushes, so the token is not left in the checkout.
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.21.0
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm ci
      - name: Type-check the page
        run: npm run typecheck
      - name: Lint the page
        run: npm run lint
      # The page's browser tests (`*.browser.test.tsx`) draw it in headless Chromium: the headless shell of the one the
      # version of Playwright the lock file locks drives, with the system libraries it needs, and nothing more.
      - name: Chromium for the page's browser tests
        run: npx --no-install playwright install --with-deps --only-shell chromium
      - name: Test the page
        run: npm test
      - name: Build the page
        run: npm run build

  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # No later step pushes, so the token is not left in the checkout.
          persist-credentials: false
      # Installs the toolchain rust-toolchain.toml pins, with its components.
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      # Formatting first: it needs no build, so a misformatted push fails in seconds.
      - name: Format
        run: cargo fmt --all --check
      # The page is built into the binary (crates/web/build.rs), so it is built before anything compiles that crate.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.21.0
          cache: npm
          cache-dependency-path: client/package-lock.json
      - name: Build the page
        working-directory: client
        run: |
          npm ci
          npm run build
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      # cargo-nextest at the version fast.yml checks for on the owner's machine, installed where it is absent.
      - id: nextest
        run: if cargo nextest --version 2>/dev/null | grep -q '0.9.146'; then echo "have=true" >> "$GITHUB_OUTPUT"; fi
      - uses: taiki-e/install-action@183e4297cca2404691e9380e1307288dced5c82a # v2.87.25
        if: steps.nextest.outputs.have != 'true'
        with:
          tool: cargo-nextest@0.9.146
      # With the cargo profile ci (Cargo.toml) and nextest's profile ci (.config/nextest.toml), as fast.yml runs them:
      # a test still running at 60 s is stopped and fails under its own name. Every test runs to its end, so that a red
      # run shows every test that fails, not the first one's.
      - name: Test
        run: cargo nextest run --workspace --locked --cargo-profile ci --profile ci --no-fail-fast
      # What became of each test, as nextest's JUnit, whatever became of the step before.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: junit
          path: target/nextest/ci/junit.xml
          if-no-files-found: ignore
