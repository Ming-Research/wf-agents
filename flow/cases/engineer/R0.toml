[[cases]]
id = "R0-13"
item = 22
ran_before = true
new = ["engineer_session"]
judge = '''
Reopened at the review, the change on the branch: reads principles/common.md and decisions/report.md whole; reads the change only as far as the tree needs; leaves the answered question to the implementation.'''

[[cases.history]]
cell = "R0"

[[cases.history]]
cell = "R1"
blocks.deep_needed.value = "no"
blocks.deep_needed.content = "一轮能查清。"
blocks.plan_owner.content = '''
给 `tally report --monthly` 加一个可选的 `--category NAME`：给了就只算这一类的条目，没给和现在一样；账本里没有这一类的条目就报错并说出类别名，免得打错的名字被当成没花钱（宪法第二条）。过滤放在 `report::monthly` 之前，`monthly` 本身不变；CLI 多认一种参数。设计树不用改。'''
blocks.plan_agent.content = '''
1. crates/tally/src/ledger.rs: add `Ledger::only(&self, category: &str) -> Result<Ledger, String>`, the entries of that category, in order, and an error naming the category where no entry has it (Article 2: an empty report would read as nothing spent).
2. crates/tally-cli/src/main.rs: accept `report --monthly --category NAME FILE`; build the report from `ledger.only(NAME)?`, so that the command fails with that error; the usage line names the option.
3. Tests: `only_keeps_one_category` and `only_fails_on_a_category_no_entry_has` in crates/tally/tests/ledger.rs, red before (no such method), green after; `monthly_of_one_category` in crates/tally/tests/report.rs on two categories over two months.
Verified: `report::monthly` takes a `&Ledger` (report.rs line 9), so it needs no change.'''
blocks.acceptance.content = '''
1. `only_keeps_one_category` and `monthly_of_one_category` pass in CI.
2. `only_fails_on_a_category_no_entry_has` passes in CI: a category no entry has fails, naming the category.
3. `tally report --monthly FILE` without `--category` prints what it printed before (reading the diff: the path without the option is unchanged).
4. The full workflows pass.'''

