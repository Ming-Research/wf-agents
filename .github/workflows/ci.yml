name: ci

# Every pushed commit on every branch is checked, not only pull requests: a temporary ref the engine pushes to run
# tests on other code is checked the same way.
on:
  push:
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same branch makes the older run pointless; main keeps every run. So does first-version, which
# works merge into until the first version is reviewed: the engine watches the run on each merge commit.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && github.ref != 'refs/heads/first-version' }}

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Installs the toolchain rust-toolchain.toml pins, with its components.
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.21.0
          cache: npm
          cache-dependency-path: client/package-lock.json
      # Formatting first: it needs no build, so a misformatted push fails in seconds.
      - name: Format
        run: cargo fmt --all --check
      # The page's TypeScript types are generated from the Rust types; the page is checked against what they generate
      # now, and the last step fails when that differs from the committed file. The same run writes the flow as the
      # engine stores it, which the page's tests read.
      - name: Generate the page's types and the flow its tests read
        run: WF_AGENTS_GENERATE=1 cargo test -p api --locked --test typescript
      - name: Install the page's dependencies
        working-directory: client
        run: npm ci
      - name: Type-check the page
        working-directory: client
        run: npm run typecheck
      - name: Lint the page
        working-directory: client
        run: npm run lint
      # Every colour, size and spacing in the page's styles is a token, as its UI spec says
      # (design/harness/owner-interface/ui-spec.md); the tests of the next step leave this to it.
      - name: Check the page against its UI spec
        working-directory: client
        run: npm run check:ui
      - name: Test the page
        working-directory: client
        run: npm test
      # Before any cargo step that compiles the crate the page is built into.
      - name: Build the page
        working-directory: client
        run: npm run build
      - name: Lint
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Test
        run: cargo test --workspace --locked
      - name: The page's types are current
        run: git diff --exit-code -- client/src/api.ts
      # What the Rust types generate, to commit when the step before fails.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: page-types
          path: client/src/api.ts
          if-no-files-found: ignore
