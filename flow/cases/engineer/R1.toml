[[cases]]
id = "R1-01"
item = 21
ran_before = false
new = ["guide", "background"]
results = "defect_monthly"
judge = '''
Sees the defect happen (a red test through run_tests, or the program on its data) and finds the root cause: the key cut to 6 characters in report::monthly; plans the 7-character key with a test red before and green after that asserts the keys; no decision changes (the decision already says YYYY-MM).'''

[cases.owes]
writes = { deep_needed = "no" }
not_writes = ["found"]
changes = ["plan"]
question = "none"

