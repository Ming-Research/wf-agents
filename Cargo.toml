[workspace]
members = ["crates/*"]
resolver = "3"

# Shared by every crate, so the version and the rules the code is held to are set once.
[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
publish = false
repository = "https://github.com/Ming-Research/wf-agents"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

# Versions of the dependencies more than one crate may use, set once.
[workspace.dependencies]
serde = { version = "1.0.229", features = ["derive"] }
toml = "1.1.8"
