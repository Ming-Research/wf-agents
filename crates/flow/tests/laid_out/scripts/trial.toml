# What the agents, the engine's acts and the tools of the trial flow do, for trying it by hand and for the tests; and
# the case it plays (`wf-agents play`), one item the owner answers. Every round takes a second and a half, so that the
# pages show works under way.

# The time the script's play starts at, every other time it names being after it: 2026-11-10, at midnight.
start = 1794268800000

[took]
ms = 1500
usd_micros = 21000
input_tokens = 3200
cached_tokens = 14000
output_tokens = 450

[tools.query]
answer = '{"rows": []}'
ms = 2500

# The plan asks the owner first whether the greeting names the user, and waits for the answer; entered again for it, it
# hands in the plan.
[[flows.trial.rounds]]
cell = "plan"
hands_in = []

[[flows.trial.rounds.questions]]
name = "named"
waits = true
recommends = 1
ask = "Should the greeting name the user?"
options = [
    { does = "Greet the user by name", follows = "A warmer greeting, for a user whose name is known." },
    { does = "Greet without a name", follows = "A plainer greeting, the same for every user." },
]

# The build asks the engine's records whether the item was worked on before, and then hands in the code.
[[flows.trial.rounds]]
cell = "build"
asks = [{ tool = "query", input = '{"sql": "select number from items"}' }]

# The review objects to the first build and is content with the second.
[[flows.trial.rounds]]
cell = "review"
run = 1
hands_in = [
    { block = "opinions", content = "Say what the greeting does when the name is empty." },
    { block = "verdict", value = "no" },
]

[[flows.trial.rounds]]
cell = "review"
run = 2
hands_in = [{ block = "verdict", value = "yes" }]

[[flows.trial.rounds]]
cell = "merge"
took = { ms = 500 }

# The case: one item, whose plan asks the owner, who answers; the build asks for the query, the review objects to the
# first build and is content with the second, and the work merges.
[[items]]
title = "Greet the user"
flow = "trial"
writes = [{ block = "request", content = "Greet the user, please." }]
acts = [
    { at = { waits = "plan", for = "answer", question = "named" }, do = "answer", question = "named", option = 1 },
]
path = [
    { runs = "plan" },
    { waits = "plan", for = "answer", question = "named" },
    { runs = "plan" },
    { runs = "build" },
    { waits = "build", for = "tool" },
    { runs = "build" },
    { runs = "review" },
    { runs = "build" },
    { runs = "review" },
    { runs = "merge" },
    { ends = "merged" },
]

# To see a round fail and its work paused with the reason, give a round `fails`, as here the plan's second run:
# [[flows.trial.rounds]]
# cell = "plan"
# run = 2
# fails = "The agent's program could not start."
