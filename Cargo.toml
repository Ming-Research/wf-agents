[workspace]
members = ["crates/*"]
resolver = "3"

# Shared by every crate, so the version the command reports and the rules the code is held to are set once.
[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
publish = false
# Where wf-agents is developed: the engine knows by it which project of a configuration is wf-agents itself.
repository = "https://github.com/Ming-Research/wf-agents"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
