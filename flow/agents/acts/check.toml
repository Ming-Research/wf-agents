# What the engine's act `check` writes: into its choice, `first`, then `passed`, `failed`, or `held` where what fails
# also fails on main; into each other block it writes, where it wrote `failed`, `first`, then `why`. After any of them,
# `took_in` where the engine took main in for the check, and `notes` where the host said more. The parts are joined by
# a blank line. The act `merge` reads back the commit it is to merge from the first line of the choice, after what
# `first` writes before `{commit}`.
#
# Filled in a run: `{commit}` the commit checked; `{main}` the main branch's name; `{head}` the head of main it was
# checked against; `{checked}` what `checked` says, `{by}` in it what `by` says where the host says what judged it and
# nothing where it does not; `{why}` what failed, as `found` says where it was found before the host was asked, or as
# the host said it; `{notes}` each thing the host said, as `note` says.
first = "Checked commit {commit}"
checked = "The work's branch was checked against {main} at {head}{by}"
by = " by {by}"
passed = "{checked}: it passed."
failed = "{checked}: it did not pass."
why = "{checked}. {why}"
held = "{checked}: it did not pass, and what fails here also fails on {main}. The work waits for {main} to pass, and is checked again each time {main} moves.\n\n{why}"
took_in = "For the check, the engine merged {main} at {head} into the work's branch in the commit {commit}, which is now in the worktree."
notes = "Also:{notes}"
note = "\n- {note}"

# What the check says where the project declares no workflows (`[ci]` of its declaration), so that it has none to run.
no_full = "Nothing was run: the project declares no workflows, so the check before the merge has none to run."

# What the check before a merge says where its full workflows failed tests and nothing else, which it runs again by the
# fast workflow: on the commit, beside every check the fast workflow runs by name; and what failed again there, on the
# head of main. `{why}` why they were not run again; `{run}` what a run found, as a result says it; `{main}` the main
# branch's name, `{head}` its head; `{test}` a test, `{commit}` the commit checked, `{failed}` the links of the full
# workflows' runs, `{again}` the link of the run again on the commit; `{tests}` tests, each as `test_named` says it,
# joined by `tests_between`. A test that failed and then passed is said as `flaky` among the check's notes, and kept
# as an observation in the same words.
again_not_run = "What failed was not run again: {why}"
again_on_commit = "The fast workflow ran what failed again on the commit, together with every check it runs by name:\n\n{run}"
again_on_main = "What failed again was run on the head of {main}, {head}:\n\n{run}"
flaky = "The test `{test}` failed on the full workflows of the commit {commit} ({failed}) and passed when the fast workflow ran it again on that commit ({again}): it may be flaky."
only_here = "These failed again on the commit, but not on the head of {main}: {tests}."
on_main_too = "These failed on the commit, failed again when they were run again, and also failed on the head of {main}, {head}: {tests}."
test_named = "`{test}`"
tests_between = ", "

# The values the check writes in its choice, by name: a flow whose cell of `check` has a choice that does not offer
# both is not run with the real carriers.
[values]
passed = "yes"
failed = "no"

# What was found before the host was asked, and written into the check's blocks, which the agents read. Filled in a run:
# `{files}` the files in conflict, `{kinds}` the kinds of their conflicts; in `protected`, the files the work's own
# change touches under the paths the project protects, one to a line, and `{question}` the name of the question the
# engine asks the owner of them; `{why}` why that change could not be looked at; in `empty`, `{main}` and `{head}` as
# above, where the commit checked holds nothing that main does not; in `tree_unchanged`, `{questions}` the names of the
# questions marked `tree` that have the owner's answer to their latest version, one to a line, where the work's change
# against main changes nothing in the design tree, and `{main}` as above. Where both `conflict` and `tree_unchanged`
# are found, both are said, a blank line between.
[found]
conflict = "The branch does not merge into {main} at {head} without a conflict:\n{files}\n{kinds}"
tree_unchanged = "These questions are marked `tree` and have the owner's answer, but the work's change against {main} changes nothing in the design tree: write the option taken in each into the tree, as its rules say.\n{questions}"
protected = "The work changes files the project protects, and the owner has not let this change merge. It merges only once the owner lets it, or once the work no longer changes those files. The engine asks the owner in the question `{question}`, and the work receives the answer as the owner's.\n{files}"
protected_unread = "The engine could not look at the change to the files the project protects, and the work does not merge until it can: {why}"
empty = "The work's branch changes nothing against {main} at {head}: there is nothing to merge."

# Where the work's head is not the one the review dealt with: the check fails in passing, and the review runs first.
# Filled in a run: `{head}` the work's head.
unreviewed = "The work's head is {head}, which the review has not seen yet. The check runs again once the review has seen it."

# What the check says where a merge begun in the worktree is not committed: the check merges main into the branch, which
# a merge under way would have taken back, and the engine takes back no merge it did not begin. It is shown to the owner,
# whom the work waits for, and written into no block. Filled in a run: `{main}` the main branch's name; `{changes}` what
# git says the worktree holds uncommitted.
[refused]
merging = "A merge begun in the worktree is not committed. The check merges {main} into the branch, which that merge stands in the way of, and the engine takes back no merge it did not begin: finish the merge and commit it, or take it back, then let the work go on.\n{changes}"
