# The settings of an installation of wf-agents: `install.toml` in the data directory, or the file
# `wf-agents run --settings <file>` names. `wf-agents run` without `--script` reads it. A key not written here is
# refused.
#
# A text the agents are given (the engine's own words, the rules for the agents, the words of the return's fields and
# of the tools, all beside the flows) may name by its key between backticks, as `owner.language`, a setting of these
# that `names` in `agents/installation.toml` beside the flows lists: the agent is given its value beside the name. A
# flow whose texts given to a line name one these settings have no value for is refused as the engine starts.

[owner]
# The language the agents write in what the owner reads, technical terms in their English original.
language = "Chinese"

# The projects the works are done in, each a table named by the name the installation gives it, by which items and the
# page know it: an item belongs to one project, and its works run in that project's repository, with what the project
# declares in wf-agents.toml at the root of its repository, on its main branch (its design tree, its files the agents
# are given, its settings, its tests and workflows, its heavy commands, the command that checks it where the
# local repository is the host, and how its pull requests are merged where GitHub is). This file holds only what is of
# this machine. Item numbers are one sequence across the projects, and an item may depend on an item of another
# project, waited for as any other. Two projects never name one repository. A project whose declaration cannot be read
# is held: its works are paused, saying why, and the others go on.
[projects.example]
# The local git repository the works are done in: its own checkout, which stays on the main branch. Each work has a
# branch `work-<n>` and a worktree `<data>/worktrees/<n>` made from the main branch's head, and is merged here; with
# [projects.example.github] below, the repository is a clone of the one on GitHub, and the works are merged there.
repo = "/path/to/the/repository"
# The repository's main branch.
main = "main"
# The acts refuse a repository whose own configuration could make git run a program (a filter, a merge driver, a
# hooks directory, an included file and the like). A key the repository needs is allowed here, whole or as a beginning
# followed by `*`.
# allowed_config = ["filter.lfs.*"]

# The repository on GitHub, where GitHub is the host: with this table, the check before a work's merge pushes the work's
# branch to GitHub, opens its pull request into the main branch where it has none, and runs the project's full
# workflows on the pushed commit, once; the agents' tool `run_tests` pushes the commit it runs to a branch of its own,
# deleted when the run's result is read, and has only the tests and checks a request names run, by the project's fast
# workflow, on the commit the request names or else the work's last commit; nothing is run on this machine. Both
# workflows are declared in the project's wf-agents.toml, with how the pull request is merged. Without this table, the
# local repository is the host, and the project's wf-agents.toml names the command that checks it.
# The engine needs `git` and `gh`, and its own token for GitHub in its environment: a fine-grained token for the
# project's repository, with Contents and Pull requests read and write, Checks and Commit statuses read, and Actions
# read and write, for the workflows it runs by hand. The engine itself never pushes a change to the project's workflow
# files; a work's commit that changes them is pushed only with Workflows read and write (the `workflow` scope of a
# classic token), and without it GitHub refuses that push, which the agent is told. Each project's table names its
# own repository, and may name a token of its own.
# [projects.example.github]
# # The repository on github.com, as owner/name.
# repository = "owner/name"
# # The clone's name for the repository on GitHub: main's head is fetched to refs/remotes/<remote>/<main>.
# remote = "origin"
# # The variable of the engine's environment that holds its token. No agent is given it.
# token_env = "WF_GITHUB_TOKEN"
# # A run of a workflow that is not listed, or never leaves the queue, after this many minutes: the CI never started.
# # The engine cancels the run it asked for, and the check fails its round in passing and is tried again after a wait,
# # or the agents' tool says so.
# start_minutes = 10
# # The gh command line, or a path to it.
# gh = "gh"
# # The runners the project's repository has: `github` for GitHub's own machines, and the label of each self-hosted
# # runner registered for it. A workflow of the project (its `ci.fast`, `ci.full` and `ci.measure` in wf-agents.toml)
# # names the runner it runs on, and is not run where the repository lacks it.
# runners = ["github"]

[agents]
# The command line program that runs an agent's round: `claude`, or a path to it. Every agent is refused it, so that
# no agent runs the program itself, where nothing counts what it spends. What agents may do is not set here: it is
# `allowed.toml` beside the flows, and the program is given the same on every machine.
command = "claude"
# How many agents' rounds run at once; the others wait their turn.
slots = 2
# The highest level one round may run at: a round of a line that runs above its item's level goes no higher. It is no
# lower than items.highest_level, so that a round of an item at its highest level can run at it. Left out, the top
# level.
highest_level = "4"
# The program is given only these variables of the engine's environment: PATH, HOME, USER, LANG and LC_*, TMPDIR, TERM
# and SHELL, and those named here, such as a proxy; none of them reaches a command an agent runs, which the program is
# told to scrub of credentials. The program runs under no credential but the accounts added on the Settings view: a
# round and a keep-warm ping under the account in use, a fork under its session's account or the one in use, a look at
# the usage under each account, and the check of a token under that token. ANTHROPIC_API_KEY and ANTHROPIC_AUTH_TOKEN,
# which the program would take above an account's token, are refused, and so are the carrier's own variables,
# CLAUDE_CODE_OAUTH_TOKEN, CLAUDE_CONFIG_DIR and CLAUDE_CODE_SUBPROCESS_ENV_SCRUB. The program's directory of settings
# and sessions is the engine's, profile/ in the data directory, made where it is missing; the engine does not start
# while its settings.json names apiKeyHelper, one of those credentials in its env, or a permission mode
# (permissions.defaultMode), which the program ignores under the engine's variable.
# env = ["HTTPS_PROXY"]
# What a work's rounds may spend in all, in dollars: once a round ends with the work over it, the work is paused for
# the owner, who may let it on. Left out, there is no budget.
work_budget_usd = 5.0
# What each letting-on of a work the engine paused for its budget allows it beyond what it had spent by then, in
# dollars. Without it a work let on would end its next round over the budget and wait for the owner again, so that
# each letting-on bought one round. A letting-on after any other pause, as of a work you paused yourself, allows
# nothing more. Left out, it is 20.
let_on_allowance_usd = 2.0
# How many subagents an agent may start within its round at most, for chores such as reading documents or searching
# code: the agents are given it where a text names `agents.subagents.most`. Left out, it is 3.
# subagents = { most = 3 }

# The levels of work, each a table named by the level: what work it is for and the model its rounds are run with, as
# --model takes it. An item's level chooses the model of its agents' rounds; a line of the flow may run some levels
# above its item's. The levels go in the order of their names, by number where they are numbers.
[agents.levels.1]
desc = "Easy work: small and clear, with little to work out"
model = "claude-haiku-5-5"

[agents.levels.2]
desc = "Work of ordinary difficulty"
model = "claude-sonnet-5-5"

[agents.levels.3]
desc = "Work level 2 cannot do: an item is raised to it only when that is really needed"
model = "claude-opus-5-5"

[agents.levels.4]
desc = "The hardest work"
model = "claude-fable-5-1"

[items]
# The level an item is added at where it is given none.
default_level = "2"
# The highest level an item may be at: an item above it is refused as it is added. A line of the flow may run a round
# above it, up to agents.highest_level. Left out, the top level.
highest_level = "3"
# The most words an item's title may have, a Chinese character counting as a word: 20 allows 20 English words or 20
# Chinese characters. A title is held to it when it is made or changed. There is no default.
title_max = 20

[sessions]
# A line of a work keeps one session of the program from round to round. The program is given this many tokens on every
# round's command line as the context at which it compacts the session, so that the line goes on in it; no session is
# begun anew for its size, nor for another account. A line still begins one where the model is no longer the one its
# session was begun with, and where its last round was flagged by the service's safety check, stopped by the run guard,
# or had a prompt too long for the model. Between 100000 and 1000000, the range the program takes. Left
# out, it is 500000.
compact_at = 500000
#
# How long the program keeps a session in its prompt cache after its last call, in minutes: an hour for `claude`, whose
# usage says each write to the cache is kept an hour. 0 for a program that keeps none. Left out, it is 60.
cache_minutes = 60
# A session whose line waits is sent a keep-warm ping this many minutes after its last call, so that the cache does not
# let it go: five before it would, time for the ping and four tries again a minute apart. A wait is sent as many as
# cost, each reading the session, no more than writing it again would beyond reading it, at its model's prices: 39 on
# Opus and Sonnet 5.5, 19 on Haiku 5.5, 79 on Fable 5.1. Left out, it is 55.
warm_minutes = 55

# The copies of the engine's database. Every day while the engine runs, it copies the database whole into
# `backups/` in the data directory and keeps the newest `keep` there. Without this table, that is all: the copies share
# the disk they are kept against losing, so they do not guard against its loss, and the owner's page says so. With it,
# each copy is also compressed and uploaded as an asset of the release `database-backups` of a repository on GitHub,
# the newest `keep` kept there too. The database holds everything said to every agent, so the repository must be
# private: it is asked before every upload, and one that is not is refused. It is not the project's repository, and
# it has a token of its own: a fine-grained token for that one repository, with Contents read and write.
# [backup]
# # The private repository on github.com, as owner/name.
# repository = "owner/name"
# # The variable of the engine's environment that holds its token for it. No agent is given it, and it is not the
# # project's.
# token_env = "WF_BACKUP_TOKEN"
# # How many copies are kept, the newest, on the machine and off it.
# keep = 7
# # The gh command line, or a path to it.
# gh = "gh"
