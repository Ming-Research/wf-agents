[[cases.history]]
cell = "D1"
blocks.plan_owner.content = '''
两百万行上 50 ms 内出月报，账本仍是那一个 CSV 文件（宪法第一条）。研究在 CI 上、同一个按固定种子生成的两百万行账本上试了三条路，各跑十次取中位数：边读边加 32 ms；内存映射加同样的解析 30 ms，但多一个依赖 `memmap2` 和一段 `unsafe`；把整块文本分到四个线程解析 58 ms，还要在块的边界上处理行号。选边读边加：够快，不加依赖（宪法第三条）。月报改为一行一行地读，每行只在借来的切片上检查和取值，不建 `String`，每月一个和；读不了的行仍让命令失败并说出行号（原则 no-silent-skips）。`tally total` 和 `tally categories` 不变。决定 reports-read-the-whole-file 对月报不再成立，改写成新的决定。'''
blocks.plan_agent.content = '''
1. crates/tally/src/entry.rs: split `Entry::parse` in two: `Fields::parse(line) -> Result<Fields<'_>, String>` checks a line on borrowed slices (a date as `YYYY-MM-DD`, an amount by `amount::parse`, a category; the note is the rest), and `Entry::parse` makes its `Entry` from the `Fields`, so a line is checked one way for both readings.
2. crates/tally/src/report.rs: `monthly_streamed(reader: impl BufRead) -> Result<Vec<(String, Amount)>, String>` checks the header as `Ledger::parse` does, reads a line at a time into one reused `String`, skips blank lines, parses each with `Fields::parse`, and adds its amount to its month, `date[..7]`, in a `BTreeMap`; a line that cannot be read fails with its number. `monthly(&Ledger)` stays, for the library's callers.
3. crates/tally-cli/src/main.rs: `report --monthly FILE` opens FILE in a `BufReader` and prints `report::render(&report::monthly_streamed(reader)?)`.
4. Tests: `streamed_monthly_matches_monthly` (examples/ledger.csv gives the same rows both ways) and `a_bad_line_fails_the_streamed_report_with_its_number` in crates/tally/tests/report.rs, neither building before the change (no `monthly_streamed`), both passing after; the tests of `Entry::parse` in crates/tally/tests/ledger.rs pass unchanged.
Verified: the three ways' times are the research's, measured with run_tests on its prototypes (https://ci.example.invalid/tally/runs/5187, 5191, 5203); the stream's 32 ms is 18 ms of reading and 14 ms of parsing and summing.'''
blocks.acceptance.content = '''
1. `streamed_monthly_matches_monthly` and `a_bad_line_fails_the_streamed_report_with_its_number` pass in CI.
2. The median of ten runs of `tally report --monthly` on the two-million-line ledger generated from the research's fixed seed is under 50 ms, measured in CI as the research measured it, its run named by its link.
3. The full workflows pass.'''
blocks.tree_edits.content = '''
In design/decisions/report.md, the decision reports-read-the-whole-file is deleted and this one written:

### decision the-monthly-report-reads-a-line-at-a-time
The monthly report reads the ledger a line at a time and keeps only each month's sum, checking each line as every reading of the ledger does; the total and the categories still read the whole file, as no time is asked of them.
Why: The monthly report must take under 50 ms on the two million lines the owner's ledger is to reach (Article 3): reading the whole file first took 410 ms there, most of it making each entry, and the stream 32 ms. Mapping the file into memory was 2 ms faster but was turned down for a dependency and unsafe code; parsing on four threads was slower, 58 ms.'''

