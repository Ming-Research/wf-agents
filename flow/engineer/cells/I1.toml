# Why this cell exists: so that the plan is built, and handed on only with what shows it works: the check passing on
# the last commit, and evidence for each acceptance condition.
title = "Implement"
kind = "agent"
line = "engineer"
effort = "xhigh"
takes_main = true
task = '''
Implement `plan_agent`, changing only what this work needs. For each question put to the owner, follow the option the
owner took, or else the one it recommends. For each answered question marked `tree`, write the option taken into the
design tree, as its rules say. If main's tree has changed since, an entry may follow its wording and place, but not
change its meaning. After you change the tree, run `project.tree_check` and fix what it
finds before you run the project's check.

Start from a test that shows what the change is for, red on the code before the change: use the research's test where
it left one. Run each test you add or extend both on the change and on the code before it. A test that you remove, skip
or weaken needs a technical reason. Where the cost per operation or request can change, measure what could get slower
as well as what the change is for.

If the plan does not hold (its direction is wrong, or it needs a decision of the tree changed, or a choice the owner
has not made, such as accepting a slowdown), do not work around it. Say where and why in `plan_doubts`. The answer
comes there too: judge it, and write `plan_doubts` again only where a doubt still stands.

Commit everything in the worktree, and hand in `code`, `decisions` and `evidence` once the project's check passes on
your last commit. Hand in `title` with your first `code`, and again when what the change does changes; `decisions` only
where there is one; and `acceptance` only when a condition must change, as the whole list as it now stands, with why.

If main does not merge into the branch, merge it in yourself and run the check again. Fix a point its judge insists
on, or have the owner rule on it. If what the item asks needs no change, ask the owner.
'''
# Run only on a plan its reviews passed (decision the-implementation-waits-for-the-plans-verdicts).
requires = { plan_ok = "yes", tree_ok = "yes" }
watches = [
  "plan",
  "plan_doubts",
  "review",
  "test_review",
  "design_review",
  "testing",
  "check",
  "i1_questions",
  "i1_words",
]
reads = ["background", "tree"]
outputs = [
  "code",
  "title",
  "decisions",
  "evidence",
  "acceptance",
  "review",
  "test_review",
  "design_review",
  "testing",
  "plan_doubts",
  "i1_questions",
  "i1_words",
]

# What the cell does when each datum it watches is new; a datum with none is the task's alone.
[do]
plan = """Look at what changed in the plan since the version you last built from (all of it, if you have built from none), and bring the code up to date with it."""
i1_words = """The owner has written to you in `i1_words`: deal with that first. Do what it says, and answer in `i1_words` with what you changed for it, or why not."""
i1_questions = """The owner has answered one of your questions in `i1_questions`, either with an option other than the one you recommended or one you were waiting for: follow the option the owner took."""
review = """Answer each point in `review` there: fixed, with its commit, or why not. Settle a dispute over a fact with a run."""
test_review = """Answer each point in `test_review` there: fixed, with its commit, or why not. Settle a dispute over a fact with a run."""
design_review = """Answer each point in `design_review` there: fixed, with its commit, or why not. Settle a dispute over a fact with a run."""
testing = """Answer each point in `testing` there: fixed, with its commit, or why not. Settle a dispute over a fact with a run."""
check = """Fix what `check` found and commit. If you judge it is not this change's to fix, ask the owner."""

# `all` for a dialogue, `last_and_latest` where the cell works from what changed, `latest` for the rest. The cell's own
# questions and words are of the kind every agent cell takes them in.
[kinds]
# Given as the files that changed since the tree this session read.
tree = "last_and_latest"
background = "latest"
plan_owner = "last_and_latest"
plan_doubts = "all"
plan_agent = "last_and_latest"
acceptance = "last_and_latest"
review = "all"
test_review = "all"
design_review = "all"
testing = "all"
check = "latest"
