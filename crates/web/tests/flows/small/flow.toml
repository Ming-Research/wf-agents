# A small flow to show on the page and to test the page's interface with: a plan a review can send back, a design
# when the review asks for one, answers to comments, a check with the latest main and the merge.
name = "small"
order = ["plan", "judge", "design", "answer", "check", "merge"]

[limits]
runs = 3
returns = 2
calls = 40

[lines.engineer]
[lines.review]

[blocks.request]
people = true

[blocks.plan]

[blocks.opinions]
people = true

[blocks.needs_design]
values = ["yes", "no"]

[blocks.design]

[blocks.comments]
people = true

[blocks.reply]
shown = true

[blocks.main]
outside = "main"

[blocks.ci]
values = ["green", "red"]

[blocks.commented]
values = ["yes", "no"]
people = true

[blocks.confirmed]
values = ["yes", "no"]
people = true

[tests.has_comment]
says = "The item has a comment"
kind = "any"
reads = ["commented"]
is = "yes"

[tests.plan_confirmed]
says = "The owner confirmed the plan"
kind = "all"
reads = ["confirmed"]
is = "yes"

[tests.may_merge]
says = "The work may merge"
kind = "none"
reads = ["ci"]
is = "red"
