[package]
name = "engine"
description = "The wf-agents engine: runs each work through the compiled flow."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
config = { path = "../config" }
db = { path = "../db" }
flow = { path = "../flow" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["preserve_order"] }

# Its own `main`: the test starts a copy of itself as the process that holds the lock.
[[test]]
name = "lock_process"
harness = false

[lints]
workspace = true
