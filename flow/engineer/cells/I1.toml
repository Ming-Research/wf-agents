# Why this cell exists: so that the plan is built, and handed on only with what shows it works: the check passing on
# the last commit, and evidence for each acceptance condition.
title = "Implement"
kind = "agent"
line = "engineer"
effort = "xhigh"
takes_main = true
task = '''
Implement `plan_agent`, changing only what this work needs. Follow for each of `questions` the option the owner took
in `answers`, or else the one it recommends, and write into `design/` what `tree_edits` holds: an entry may follow
main's tree in wording and place, not in meaning. Start from a test that shows what the change is for, red on the code
before it: the research's, where it left one. Run each test you add or extend on the change and on the code before it;
a test removed, skipped or weakened needs a technical reason. Where cost per operation or request can change, measure
what it can make slower as well as what it is for.

Where the plan does not hold (its direction is wrong, or it needs a tree decision changed or a choice the owner has
not made, such as accepting a slowdown), do not work around it: say where and why in `plan_doubts`, and
judge the answer in `reply_plan_doubts`.

Commit everything in the worktree, and hand in `code`, `decisions` and `evidence` once the project's check passes on
your last commit: `decisions` only where there is one, and `acceptance` only when a condition must change, the whole
list as it now stands, with why.

A red check is fixed, or shown not to be this change's. Where main does not merge into the branch, merge it in
yourself and run the check again. A point its judge insists on, fix or have the owner rule. If what the item asks
needs no change, ask the owner.
'''
triggered_by = [
  "on_plan",
  "on_reply_plan_doubts",
  "on_spoken",
  "on_answer",
  "on_review",
  "on_testing",
  "on_check",
]
context = [
  "background",
  "plan_owner",
  "plan_agent",
  "questions",
  "answers",
  "acceptance",
  "tree_edits",
  "reply_plan_doubts",
  "discussion",
  "review",
  "testing",
  "check",
  "plan_doubts",
  "tree",
]
outputs = [
  "code",
  "decisions",
  "evidence",
  "acceptance",
  "reply_review",
  "reply_testing",
  "reply_check",
  "plan_doubts",
  "discussion",
]

# What the cell does when each trigger fires; a trigger with none is the task's alone.
[do]
on_plan = """See what changed in the plan since the version you last built from, the whole of it where you built from none, and bring the code to it."""
on_spoken = """The owner has said something to you in `discussion`: that comes first. Do what it says, and answer it in `reply`: what you changed for it, or why not."""
on_answer = """The owner has answered one of your questions in `answers` with another option than yours, or one you wait for: follow the option the owner took."""
on_review = """Answer each point of `review` in `reply_review`: fixed, with its commit, or why not, a dispute over a fact settled by a run."""
on_testing = """Answer each point of `testing` in `reply_testing`: fixed, with its commit, or why not, a dispute over a fact settled by a run."""
on_check = """Answer each point of `check` in `reply_check`: fixed, with its commit, or why not, a dispute over a fact settled by a run."""

# `all` for a record, `last_and_latest` where the cell works from what changed, `latest` for the rest.
[kinds]
# Given as the files that changed since the tree this session read.
tree = "last_and_latest"
background = "latest"
plan_owner = "last_and_latest"
plan_doubts = "latest"
plan_agent = "last_and_latest"
questions = "latest"
answers = "all"
acceptance = "last_and_latest"
tree_edits = "last_and_latest"
reply_plan_doubts = "latest"
discussion = "all"
review = "latest"
testing = "latest"
check = "latest"
