name = "engineer"

# The order of the walk, from the first cell to the merge.
order = ["S1", "R0", "R1", "R2", "D1", "D2", "P1", "P2", "I1", "T1", "T2", "T3", "T4", "M1", "M2"]

# The engine's own data this flow uses, each defined once in `../data/`; a datum each cell has its own of, in
# `../data/of_a_cell/`, is used where a cell names it. The flow's own data are in `blocks/`,
# its lines in `lines/`, its named tests in `tests/` and its cells in `cells/`, one file each.
data = ["start", "background", "dependencies", "asked", "tree", "head", "main"]

# What the item's card shows the owner of the work, in this order: the page shows what this names, and names no datum
# of its own.
card = ["background", "plan_owner"]

# The cell in whose questions the engine asks what it asks of a work, such as whether a change of a file the project
# protects may merge: one that can change the work as the answer asks, and can be spoken to (design document
# `data-and-context`, 34).
engine_asks_in = "I1"

# The engine's tools every agent cell of the flow may ask for, each defined once in `../agents/tools/`. The form of a
# return holds them, the same for every line of the flow (`../agents/return/return.toml`).
tools = ["query", "run_tests"]

# The table of earlier ids: each time cells are numbered anew, a renumbering added at the end, oldest first, naming each
# cell whose id changed by the id it had, with the id it takes, and each cell taken out by the id it had, a stage's last
# among them, as `{ ids = { T2 = "T4" } }` or `{ ids = { T4 = "T3" }, taken_out = ["T3"] }`. What a work recorded on an
# earlier version reads through the renumberings after that version's own, a datum made for a cell following its cell
# (decision the-table-of-earlier-ids-is-a-list-of-renumberings). Only added to.
earlier_ids = []

# What every agent cell of the flow reads beside what its own file names, given first: every cell's questions and every
# cell's words, so that what was asked, answered and said is known to the whole work (design document
# `data-and-context`, 15, 33, 35). `{each}_` names each cell's own datum.
[every_agent]
reads = ["{each}_questions", "{each}_words"]

[every_agent.kinds]
"{each}_questions" = "all"
"{each}_words" = "all"

# The blocks of the plan and of the change, each watched or read as one: a new version of any of them is new to a cell
# that watches the group, and its round deals with the group by its name (design document `data-and-context`, 12).
[groups]
plan = ["plan_owner", "plan_agent", "acceptance"]
change = ["code", "title", "decisions", "evidence", "tests", "head"]

# Chosen, not measured.
[limits]
runs = 5
returns = 3
calls = 40
