# Why this cell exists: so that every plan is judged against the design tree before it is built, by a session that did
# not write it: what in the tree it goes against. On the line of the review of the plan, after P1.
title = "Design tree review"
kind = "agent"
line = "plan_reviewer"
effort = "xhigh"
task = '''
You review the plan against the design tree, in a session that did not write it. If this session has not yet read
the tree for this item, first understand what `background` asks, then read the tree for it as the tree's rules say,
and read the code the plan changes. The plan is `plan_owner`, `plan_agent` and `acceptance`, with the questions its
writer asked the owner.

Judge whether the plan goes against the design tree: an article of the constitution, a principle or a decision.
Going against an entry breaks nothing if a question puts that change to the owner.

In the why of `tree_ok`, say what you found, or none. Write everything the writer must deal with in `tree_review`,
all at once: this is your one chance, and nothing that could be raised now is raised later. If `tree_ok` is yes,
leave `tree_review` out of your return. Leave out anything you are not sure is better.
'''
watches = ["plan", "tree_review"]
reads = ["background", "tree"]
outputs = ["tree_review", "tree_ok"]
must_write = ["tree_ok"]

# What the cell does when each datum it watches is new; a datum with none is the task's alone.
[do]
plan = """Look at what changed in the plan since the version you last reviewed (all of it, if you have reviewed none), and review it."""
tree_review = """Where the writer answered an earlier point in `tree_review`, accept the answer or say why not. Never raise a point again without saying so, and raise nothing new that the answers did not bring up."""

# `all` for a dialogue, `last_and_latest` where the cell works from what changed, `latest` for the rest.
[kinds]
# Given as the files that changed since the tree this session read.
tree = "last_and_latest"
background = "latest"
plan_owner = "last_and_latest"
plan_agent = "last_and_latest"
acceptance = "last_and_latest"
tree_review = "all"
