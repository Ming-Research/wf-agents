# The project the flows work on: its own files, which the engine gives every agent as they are in the project's
# checkout, and its settings, which the words sent to the agents name as `project.<name>`. A path is from the root of
# the project's checkout.

# The project's guide for its agents.
[files.guide]
path = "AGENTS.md"

# The constitution of the project's design tree.
[files.constitution]
path = "design/constitution.md"

# The rules of the project's design tree.
[files.tree_rules]
path = "design/README.md"

# The installation's settings a text sent to an agent may name, whose values the engine fills in from the
# installation: not the project's, so they are named here and kept there.
[installation]
names = ["owner.language", "agents.subagents.most"]

[project]
# Where an agent keeps what it makes for research, committed.
research = "research/"
# How an agent names a test to `run_tests`, by the name the project's test runners give it.
test_names = '''
An agent the engine runs names to `run_tests` a test by the name its results give it, ending at
the test's own name: a Rust test by its function's name, or with its module path and its test binary before it
(`tests::a_row`, `carry tools::tests::a_row`); a page test by its own title, or with the titles of its describes
before it, joined by ` > `, its file counted from `client/` (`src/x.test.ts > a describe > its title`). A binary, a
module, a file or a describe alone names no test. The page's browser tests (`*.browser.test.tsx`) start Chromium
only in a run that names one.'''

# Where the project's tests are, as git pathspecs, and the data its tests expect.
[tests]
paths = [
  ":(glob)crates/**/tests/**",
  ":(glob)crates/**/tests.rs",
  ":(glob)client/**/*.test.ts",
  ":(glob)client/**/*.test.tsx",
]
expected = ["crates/carry/tests/fixtures/", "crates/flow/tests/laid_out/"]

# The project's two workflows, which the engine runs by hand on main's file with a commit given. Each reports every test
# as JUnit XML, named as an agent asks for it, in the artifact `test-results`.
[ci.fast]
# Builds and runs only the tests and checks it is given.
workflow = "fast.yml"
runner = "14900k"
checks = ["lint"]

[ci.full]
# Every job required to merge, run once before the merge.
workflows = ["ci.yml"]
runner = "github"
too_long = "2h"
