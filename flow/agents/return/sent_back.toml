# What a round is told of the return before it that was sent back: each thing wrong with it, on a line of its own, and
# nothing else (design statement 31). The engine finds them all in one pass, so one return sent back names everything
# wrong with it.

heading = "## What you returned was sent back"
# The same, of an earlier round of the run, told to a session that never saw it: `{round}` its number.
earlier = "## Round {round} of this run: what you returned was sent back"
# An item of the list: `{text}` the words of one thing wrong, from `[faults]`.
item = "- {text}"
# Between two names where a text names several, as the values of a choice.
between = ", "
again = "Return again, with everything this return should say in one return."

# The words of each thing that can be wrong. In a text, `{block}` is a block's name; `{name}` a name as the return wrote
# it, or, of what it dealt with, the name of the block or group; `{value}` a value it wrote; `{values}` the values of a
# choice, each between backticks, joined by `between`; `{version}` a version's number; `{why}` why what came back could
# not be read; `{path}` a file's path; `{changes}` what git says the worktree holds that is not committed.
[faults]
# The block is not one the cell writes in `outputs`: no block of the cell's.
not_an_output = "`{block}` is not a block this cell writes in `outputs`."
written_twice = "`{block}` is written twice."
# A choice not written as `value` and `why`.
no_value = "`{block}` is a choice: write it with `value`, one of {values}, and `why`."
not_a_value = "`{value}` is not one of the values of `{block}`, which are {values}."
# A block that is no choice, not written as a string.
not_a_choice = "`{block}` is not a choice: write its whole new version as a string."
not_handed_in = "`{block}` is not handed in, and this cell must hand it in every time, even unchanged."
# A choice, `{block}`, written with `{value}`, which its file says a return holds with nothing but some other blocks
# (`with_nothing_but`), and the other blocks this return holds, `{besides}`, each between backticks, joined by `between`.
nothing_but = "`{block}` is `{value}`, and a return with that value must hold none of {besides}."
unreadable = "What came back could not be read as a return of its form. Each quote and each line break inside a text must be escaped: {why}"
not_run_by = "`{name}` is named in `dealt_with`, but it did not run this round."
dealt_with_twice = "`{name}` is named twice in `dealt_with`."
dealt_with_nothing = "`dealt_with` names nothing of what ran this round, and the return asks for no call, so the cell would run again at once."
written_over = "Another writer wrote version {version} of `{block}` after this round was told of the version it writes over."
choice_changed = "`{block}` is a choice named in `meaning_unchanged`, but the return gives it a different value from the one it has."
asks_and_works = "The return asks for calls and also deals with something or writes a block: a return that asks for calls asks for nothing else."
not_watched = "`{name}` is named in `dealt_with`, but it is not one of the things that run this cell."
not_a_tool = "`{name}` is not a tool this cell may ask for."
unchanged_not_written = "`{block}` is named in `meaning_unchanged`, but this return does not write it."
# A question the return writes that is not its cell's own: another cell's, or one the engine asked.
question_taken = "`{name}` is the name of a question this cell did not ask: give a question of yours a name of its own."
no_such_question = "`{name}` is withdrawn, but this cell has no standing question of that name."
question_twice = "`{name}` is written twice among the questions this return asks."
not_an_option = "The question `{name}` recommends none of its options: `recommends` counts them from 1."
# A return that names the cell's words in `dealt_with` and writes no answer in them (design document
# `data-and-context`, 35).
not_answered = "`{name}` is named in `dealt_with`, but the return gives no `{name}`: answer what the owner said there."
# Of a return read before a cell could ask only where it writes the work's questions, which asked from a cell no answer
# runs.
not_answerable = "The question `{name}` cannot be asked from this cell: no answer runs it again, so none could reach you. Decide it yourself."
# A file the project protects, `{path}`, that the work's branch changes as the round left it, and of which neither the
# return nor the engine's question that stands of the file as it is says why.
unexplained = "`{path}` is a file the project protects. The work's branch changes it, and nothing says why: say in `protected_changes` why the change is needed, or take it back."
# A file, `{path}`, that the run of a line that changes only the project's tests changed on the work's branch, and that
# is none of the project's tests (`[tests]` of `project.toml`).
not_a_test = "`{path}` is not one of the project's tests, which are the only files your line changes: take back what this run changed in it."
# The worktree, as the round of a line that may change the work ended with a return that asks for no call, holds, of the
# files git tracks, `{changes}` as `git status --porcelain` lists them, that are not committed; or a merge begun in it is
# not committed. A file git does not track is none.
uncommitted = "The worktree has changes to tracked files that are not committed:\n{changes}\nCommit what belongs to your change, and take back the rest."
merging = "A merge is under way in the worktree and is not committed:\n{changes}\nFinish the merge and commit it, or take it back."
# A question of the work, `{name}`, marked `tree`, with the owner's answer to its latest version, where the return
# writes a block whose file says `answers_in_the_tree` and the work's change against main changes nothing in the
# project's design tree.
tree_unchanged = "`{name}` is marked `tree` and has the owner's answer, but the work's change against main changes nothing in the design tree: write the option taken into the tree, as its rules say."
# A line, `{line}`, of a block whose file says `names_tree_entries`, that is not written as the project's
# `[tree_format]` refers to an entry, or that names one the design tree at the head of the work's branch does not hold.
not_an_entry = "`{line}` names no entry of the design tree on the work's branch: write each entry on a line of its own, named as the tree's rules say to refer to one."
# Of a return of the form before a return said what it dealt with, which asked for calls and named none.
asks_nothing = "The return asks for calls, but names none."
# A block an act of the engine's after the cell wrote, `{block}`, dealt with by a return that leaves new nothing that
# runs the act again: no block it writes or commits, and no question that stands.
unanswered = "`{block}` is dealt with, but nothing is committed and no question is asked: commit the fix, or ask the owner."
# A return that names a dialogue as dealt with, whose new versions were written by the other side, and that writes no
# version of it, none of what that side watches (`{watched}`, each between backticks, joined by `between`) and no
# question the work waits for.
word_owed = "`{name}` is named in `dealt_with`, but the return answers none of its points in `{name}`, changes none of {watched}, and asks no question the work waits for. Answer each point there, change what it is about, or ask the owner."
# A verdict, `{block}`, written with `{value}`, which does not pass, and no version of its dialogue, `{name}`.
no_point = "`{block}` is `{value}`, but the return gives no `{name}`: give there the points that still stand."

# Why what came back could not be read as a return, said in `{why}` of `unreadable`: `{error}` what the reading of its
# JSON says, `{name}` a tool's name.
[unread]
not_of_its_form = "the return does not match its form: {error}"
requests_not_a_list = "the requests of `{name}` are not a list"
