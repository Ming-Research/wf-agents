# What every agent is refused, whatever its project, each a command with the start of its arguments: pushing, which
# writes beyond its worktree and which only the engine does, after its checks; and the agents' own program, which
# spends where the engine neither counts nor holds it (principle refuse-as-little-as-must-be).
# A command is matched by how it starts, so pushing written another way (`git -C <path> push`, `env X=1 git push`, a
# script) is not matched by it. `environment` is what stops it whatever the spelling: every start of the agents' program
# has these variables, and `GIT_ALLOW_PROTOCOL=none` has git refuse every transport (ssh, https, file). Git has no
# switch that refuses only pushing, so cloning, fetching and listing a remote are refused with it; the engine's own git
# is not given the variable. A name written here is the engine's own: no declaration or setting may name it.
# A project's heavy commands are its declaration's (`[heavy]` of `wf-agents.toml`). `{agents.command}` stands for the
# agents' program the installation names (`agents.command` of its settings), filled in as the engine starts, so that no
# program is written here.
commands = ["git push", "{agents.command}"]
environment = { GIT_ALLOW_PROTOCOL = "none" }
