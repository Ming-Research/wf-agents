name: ci

# The full CI. Every pushed commit on every branch is checked, not only pull requests, but for the engine's temporary
# branches of the code before a change (its tool ci_before): the engine runs the tests to run on one of those by hand,
# which then runs exactly them, each to its end, and skips the lint, so that each named test has a result of its own
# on the code before the change instead of a run that stops at its first red test. The project's configuration names
# the workflow that does so (`fast`, which is fast.yml where it is set up so, and this one where it is not) and the
# input that takes the tests (`tests_input`), which both workflows have. It leaves alone the engine's temporary refs of
# the code its tool measure runs a measurement workflow on (measure.yml), which is run on one only as that tool asks.
# Item 244 makes this workflow run on pushes to main only and drops its input and its named-tests path, which fast.yml
# has.
on:
  push:
    branches-ignore:
      - 'wf-agents-before/**'
      - 'wf-agents-measure/**'
  workflow_dispatch:
    inputs:
      tests:
        description: The tests to run, by their names separated by spaces, each to its end; empty for the whole CI
        required: false
        default: ''

permissions:
  contents: read

# A newer push to the same branch makes the older run pointless; main, which works merge into, keeps every run: the
# engine watches the run on each merge commit. The group is not fast.yml's, so that a run of either does not cancel the
# other's on the same branch.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

# The Rust tests take most of the time, so they run split across three jobs, beside a job for everything else; the
# job `check` is red whenever any of them is, which is the check the projects' configuration waits for to merge.
jobs:
  lint:
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.tests == '' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The steps are written once, for this workflow and fast.yml (.github/actions/lint).
      - uses: ./.github/actions/lint

  test:
    name: test ${{ matrix.shard }} of 3
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    env:
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup toolchain install
      - uses: taiki-e/install-action@183e4297cca2404691e9380e1307288dced5c82a # v2.87.25
        with:
          tool: cargo-nextest@0.9.146
      # The three jobs build the same, so one of them keeps the cache.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ matrix.shard == 1 }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.21.0
          cache: npm
          cache-dependency-path: client/package-lock.json
      # Before any cargo step that compiles the crate the page is built into.
      - name: Build the page
        working-directory: client
        run: |
          npm ci
          npm run build
      # With the cargo profile ci (Cargo.toml) and nextest's profile ci (.config/nextest.toml), which stops any test
      # at 60 s; each job runs a third of every test binary's tests, and stops at its first red test, which keeps a
      # red run short. Given tests to run, it runs those only, a test named by its name or the end of its path, and
      # each to its end.
      - name: Test
        env:
          TESTS: ${{ inputs.tests }}
          SHARD: ${{ matrix.shard }}
        run: |
          if [ -z "$TESTS" ]; then
            exec cargo nextest run --workspace --locked --cargo-profile ci --profile ci --partition "count:$SHARD/3"
          fi
          set -f
          filter=""
          for t in $TESTS; do
            name=$(printf '%s' "$t" | sed 's/[][\\.^$*+?(){}|]/\\&/g')
            filter="${filter:+$filter | }test(/(^|::)${name}\$/)"
          done
          exec cargo nextest run --workspace --locked --cargo-profile ci --profile ci --partition "count:$SHARD/3" \
            --no-fail-fast --no-tests=pass -E "$filter"

  check:
    needs: [lint, test]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Every other job passed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        # The lint is skipped only on a run of the tests named.
        run: |
          echo "lint and test: $RESULTS"
          for r in $RESULTS; do [ "$r" = success ] || [ "$r" = skipped ] || exit 1; done
