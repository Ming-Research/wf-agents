# How the content of a datum a cell is given is put into its session, by the kind the cell gives it in (design
# document `data-and-context`, 17 to 19): `latest`, its latest version whole, where the session lacks it; `last_and_latest`, what changed
# since the version the cell last worked from, or the whole where the session lacks that one or the change would be
# longer; `all`, each version the session lacks, whole. `{choice}` in a text is `choice` below for a datum that is a
# choice, and nothing for another. Filled in a run: `number`, `last_number`, `first_number`, `value`, `content`;
# `diff`, each changed line with two on each side, or, of a datum whose versions the engine compares itself, what it
# says changed: of the design tree the files, one to a line, of the work's head the command that shows what the work
# itself changed; `each_version`, each later version as the first.
choice = ", with the value `{value}`"
# What stands in place of a datum's content where the session holds its latest version already: `{number}` its latest
# version, `{last_number}` the one the cell last worked from; `held_new` where the cell never worked from it, as a cell
# entered after another of its line that read or wrote it.
held = "## `{block}`, version {number}{by}, already in this session; you last worked from version {last_number}"
held_new = "## `{block}`, version {number}{by}, already in this session"
# Who wrote a version, as the round is told it: the line of the cell whose run wrote it, `{line}`, the design tree and
# the work's head a round's end read among them; or the owner. Nothing where neither did: what an act of the engine
# writes, and what the outside writes, what taking main in reads for a round among it.
by_line = ", written on the line `{line}`"
by_owner = ", written by the owner"

# How a datum whose file says `names_tree_entries` is given in place of its names, one to a line: each entry it names
# whole, as the design tree's latest version on the work's branch has it, those of one file after `file`, `{path}` the
# file's path, the files in the order of the kinds of the tree's format (`agents/tree.toml`) and then by path; and after
# them, each name that version does not hold as `gone`, `{reference}` the name as it was written.
[entries]
file = "From `{path}`:"
gone = "{reference}: the design tree's latest version on the work's branch holds no such entry."

[latest]
text = "## `{block}`, version {number}{choice}{by}\n\n{content}"

# Where the session holds the version the cell last worked from: what changed since, each changed line with two on
# each side; `whole` in its place where the session lacks that version, or the change would be longer than the whole.
[last_and_latest]
text = "## `{block}`, what changed from version {last_number} to version {number}{by}\n\n{diff}"
whole = "## `{block}`, version {number}{choice}{by}\n\n{content}"
# Of a datum whose versions the engine compares itself, as the design tree, where the session holds none of them: its
# latest whole, saying so.
unread = "## `{block}`, version {number}{choice}{by}: this session has read none of it\n\n{content}"

[all]
text = "## `{block}`, version {first_number}{choice}{by}\n\n{content}\n\n{each_version}"
