# What the cell cases of the engineer flow share: the made items, how the made project's tests are found,
# the texts and sets of blocks the cases name, and the rules their calls' results are given by.
# The items' titles and backgrounds are in the made installation owner's language.

project = "tally"

# How the made project's tests are found in a commit, and the jobs of its workflows as a run of them says them.
[tests]
mark = "#[test]"
name_after = "fn "
under = ["crates/"]
full = ["test"]
fast = "named"
seconds = 40
url = "https://ci.example.invalid/tally/runs/"

# defect
[items.21]
title = "月报把一到九月并成一行"
main = "v-bug"
background = '''
主人用 `tally report --monthly examples/ledger.csv` 看每月花销时发现：一月、二月、三月的花销合成了一行，键是 `2026-0`，十月成了 `2026-1`，看不出每个月各花了多少。这是 2026-11-09 主人在自己的账本上看到的，`examples/ledger.csv` 上也一样。要的是：月报每个月一行，键是 `YYYY-MM`（例如 `2026-01`），每行是那个月的总数。'''

# capability
[items.22]
title = "月报能只看一个类别"
main = "v-fixed"
background = '''
主人想知道某一类（比如 `food`）每个月花了多少。现在 `tally categories` 只给全部时间的各类总数，`tally report --monthly` 只给所有类别加在一起的月数，两样都答不了这个问题。2026-11-08 主人提的。要的是：`tally report --monthly --category food FILE` 只算这一类的条目，输出和月报一样，每月一行。'''

# design change
[items.23]
title = "金额改用整数分"
main = "v-fixed"
background = '''
决定 amounts-are-floats 说金额用 `f64`，浮点误差到不了报表。主人接下来要加预算提醒：某一类的月花销到了预算就提醒，这要拿和去精确比较；而浮点的和不能精确比较，`0.10` 加 `0.20` 不等于 `0.30`。2026-11-07 主人在想预算提醒时提出的。要的是：金额在 tally 里一律以整数分（`i64`）保存和相加，读写账本时仍是带两位小数的文本，账本文件的格式不变。'''

# measurement
[items.24]
title = "量大账本上月报的耗时"
main = "v-fixed"
background = '''
决定 reports-read-the-whole-file 说报表先把整个账本读进内存，理由是 2026-03-01 在 5,000 行上量的 4 ms。主人的账本十年后大约 40,000 行。要的是：量出 `tally report --monthly` 在 40,000 行的账本上要多久，时间花在读文件、解析还是求和上，并据此说这个决定还成不成立。只量，不改 `tally` 的代码。'''

# cleanup
[items.25]
title = "删掉旧格式导入"
main = "v-fixed"
background = '''
0.3 时主人所有的账本都已转换成现在的格式（原则 one-file-format 也这么说），`tally import-legacy` 和 `legacy` 模块从那以后没人用过。要的是：删掉 `legacy` 模块、`import-legacy` 命令和它们的测试，其余的行为不变。'''

# defect, does not hold
[items.26]
title = "总数把退款算成了花销"
main = "v-fixed"
background = '''
主人说 `tally total` 把退款当成了花销：`examples/ledger.csv` 三月有一笔 `-12.50` 的退款，总数却像是多算了 12.50。2026-11-09 主人看 `tally total examples/ledger.csv` 的结果时觉得不对。要的是：退款从总数里减掉。'''

# capability, needs deep research
[items.27]
title = "两百万行账本上月报要快"
main = "v-fixed"
background = '''
主人打算把公司的账也记进来，账本会到两百万行。要的是：`tally report --monthly` 在两百万行上 50 ms 内出来，账本仍是那一个 CSV 文件（宪法第一条）。可能的路有几条：边读边加、内存映射、多线程解析，哪条在这个尺寸上够快、各要改多少，要先各试一下才知道。'''

# design change against the constitution
[items.28]
title = "账本改存 SQLite"
main = "v-fixed"
background = '''
主人希望报表更快，也想以后能按任意条件查账。提议：账本改存成一个 SQLite 数据库文件，`tally` 的命令都从数据库读写，CSV 只在导出时生成。2026-11-08 主人提的。'''

