[workspace]
members = ["crates/*"]
resolver = "3"

# Shared by every crate, so the version and the rules the code is held to are set once.
[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
publish = false
repository = "https://github.com/Ming-Research/wf-agents"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

# Versions of the dependencies more than one crate may use, set once.
[workspace.dependencies]
rusqlite = { version = "0.41.1", features = ["bundled", "fallible_uint"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tempfile = "3.27.0"
toml = "1.1.8"
uuid = { version = "1.26.1", features = ["v4", "v5"] }
