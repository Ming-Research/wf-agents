# A project's declaration, `wf-agents.toml` at the root of its repository, read from its main branch as the engine starts:
# each project an installation names has its own. It holds what is the project's: its design tree; its files, which the
# agents of its works are given as they are in the work's checkout; its settings, which the words sent to the agents
# name as `project.<name>`; its tests and workflows; its heavy commands; and
# how its host checks and merges. This one is the declaration of the project whose repository holds the flows. A path
# is from the root of the project's checkout.

# The directory that holds the project's design tree, which the engine looks at on each work's branch. How its entries
# are found and what forms its files take are the tree's rules, the same for every project (`agents/tree.toml` of the
# flow's files).
tree = "design/"

# Transitional: how an entry is found and referred to, as the engine installed before the tree's format became the
# flow's reads it from here. This engine does not use it and refuses one that differs from `agents/tree.toml`. It goes,
# with `files.tree_rules` and `project.tree_check` below, `design/README.md`, `design/lint.py` and the measurement
# `measure/design-lint`, in the change that follows the install of the build that carries the tree's rules and its
# check, which puts the refusal of this table back.
[tree_format]
kinds = [{ kind = "principle", dir = "principles/" }, { kind = "decision", dir = "decisions/" }]
heading = "### {kind} {name}"
reference = "{kind} {name}"

# The project's guide for its agents.
[files.guide]
path = "AGENTS.md"

# The constitution of the project's design tree.
[files.constitution]
path = "design/constitution.md"

# Transitional, as `tree_format` above: the rules of the project's design tree, which the engine installed before the
# flow gave them reads from here. This engine gives the rules from `agents/tree_rules.md` and names no such file.
[files.tree_rules]
path = "design/README.md"

[project]
# Where an agent keeps what it makes for research, committed.
research = "research/"
# How an agent names a measurement to `run_tests`: by the file of `measure/` that times it.
measure_names = '''
A measurement is named by its file in `measure/`: `design-lint` times `measure/design-lint`. A name holds letters, digits,
`_` and `-`.'''
# Transitional, as `tree_format` above: the command that checks the design tree's files, which the I1 task of the engine
# installed before the engine ran the check names. This engine runs the check itself and names no such setting.
tree_check = "python3 design/lint.py"
# How an agent names a test to `run_tests`, by the name the project's test runners give it: one phrase, which the
# tool's words follow the setting's name with.
test_names = "a Rust test as nextest names it, such as `tests::a_row`, with no test binary; a page test as vitest lists it, its describes and its title joined by ` > `; a binary, module, file or describe alone names none"

# Where the project's tests are, as git pathspecs, which are all a line that changes only the tests (`tests_only` in its
# file) may change; and the data its tests expect.
[tests]
paths = [
  ":(glob)crates/**/tests/**",
  ":(glob)crates/**/tests.rs",
  ":(glob)client/**/*.test.ts",
  ":(glob)client/**/*.test.tsx",
  ":(glob)client/**/testing.ts",
  ":(glob)client/**/fixtures.ts",
]
expected = ["crates/carry/tests/fixtures/", "crates/flow/tests/project/"]

# The project's workflows, which the engine runs by hand on main's file with a commit given: the fast and the full, and
# the one that measures. Each reports every test, or every timing, as JUnit XML, named as an agent asks for it, in the
# artifact `test-results`.
[ci.fast]
# Builds and runs only the tests and checks it is given.
workflow = "fast.yml"
runner = "14900k"
checks = ["lint"]
# A run not complete by then is cancelled, and said as what it found.
too_long = "2h"

[ci.full]
# Every job required to merge, run once before the merge.
workflows = ["ci.yml"]
runner = "14900k"
too_long = "2h"

# The workflow that times the measurements an agent's `run_tests` names, each on the commit the work's change began from and
# on the work's commit, in one run. It reports every timing as JUnit XML in the artifact `test-results`. Its job holds the
# machine's lock while it times, and its time limit counts the wait, so `too_long` is the job's `timeout-minutes`.
[ci.measure]
workflow = "measure.yml"
runner = "14900k"
too_long = "30m"

# How a pull request of the project is merged where GitHub is its host: squash, merge or rebase; and whether a work's
# branch on GitHub is deleted once it is merged.
[pull_request]
merge_method = "squash"
delete_branch = true

# The paths that govern the project's agents, which the owner changes: where a work's change against main touches one,
# the work says why each such change is needed (`flow/agents/return/fields/protected_changes.toml`) or takes it back,
# and the engine asks the owner whether the change stays (`flow/agents/asks.toml`). A path ending in `/` is a
# directory and everything in it. The declaration is listed, since it names commands the engine runs.
[protected]
paths = ["AGENTS.md", "design/constitution.md", "design/principles/", "flow/", ".github/workflows/", "wf-agents.toml"]

# The project's heavy commands, which take the host's processor, such as building, testing and measuring, each a command
# with the start of its arguments: no agent runs them, and the project's tests are had through `run_tests` (principle
# refuse-as-little-as-must-be). What every agent is refused whatever its project is `flow/agents/refused.toml`.
[heavy]
commands = ["cargo", "rustc", "rustup", "npm", "npx", "node --test", "tsc", "vitest", "hyperfine"]

# The variables every agent's command line of the project's works is given beside the engine's own, by name: what the
# project's toolchain reads, so that a command an agent may run reaches no further than its worktree. Rustup installs no
# Rust toolchain that a command asks for and the machine lacks: the command fails instead of downloading one, which
# would write beyond the worktree. The engine's own variables, the installation's `agents.env` and the agents' program's
# (`CLAUDE_*`, `ANTHROPIC_*`) are refused here.
[environment]
RUSTUP_AUTO_INSTALL = "0"
