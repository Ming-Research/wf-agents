# A flow that reaches a stall, which no flow of the repository does: a writer of the text a request asks for, which
# reads main as well; a check of the text, which alone writes whether it passed; and the merge, the engine's own cell,
# that waits for the check to say yes. A work whose writer hands in nothing, or whose check says no, stands at the
# merge with nothing that can move it on by itself. The engine's test of a stall reads it, and the build of the page's
# states is given it for its store of a stall; once a flow of the repository reaches a stall, the build takes it from
# that flow and this one goes.
name = "stalled"
order = ["write", "check", "merge"]

[limits]
again = 2

[lines.main]

[blocks.request]
people = true

[blocks.main]
outside = "main"

[blocks.main.writes]
text = "The main branch {main} is at {head}."

[blocks.text]

[blocks.checked]
values = ["yes", "no"]

[blocks.merged]
shown = true
