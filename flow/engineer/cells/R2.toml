# Why this cell exists: a plan, once written, is thought through again by its writer, in the same session: asked so, a
# writer most often finds a better way (the old flow's cell that asked it, on the line that wrote the design, found one
# 40 times in 52).
title = "Is there a better way"
kind = "agent"
line = "engineer"
effort = "xhigh"
task = { file = "tasks/better_way.md" }
when = { deep_needed = "no" }
watches = ["plan", "r2_questions", "r2_words"]
reads = ["background", "tree"]
outputs = [
  "plan_owner",
  "plan_agent",
  "r2_questions",
  "acceptance",
  "tree_edits",
  "r2_words",
]

# Each version of the plan is thought through once; one it wrote itself runs it not again.
[do]
plan = """See what changed in the plan since you last thought it through, the whole of it where you never did, and think that through again."""
r2_questions = """The owner has answered one of your questions in `r2_questions` with another option than yours, or one you wait for: bring the plan to it."""
r2_words = """The owner has said something to you in `r2_words`: that comes first. Take each point of it: change the plan where it touches, only there, or say why not, and answer it in `r2_words`."""

[kinds]
# Given as the files that changed since the tree this session read.
tree = "last_and_latest"
background = "latest"
plan_owner = "last_and_latest"
plan_agent = "last_and_latest"
acceptance = "last_and_latest"
tree_edits = "last_and_latest"
