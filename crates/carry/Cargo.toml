[package]
name = "carry"
description = "The real carriers: the engine's acts with git, the agents' rounds with the claude command line, and the tools"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
repository.workspace = true

[dependencies]
decide = { path = "../decide" }
driver = { path = "../driver" }
engine = { path = "../engine" }
flow = { path = "../flow" }
# The JUnit XML a fast CI reports its tests' results in.
roxmltree = "0.21.1"
serde.workspace = true
serde_json.workspace = true
service = { path = "../service" }
store = { path = "../store" }
tokio = { version = "1.53.1", features = ["fs", "io-util", "macros", "process", "rt", "sync", "time"] }
toml.workspace = true
uuid.workspace = true
work = { path = "../work" }

[dev-dependencies]
tempfile.workspace = true
tokio = { version = "1.53.1", features = ["fs", "io-util", "macros", "process", "rt", "rt-multi-thread", "sync", "time"] }

[lints]
workspace = true
