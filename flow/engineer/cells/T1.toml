# Why this cell exists: so that the change is judged by a session that did not make it and knows no less than its
# maker: whether the code does what the plan says, to the standard the tree sets. A draft of the assistant's; the owner
# has not gone through it.
title = "Review"
kind = "agent"
line = "code_reviewer"
effort = "high"
task = '''
Review the change in `code`, in a session of your own, and change no file. Read the diff from main to the commit
`code` names, and whole each file of decisions whose topic it touches. Judge only by what the implementation was asked
to do (`plan_owner`, `acceptance`) and the repository's rules.

Does the code do what the plan says, to the standard the tree sets? The work is done once it does; old code that
lagged behind a decision before this work is no point. A short cut, another method, more than the work needs or a
change of direction is a point; so is code that breaks a decision of the tree, or a decision that neither the plan nor
the tree records and `decisions` does not give a reason that holds for. Is it sound in structure and lines? Does
`evidence` show each condition on that commit, each new test red before the change where its kind needs it and worth
its time? Where cost per operation can change, is what it can slow measured? Do the entries written into `design/` say
what `tree_edits` says, and no more?

List every point at once in `review`. Leave out preferences: the engineer fixes nearly all a review
raises, so a wrong point makes good code worse.

With `review_ok` yes write no opinion. Having said yes to `needs_testing`, keep it while the part of the change that
made you say so is still there.
'''
triggered_by = [
  "on_code",
  "on_decisions",
  "on_evidence",
  "on_plan_owner",
  "on_plan_agent",
  "on_acceptance",
  "on_tree_edits",
  "on_reply_review",
  "on_session",
]
context = [
  "code",
  "decisions",
  "evidence",
  "plan_owner",
  "plan_agent",
  "acceptance",
  "tree_edits",
  "reply_review",
  "background",
  "questions",
  "answers",
  "review",
]
outputs = ["review", "review_ok", "needs_testing"]
must_write = ["review_ok", "needs_testing"]

# What the cell does when each trigger fires; a trigger with none is the task's alone.
[do]
# Moved from the task (the review of 2026-11-14).
on_reply_review = """Look at what changed: accept each answer in `reply_review` or say why not; raise nothing new the fix did not bring."""

# The kinds below are a draft of the assistant's (2026-11-14), which the owner has not gone through: `all` for a
# record, `last_and_latest` where the cell works from what changed, `latest` for the rest.
[kinds]
review = "latest"
code = "last_and_latest"
decisions = "last_and_latest"
evidence = "latest"
plan_owner = "latest"
plan_agent = "latest"
acceptance = "latest"
tree_edits = "latest"
reply_review = "latest"
background = "latest"
questions = "latest"
answers = "all"
