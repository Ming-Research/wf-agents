# What every agent is refused, whatever its project, each a command with the start of its arguments: pushing, which
# writes beyond its worktree and which only the engine does, after its checks (principle refuse-as-little-as-must-be).
# A project's heavy commands are its declaration's (`[heavy]` of `wf-agents.toml`). `{agents.command}` stands for the
# agents' program the installation names.
commands = ["git push", "{agents.command}"]
environment = { GIT_ALLOW_PROTOCOL = "none" }
