# What the agents, the engine's acts and the tools do when the engineer's flow is tried with no agent behind it
# (`wf-agents run --script`). One work goes through every cell: the research asks the owner a question, the plan's
# review objects to the design once, the review objects to the implementation once and then asks for adversarial
# testing, which finds a fault, and after the fix the review finds no more testing needed.

[took]
ms = 4000
usd_micros = 180000
input_tokens = 21000
cached_tokens = 160000
output_tokens = 3200

[tools.ci]
answer = "Every check passed."
ms = 6000

# Research: a question to the owner, then the first plan, which needs a design and changes the tree.
[[flows.engineer.rounds]]
cell = "R1"
asks = [{ question = "Should the cost of a round be kept for each call of a tool as well?", who = "owner" }]

[[flows.engineer.rounds]]
cell = "R1"
round = 2
hands_in = [
    { block = "needs_deep_research", value = "yes" },
    { block = "found", content = "The rounds keep their cost; the calls keep none. Two ways to keep it were found." },
    { block = "plan_owner", content = "Keep what each call took beside its result, and show it on the work's page." },
    { block = "plan_agent", content = "Add what a call took to its result; sum it into the run; show it in the step's panel." },
    { block = "questions", content = "None beyond the one asked." },
    { block = "acceptance", content = "A call's cost shows on the work's page and is counted in the work's total." },
    { block = "tree_changes", content = "A decision that what a call took is kept with its result." },
    { block = "changes_tree", value = "yes" },
]

# Design: the plan in full, and after the review's objection a revised plan with an answer.
[[flows.engineer.rounds]]
cell = "D1"
hands_in = [
    { block = "plan_owner", content = "Keep what each call took beside its result, as a round's is kept, and show both on the work's page." },
    { block = "plan_agent", content = "Give a call's result what it took; keep it in the store beside the result; sum rounds and calls into the run." },
    { block = "questions", content = "None." },
    { block = "acceptance", content = "A call's cost shows on the work's page, is counted in the total, and outlives a restart." },
    { block = "tree_changes", content = "A decision that what a call took is kept with its result, in a table only added to." },
    { block = "changes_tree", value = "yes" },
]

[[flows.engineer.rounds]]
cell = "D1"
run = 2
hands_in = [
    { block = "plan_agent", content = "Give a call's result what it took; keep it in the table of results; sum rounds and calls into the run; a call withdrawn takes nothing." },
    { block = "answers_deep_research", content = "Agreed: a withdrawn call takes nothing, and the plan now says so." },
]

# The plan's review: one objection to the design, then content.
[[flows.engineer.rounds]]
cell = "D2"
hands_in = [
    { block = "plan_review_on_deep_research", content = "The plan does not say what a call that was withdrawn took." },
    { block = "plan_settled", value = "no" },
]

[[flows.engineer.rounds]]
cell = "D2"
run = 2
hands_in = [{ block = "plan_settled", value = "yes" }]

# Implementation: runs the CI, hands in the code; then a fix for the review, and a fix for the testing.
[[flows.engineer.rounds]]
cell = "I1"
asks = [{ tool = "ci", input = "the work's branch" }]

[[flows.engineer.rounds]]
cell = "I1"
round = 2
hands_in = [
    { block = "code", content = "The call's cost is kept with its result and summed into the run." },
    { block = "evidence", content = "The fast CI passed on the head; three new tests." },
]

[[flows.engineer.rounds]]
cell = "I1"
run = 2
hands_in = [
    { block = "code", content = "The call's cost is kept with its result and summed into the run; the page shows it per call." },
    { block = "answers_review", content = "Done: the step's panel now shows what each call took." },
]

[[flows.engineer.rounds]]
cell = "I1"
run = 3
hands_in = [
    { block = "code", content = "As before, and a call with no result yet is counted as taking nothing." },
    { block = "answers_testing", content = "Fixed: the sum no longer fails on a call that has no result." },
]

# The review: objects once, then asks for adversarial testing, and after its fix finds no more needed.
[[flows.engineer.rounds]]
cell = "T1"
hands_in = [
    { block = "review_on_implement", content = "The acceptance says the cost shows on the page; the page does not show it per call." },
    { block = "review_settled", value = "no" },
    { block = "more_testing", value = "no" },
]

[[flows.engineer.rounds]]
cell = "T1"
run = 2
hands_in = [
    { block = "review_settled", value = "yes" },
    { block = "more_testing", value = "yes" },
]

[[flows.engineer.rounds]]
cell = "T1"
run = 3
hands_in = [
    { block = "review_settled", value = "yes" },
    { block = "more_testing", value = "no" },
]

# Adversarial testing: finds one fault.
[[flows.engineer.rounds]]
cell = "T2"
hands_in = [
    { block = "tests", content = "Four tests; one fails: the sum of a run with a call that has no result." },
    { block = "testing_on_implement", content = "Summing a run fails when one of its calls has no result yet." },
    { block = "testing_settled", value = "no" },
]

# The check before the merge passes.
[[flows.engineer.rounds]]
cell = "M1"
took = { ms = 8000 }
hands_in = [{ block = "checked", value = "yes" }]

[[flows.engineer.rounds]]
cell = "M2"
took = { ms = 1000 }
