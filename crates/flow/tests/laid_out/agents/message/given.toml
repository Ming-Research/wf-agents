# How a datum is put into a session of the tests, by its kind.
choice = ", with the value `{value}`"
held = "## `{block}`, version {number}, in this session already; last worked from {last_number}"

[latest]
text = "## `{block}`, version {number}{choice}\n\n{content}"

[last_and_latest]
text = "## `{block}`, what changed from version {last_number} to version {number}\n\n{diff}"
whole = "## `{block}`, version {number}{choice}\n\n{content}"

[all]
text = "## `{block}`, version {first_number}, by {by}{choice}\n\n{content}\n\n{each_version}"

[by]
person = "the owner"
outside = "the engine"
cell = "{cell}"
