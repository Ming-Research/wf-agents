# A message: what the engine sends a cell's agent each time it enters the cell, of what the session lacks; its parts in
# this order. In a text, `{title}` is the cell's title, `{task}` the cell's task, `{datum}` the name of a datum the
# cell watches. Any other `{name}` is filled in a run:
#   taken: each block and question the last return handed in, and the version it is kept as;
#   work, item, item_title: the work's number, the number of the item it is done for, and the item's title;
#
# What a part is, the engine knows by `part`. A part the session keeps, as data are kept, has a `kind`, as a datum a
# cell is given has (`given.toml`): it is sent where the session lacks its latest version, and again when it changes;
# `context` is each datum of the cell's context, by the kind the cell gives it in. A part with no kind is written anew
# each time the cell is entered; `only` names when it is sent at all: `after_hand_in`, after a return that handed in
# blocks; `takes_main`, to a cell that takes main in. `outputs` is the blocks the cell writes, as `[outputs]` in
# `../return/return.toml` says, where it writes any; how every cell returns is in the system prompt. A part with a kind
# may say in `held` what is sent in its place where the session holds it already. The data come before what the cell
# is to do with them, and what ran it, with what to do for each, comes last.

# What a session compacted during a round is told before the round's message is given to it again, whole: a
# compaction counts as the session reopened.
compacted = "Your session was compacted during this round. Here is everything the round was told, again and in full, as for a session that is just beginning. Carry on with the round's work."

# What the owner says to a round while it runs, given to its session right after its next use of one of its program's
# own tools, as the owner's version of the cell's words reads: `{entry}` the version, `{block}` the datum's name,
# `{number}` its version, and `{do}` what the cell does when its words are new, as the part `new` below says it.
said = "## `{block}`, version {number}, said while this round is running\n\n{entry}\n\nIt is new to this round{do}\n\nStop where you are and hand in your answer now, in an `outcome` that names `{block}` in its `dealt_with`."

# What the owner says, or answers, that the work reaches first, given to a round under way as `said` is: `{entry}`,
# `{block}` and `{number}` as there. The round hands in what it has and its work goes on in a later round.
hurried = "## `{block}`, version {number}, said while this round is running\n\n{entry}\n\nStop where you are and hand in what you have now, in an `outcome`; leave out of `dealt_with` what you did not finish."

# `{taken}` is each block in `each`, `{block}` its name and `{number}` the version it is kept as, with `between`
# between two of them.
[[parts]]
part = "taken"
only = "after_hand_in"
text = "What your last return handed in is kept as: {taken}"
each = "`{block}`, version {number}"
between = "; "

[[parts]]
part = "heading"
text = "# {title}"

[[parts]]
part = "work"
kind = "latest"
text = "Work W{work}, on the item #{item} \"{item_title}\"."

# The engine writes it in one line, in these words: `text` where main was merged into the work's branch, `{main}` its head
# merged in and `{merge}` the commit of the merge; `conflict` where it does not merge, `{files}` the files in conflict;
# `uncommitted` where the worktree holds changes not committed, and `merging` where a merge is under way in it,
# `{changes}` the files it holds changes of; `failed` for any other cause, which it does not say. In each, `{name}` is
# the main branch's name. Nothing is said where the work's branch held main already. `between` stands between the
# items of a list. Kept as the session keeps a part, it is said once for the run in a session.
[[parts]]
part = "main"
kind = "latest"
only = "takes_main"
text = "{name} at {main} was merged into the work's branch as the commit {merge}; `git diff --name-only {merge}^1 {merge}` shows what it changed."
conflict = "{name} at {main} was not merged into the work's branch: it conflicts in {files}."
uncommitted = "{name} at {main} was not merged into the work's branch: the worktree has changes that are not committed, {changes}."
merging = "{name} at {main} was not merged into the work's branch: a merge is under way in the worktree and is not committed, {changes}."
failed = "{name} was not merged into the work's branch."
between = ", "

# Each datum the cell is given that is new to it since it last worked from it, or that the session lacks, in `order`:
# what the flow gives every agent cell, what the cell only reads, what it watches, each list in its own order, and each
# block the cell writes that none of them gives it, sent only where the session lacks its latest version, as `latest`
# gives it (design document `data-and-context`, 14, 15, 21). What every cell is given alike comes first, so that
# sessions share it in the cache (15). Its content as `given.toml` says for the cell's kind of it, or `held` there where
# the session holds it already. A datum with no version yet is left out.
[[parts]]
part = "context"
order = ["every_agent", "reads", "watches", "outputs"]

[[parts]]
part = "outputs"
kind = "latest"

[[parts]]
part = "task"
kind = "latest"
text = "## Your task\n\n{task}"
# Where the session holds the task already, its heading still comes, so that each message says what the cell is to do.
held = "## Your task\n\nAs given before in this session, under `# {title}`."

# The results of the calls the round is given, as `results.toml` words them, and why what a round of the run returned
# was sent back, as `../return/sent_back.toml` words it, with the version its return would have written over of a
# block the cell is not given, as a datum given `latest` is: each where the session lacks it.
[[parts]]
part = "results"

[[parts]]
part = "sent_back"

# Each datum the cell watches that is new to it (design document `data-and-context`, 11): its name, the version the
# cell last consumed (`since`, none where it consumed none), each version new to it that changed the datum's meaning
# (`changed_one` or `changed_many`, joined by `between`; none where none did), and what the cell does for it (`do`,
# from the cell's definition), the first time too; then `after`.
[[parts]]
part = "new"
text = "## Why you are run\n"
each = "\n- `{datum}`{versions}{do}"
since = ", new since version {last}"
changed_one = ", version {changed} changed its meaning"
changed_many = ", versions {changed} changed their meaning"
between = ", "
do = ": {do}"
after = "\n\nOnly these ran this cell. In `dealt_with`, name each one you have dealt with, by the name between its backquotes, without the backquotes. Any you leave out runs this cell again."
