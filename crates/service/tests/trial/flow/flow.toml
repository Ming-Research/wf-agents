# A small flow for trying the engine by hand and for the tests: the start that makes the work's place, a plan that
# waits for the items its item depends on, a build, a review that judges it and may object, and the merge. Its script, ../script.toml, has the review object once,
# the plan ask the owner a question and the build ask for a tool.
name = "trial"
order = ["start", "plan", "build", "review", "merge"]

[limits]
runs = 3
returns = 2
calls = 4

[lines.engineer]
[lines.reviewer]
reads_only = true

[blocks.request]
people = true

[blocks.place]

# The project's guide for its agents as the work's branch has it, which the start's act reads as it makes the work's
# place and every session begins with.
[blocks.guide]
outside = "guide"

[blocks.dependencies]
values = ["waiting", "merged"]
outside = "dependencies"

[blocks.dependencies.writes]
merged = "Every item this one depends on has merged."
waiting = "Waits for the items {items} to merge."
cancelled = "{item} (cancelled)"
between = ", "

[blocks.plan]

[blocks.opinions]
people = true

[blocks.code]

[blocks.verdict]
values = ["yes", "no"]

[blocks.merged]
shown = true

[tests.ready]
says = "Every item this one depends on has merged"
kind = "all"
reads = ["dependencies"]
is = "merged"

[tests.content]
says = "The review is content"
kind = "all"
reads = ["verdict"]
is = "yes"
