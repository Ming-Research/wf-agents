name = "engineer"

# The order of the walk, from the first cell to the merge.
order = ["S1", "R0", "R1", "R2", "D1", "D2", "D3", "D4", "I1", "T1", "T2", "M1", "M2"]

# The engine's own data this flow uses, each defined once in `../data/`. The flow's own data are in `blocks/`, its
# lines in `lines/`, its named tests in `tests/` and its cells in `cells/`, one file each. What runs a cell is named on
# the cell, from `../triggers/`.
data = ["background", "dependencies", "questions", "answers", "discussion"]

# The engine's tools every agent cell of the flow may ask for, each defined once in `../agents/tools/`. The form of a
# return holds them, the same for every cell of the flow (`../agents/return/return.toml`).
tools = ["query", "run_tests"]

# Chosen, not measured: no work yet showed what these should be.
[limits]
runs = 3
returns = 3
calls = 40
