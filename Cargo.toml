[workspace]
members = ["crates/*"]
resolver = "3"

# Shared by every crate, so the version and the rules the code is held to are set once.
[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
publish = false
repository = "https://github.com/Ming-Research/wf-agents"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

# Versions of the dependencies more than one crate may use, set once.
[workspace.dependencies]
rusqlite = { version = "0.41.1", features = ["bundled", "fallible_uint"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha1_smol = "1.0.1"
tempfile = "3.27.0"
toml = "1.1.8"
uuid = { version = "1.26.1", features = ["v4", "v5"] }

# The profile CI builds the tests with (`cargo nextest run --cargo-profile ci`); no local build uses it. The
# dependencies are optimized fully, because unoptimized they run the tests many times slower (SQLite, built from
# source, above all), and the owner's machine keeps them built. The workspace's own crates, rebuilt on every change,
# are not optimized: most of their compile is LLVM's. The flow crate alone stays at level 1: compiling a flow, which
# many tests do, is several times slower unoptimized. Line tables are enough for a failing test's backtrace. Brought
# over from main, where it was measured.
[profile.ci]
inherits = "test"
opt-level = 0
debug = "line-tables-only"

[profile.ci.package."*"]
opt-level = 3

[profile.ci.package.flow]
opt-level = 1
