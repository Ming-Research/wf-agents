# Why this cell exists: so that the change is judged by a session that did not make it and knows no less than its
# maker: whether the code does what the plan says, to the standard the tree sets.
title = "Review"
kind = "agent"
line = "code_reviewer"
effort = "high"
task = '''
Review the change in `code`, in a session of your own, and change no file. Read the diff from main to `head`, and
whole each file of decisions whose topic it touches. Judge only by what the implementation
was asked to do (`plan_owner`, `acceptance`) and the repository's rules.

Does the code do what the plan says, to the standard the tree sets? The work is done once it does; old code that lagged
behind a decision before this work is no point. A short cut, another method, more than the work needs or a change of
direction is a point; so is code that breaks a decision of the tree, or a decision that neither the plan nor the tree
records and `decisions` does not give a reason that holds for. Is it sound in structure and lines? Does the change reach
every place where the same thing happens, not only the one the item names? Does `evidence` show each condition on the
change, each new test red before the change where its kind needs it and worth its time? Is each exception or expected
value the change gives a check a choice of the design, not a fault it hides? Where cost per operation can change, is
what it can slow measured? Do the entries written into `design/` say what `tree_edits` says, and no more?

List every point at once in `review`: this is your one chance, and nothing is raised later that could be raised now.
Leave out preferences: the engineer fixes nearly all a review raises, so a wrong point makes good code worse.

With `review_ok` yes, leave `review` out of your return. Having said yes to `needs_testing`, keep it while the part of
the change that made you say so is still there.
'''
watches = ["change", "review"]
reads = ["plan", "background", "tree"]
outputs = ["review", "review_ok", "needs_testing"]
must_write = ["review_ok", "needs_testing"]

# What the cell does when each datum it watches is new; a datum with none is the task's alone.
[do]
# The change is watched as one, what the implementation and the testing hand in; the plan is only read, since the
# implementation brings the code to it first, and no session is watched, since a reopened session gives a reviewer
# nothing to do again.
change = """See what changed since the version you last reviewed, the whole of it where you reviewed none, and review it."""
review = """Look at what changed: accept each answer in `review` or say why not; raise nothing new the fix did not bring."""

# `all` for a dialogue, `last_and_latest` where the cell works from what changed, `latest` for the rest.
[kinds]
# Given as the files that changed since the tree this session read.
tree = "last_and_latest"
review = "all"
code = "last_and_latest"
title = "latest"
decisions = "last_and_latest"
evidence = "latest"
plan_owner = "last_and_latest"
plan_agent = "last_and_latest"
acceptance = "last_and_latest"
tree_edits = "last_and_latest"
tests = "last_and_latest"
head = "last_and_latest"
background = "latest"
