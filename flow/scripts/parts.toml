# The second work's research asks the owner one question it waits for.
[[flows.engineer.rounds]]
cell = "R1"
work = 2
part = "Ask the owner one question with two options that the work needs answered before it goes on, recommend the first, and wait for the answer; return nothing else."

[[flows.engineer.rounds]]
cell = "R1"
work = 2
run = 2
part = "Do this cell's work on the item as the owner answered, as briefly as it allows, and return what your task asks."

# The third work's review objects to one thing in the change, as a review that finds it not yet right does.
[[flows.engineer.rounds]]
cell = "T1"
work = 3
part = "Object to one thing in the change that a careful review would ask to be done otherwise, and say so as your task asks."
