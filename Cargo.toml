[workspace]
members = ["crates/*"]
resolver = "3"

# Shared by every crate, so the version the command reports and the rules the code is held to are set once.
[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
publish = false
# Where wf-agents is developed: the engine knows by it which project of a configuration is wf-agents itself.
repository = "https://github.com/Ming-Research/wf-agents"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

# The profile CI builds the tests with (`cargo nextest run --cargo-profile ci`); no local build uses it. The
# dependencies are optimized, because unoptimized they run the tests many times slower (SQLite, built from source,
# above all), and CI's cache keeps them built; the workspace's own crates are built as for any test, since they are
# rebuilt on every push. Line tables are enough for a failing test's backtrace.
[profile.ci]
inherits = "test"
debug = "line-tables-only"

[profile.ci.package."*"]
opt-level = 3
