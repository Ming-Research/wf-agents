# One read-only SQL query on the engine's records, run by the engine. `{store}` is filled with
# what the records hold that agents may see. The engine gives a result as `{"rows": [...]}`, each row an object by the
# column names, with `cut` where rows are left out.
words = '''
`query`: one read-only SQL query on the engine's records, as `{"sql": "..."}`. {store}
  It gives `{"rows": [...]}`, each row an object keyed by column name. Rows beyond a query's bounds are left out: then
  `cut` says in `count` how many rows are given, and holds in `rest` the query that reads the rest. A result too large
  to give whole is cut in the same way, with its size in `bytes`, the file that holds the whole result in `file`, and
  `trimmed` if the first row alone was too long and its long values were shortened (read them in parts with
  `substr`). However a query is written, no value it gives is longer than the engine allows.'''
# What the words use that this tool defines: the keys of its result `{"rows": [...]}` and the SQL function it points to.
defines = ["rows", "cut", "count", "rest", "bytes", "file", "trimmed", "substr"]
# How many bytes of a result a message gives, past which it is given cut.
given_bytes = 12000

# What the engine says of its own answers: `{why}` the reason, `{ms}` the milliseconds a query may take, `{bytes}` the
# bytes a row may take. The store is described table by table: `store_table` (`{table}`, `{comment}` and `{columns}`, which
# are `store_column`, or `store_column_commented` where a column has a comment, with `{column}`, `{type}` and
# `{comment}`).
[texts]
unreadable = "The request is not read: ask as `{\"sql\": \"...\"}`."
error = "The query failed: {why}"
timeout = "The query ran longer than {ms} milliseconds, or was withdrawn, and was stopped."
unavailable = "The store could not be read; ask again."
row_too_long = "A row of the query is over {bytes} bytes, and is not given: ask for fewer or shorter columns, or part of a value with `substr`."
store_table = '''
### `{table}`
{comment}
{columns}'''
store_column = "- `{column}` {type}"
store_column_commented = "- `{column}` {type}: {comment}"

[request]
type = "object"
properties = { sql = { type = "string" } }
required = ["sql"]
additionalProperties = false
