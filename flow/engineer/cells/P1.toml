# Why this cell exists: so that every plan is judged, before it is built, by a session that did not write it: whether it
# does what `background` asks, its design by the engineering rules, its acceptance and its questions. One judgment a
# round, each point answered. First on its line, it reads first what the line's reviews need: the tree for the item,
# and the code the plan changes.
title = "Design review"
kind = "agent"
line = "plan_reviewer"
effort = "high"
task = '''
You review the plan in a session of your own. You did not write it, so look for what its writer cannot see. If this
session has not yet read the tree for this item, first understand what `background` asks, then read the tree for it
as the tree's rules say, and read the code the plan changes. The plan is `plan_owner`, `plan_agent` and `acceptance`,
with the questions its writer asked the owner.

Judge it only by what it was made for (what `background` asks) and by the repository's rules, on each of these points:
1. Whether it does what `background` asks, no less and no more, and, if there was deep research, whether it settles
   what `found` left to it.
2. Its design, by the engineering rules: the responsibilities, interfaces and representations it touches, one place
   for each thing, and nothing that no current work needs.
3. The acceptance: whether each condition can be decided, whether a wrong result would fail it, and whether together
   they cover what `background` asks.
4. The questions: a question that a fact could settle; a choice the design tree's rules say is the owner's that no
   question asks; a question not marked in `plan_owner`; a question marked wrongly, `tree` yes for a choice that is not
   the owner's by the tree's rules, or no for one that is.

In the why of `plan_ok`, answer each point by its number: none, or what you found. Write everything the writer must deal
with in `plan_review`, all at once. If `plan_ok` is yes, leave `plan_review` out of your return. Leave out anything you
are not sure is better.
'''
watches = ["plan", "plan_review"]
reads = ["background", "found", "tree"]
outputs = ["plan_review", "plan_ok"]
must_write = ["plan_ok"]

# What the cell does when each datum it watches is new; a datum with none is the task's alone.
[do]
# The plan is watched as one, not block by block; `background` is only read, since the writer brings the plan up to
# date for it first, and no session is watched, since a reopened session gives a reviewer nothing to do again.
plan = """Look at what changed in the plan since the version you last reviewed (all of it, if you have reviewed none), and review it."""
plan_review = """Where the writer answered an earlier point in `plan_review`, accept the answer or say why not. Never raise a point again without saying so, and raise nothing new that the answers did not bring up."""

# `all` for a dialogue, `last_and_latest` where the cell works from what changed, `latest` for the rest.
[kinds]
# Given as the files that changed since the tree this session read.
tree = "last_and_latest"
background = "last_and_latest"
# What the research found, and what it sent the deep research to settle.
found = "latest"
plan_owner = "last_and_latest"
plan_agent = "last_and_latest"
acceptance = "last_and_latest"
plan_review = "all"
