title = "Design"
kind = "agent"
line = "designer"
task = '''
Research what `found` left open, and design how to solve the problem. This session has not read the tree: read the
constitution, `design/principles/`, the decisions `related` names and the code yourself. Take `found` as a hypothesis
to verify, and use what the research left in `research/` rather than run it again. Find out a fact left open, try the
ways to try, analyse a fault of the design itself as a design; verify a fact that would change the direction before
using it, and weigh the upkeep the design adds.

Write the plan in the research's blocks:
- `plan_owner`, read by the owner on the page, in the language the installation sets for its owner: what will be done,
  how and why, what it was compared with and where it wins, what it leaves out; each question marked where it belongs,
  as [q1].
- `plan_agent`, in English, for the implementation: what changes where, and how each part is verified.
- `acceptance`: numbered conditions, each one sentence plainly true or false, saying how it is verified: a test, a
  measurement and its criterion, a fast-CI job, or reading the diff.
- `questions`, in the owner's language: only what stays uncertain where two options both stand and choosing wrong
  costs much, with cost, risk and your recommendation, which the plan follows. Settle what a fact settles; decide what
  is cheap to change later.
- `tree_changes`: each entry the plan adds, changes or deletes in `design/`, as it will read, each under a question;
  `changes_tree` yes when there is one.

If the design falls into parts each mergeable on its own, too large for one work, ask the owner in your return, naming
them in order.

Take each point of `plan_review_on_design`, `implement_on_design` and `opinions_design`: change the plan where it
touches, only there, or say why not; answer each in `answers_design`.
'''
when = { block = "needs_design", is = "yes" }
inputs = [
  "found",
  "related",
  "plan_owner",
  "plan_agent",
  "questions",
  "acceptance",
  "tree_changes",
  "changes_tree",
  "opinions_design",
  "plan_review_on_design",
  "implement_on_design",
]
outputs = [
  "plan_owner",
  "plan_agent",
  "questions",
  "acceptance",
  "tree_changes",
  "changes_tree",
  "answers_design",
]
