### decision reports-read-the-whole-file
A report reads the whole ledger into memory before it sums anything.
Why: The owner's ledger is a few thousand lines and will reach about 40,000; streaming it was turned down as more code for no time saved (the monthly report on 40,000 lines, as measured in research/monthly-report-40k).

Where it does not hold, nothing changes here: a work of its own changes the decision.'''
