# How cargo-nextest runs the tests in CI, with the profile ci, in both its workflows (.github/workflows/ci.yml and
# fast.yml).
#
# The profile gives no time after which a test is stopped, and no table `[profile.ci]` may stand in this file: the engine
# gives each workflow it dispatches the line of its history of tests' times as the input `test_stop`, and the workflow
# puts `[profile.ci]` with that stop, in seconds, before the contents of this file in a copy it runs nextest with. A
# test still running at the line is stopped and fails under its own name, instead of holding the job until its time
# limit. A run with no such input (a pull request, a push, or a project whose history is too short for a line) has the
# job's time limit alone.

# What became of each test of a run, as JUnit XML, at target/nextest/ci/junit.xml: fast.yml uploads it for the engine
# to read (the artifact test-results), and ci.yml keeps it with its run.
[profile.ci.junit]
path = "junit.xml"
