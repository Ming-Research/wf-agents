blocks.plan_owner.content = '''
把 `Amount` 从 `f64` 改成以分为单位的 `i64`：读账本时 `12.50` 读成 1250，写回账本和报表显示时一律写成两位小数（`40` 写回成 `40.00`），账本文件的格式不变。多于两位小数的金额不再悄悄四舍五入，而是让读它的命令失败并说出行号（宪法第二条、原则 no-silent-skips）；金额或和超出 `i64` 的分能存的范围时，命令也失败并说明，不悄悄溢出。决定 amounts-are-floats 不再成立，删掉，换成新的决定 amounts-are-cents。'''
blocks.plan_agent.content = '''
1. crates/tally/src/amount.rs: `pub type Amount = i64`, in cents. `parse` reads an optional sign, the units and at most two decimals into cents (`12.5` is 1250, `-3` is -300) with checked arithmetic, and refuses anything else, such as `12.345`, `1e3` or an amount past what an `i64` of cents holds, saying the text. `format` writes the sign, the units and two digits of cents from the absolute value (`unsigned_abs`, so the smallest `i64` does not overflow), so -50 is `-0.50`. `add` adds two amounts with `checked_add` and fails where the sum is past what an `i64` holds. The module comment cites the decision as tree_edits writes it (it cites amounts-are-floats today).
2. crates/tally/src/ledger.rs: `total` and `by_category` sum with `amount::add` from 0, so each gives a `Result`; `Ledger::write` writes each amount with `amount::format`, so `12.50` is written back as `12.50` and `40` as `40.00` (they are written `12.5` and `40` today). crates/tally/src/report.rs: `monthly` sums with `amount::add` and gives a `Result`. crates/tally-cli/src/main.rs: `total`, `categories` and `report --monthly` report a sum's error as they report a line's.
3. Tests in crates/tally/tests/amount.rs (new): `point_one_and_point_two_make_point_three` (the sum of `0.10` and `0.20` equals the amount `0.30`), `more_than_two_decimals_are_refused` and `an_amount_too_large_to_hold_is_refused` (`92233720368547758.08`, a cent past the largest, is refused), red before the change and green after; `a_refund_under_one_unit_keeps_its_sign` (`-0.50` formats as `-0.50`), which passes before too and guards the new `format`. In crates/tally/tests/ledger.rs: `a_sum_too_large_to_hold_fails` (does not build before: `total` gives an `f64`) and `a_ledger_is_written_with_two_decimals` (red before). The existing tests' float literals become cents (`40.0` is `4000`), and their sums are unwrapped.
Verified: amounts are used in amount.rs, entry.rs, ledger.rs, report.rs and the CLI's `amount::format` calls (grep); examples/ledger.csv has no amount with more than two decimals.'''
blocks.acceptance.content = '''
1. `point_one_and_point_two_make_point_three` and `more_than_two_decimals_are_refused` pass in CI.
2. `a_refund_under_one_unit_keeps_its_sign` passes in CI.
3. `an_amount_too_large_to_hold_is_refused` and `a_sum_too_large_to_hold_fails` pass in CI: an amount or a sum past what an `i64` of cents holds is refused, not wrapped.
4. `a_ledger_is_written_with_two_decimals` passes in CI: the ledger is written with two decimals, `12.50` and `40.00`.
5. `a_ledger_written_reads_back_the_same` passes in CI.
6. The full workflows pass.'''
blocks.tree_edits.content = '''
In design/decisions/amount.md, the decision amounts-are-floats is deleted and this one written:

### decision amounts-are-cents
An amount is a whole number of cents, read from text with at most two decimals and written with exactly two; an amount with more decimals fails its line.
Why: A sum of floats cannot be compared exactly (0.10 and 0.20 do not make 0.30), and a report's numbers are exact or refused (Article 2); the owner's budget warnings compare sums. Floats were turned down for that, and so was rounding a third decimal as it is read, which rounds a number away in silence.'''

