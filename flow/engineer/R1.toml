title = "Initial research"
kind = "agent"
line = "engineer"
task = '''
Research how to solve the item's problem with code, going on from the tree you read and `supplement`. Reproduce a
defect first, where it shows, such as on the page in a real browser or in the program on its own data; the test goes
with the project's tests, anything else you make in `research/`, committed. Find the root cause; if the design itself
is at fault, say so.

`needs_deep_research` is yes only when the direction rests on a fact you cannot check in a round or two, or on trying
several ways first; then write only `found`: what you found, where you checked each fact, what the deep research must
settle. With no, write the plan:
- `plan_owner`, read by the owner on the page, in the language the installation sets for its owner, technical terms in
  English: what will be done, how and why, no longer than that, each question marked where it belongs, as [q1].
- `plan_agent`, in English, for the implementation: what changes where, the test red before and green after, the like
  cases a defect has.
- `acceptance`, in English: numbered conditions, each one sentence plainly true or false, saying how it is verified: a
  test, a measurement and its criterion, a fast-CI job, or reading the diff.
- `questions`, in the owner's language, only where two ways you checked both work, no fact decides, and choosing wrong
  costs much: the options with cost and risk, and your recommendation, which the plan follows. Most items need none.
- `tree_changes`: each entry the plan adds, changes or deletes in `design/`, as it will read, each under a question;
  `changes_tree` yes when there is one. Where the solution needs a decision changed, propose that rather than bend the
  solution; a principle or the constitution, ask the owner in your return.

Take each point of `plan_review_on_research`, `implement_on_research` and `opinions_research`: change the plan where
it touches, only there, or say why not. Answer the points of the plan's review in `answers_research_to_plan_review`,
those of the implementation in `answers_research_to_implement`, and the owner's in `reply_research`, in the language
the installation sets for its owner.
'''
inputs = [
  "background",
  "supplement",
  "context",
  "opinions_research",
  "plan_review_on_research",
  "implement_on_research",
]
outputs = [
  "needs_deep_research",
  "found",
  "plan_owner",
  "plan_agent",
  "questions",
  "acceptance",
  "tree_changes",
  "changes_tree",
  "answers_research_to_plan_review",
  "answers_research_to_implement",
  "reply_research",
]
must_write = ["needs_deep_research"]
