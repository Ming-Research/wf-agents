[package]
name = "web"
description = "The owner's pages as wf-agents serves them: a JSON interface under /api/v1 and the page built into the binary"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
repository.workspace = true

[dependencies]
axum = { version = "0.8.9", default-features = false, features = ["http1", "json", "query", "tokio"] }
backup = { path = "../backup" }
decide = { path = "../decide" }
driver = { path = "../driver" }
flow = { path = "../flow" }
# The stream of changes the pages listen to is made from the loop's changes as they come.
futures-util = { version = "0.3.34", default-features = false }
serde.workspace = true
serde_json = "1.0.154"
toml.workspace = true
service = { path = "../service" }
store = { path = "../store" }
tokio = { version = "1.53.1", features = ["net", "rt", "sync", "time"] }
work = { path = "../work" }

[dev-dependencies]
# A test makes the store an engine stopped on, with a work going on, through the driver.
engine = { path = "../engine" }
http-body-util = "0.1.3"
tempfile.workspace = true
tokio = { version = "1.53.1", features = ["io-util", "macros", "rt", "test-util"] }
tower = { version = "0.5.3", features = ["util"] }

[lints]
workspace = true
