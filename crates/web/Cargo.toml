[package]
name = "web"
description = "The owner's flow page as wf-agents serves it: a JSON interface under /api/v1 and the page built into the binary"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
repository.workspace = true

[dependencies]
axum = { version = "0.8.9", default-features = false, features = ["http1", "json", "tokio"] }
decide = { path = "../decide" }
flow = { path = "../flow" }
serde.workspace = true
serde_json = "1.0.154"
tokio = { version = "1.53.1", features = ["net", "rt"] }

[dev-dependencies]
http-body-util = "0.1.3"
tokio = { version = "1.53.1", features = ["macros", "rt"] }
tower = { version = "0.5.3", features = ["util"] }

[lints]
workspace = true
