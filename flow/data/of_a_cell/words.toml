# The owner's words to a cell and the cell's answers: a datum of each cell that may ask, its dialogue with the owner,
# which the cell watches (design document `data-and-context`, 35). The engine writes the owner's version as the owner
# speaks to the cell, and the cell's answer from what its return writes of it in `outputs`, as its run writes it.
# `words` is told to the cell after the list of what it returns, with `words_if_marked` after them where it has a block
# it hands in every time.
name = "{cell}_words"
what = "The owner's words to the cell and the cell's answers, each a version of its own, in order."
from = "words"
shown = true
words = '''
`{cell}_words`: your answer to what the owner said in it, only if that is new to this round. Hand it in before you
do anything else: make your next return an `outcome` that holds it.'''
# Told after the words, only to a cell that hands in a block every time.
words_if_marked = '''
That return may leave out the blocks marked "hand it in every time".'''

# The content of each version, which names no cell: `owner`, the owner's, with `{words}` what the owner said; `reply`,
# the cell's answer, with `{reply}` what its return writes of it in `outputs`.
[writes]
owner = "The owner:\n\n{words}"
reply = "An agent:\n\n{reply}"
