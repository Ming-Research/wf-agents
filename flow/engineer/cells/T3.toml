# Why this cell exists: so that the change is judged against the design tree by a session that did not make it: what it
# goes against, what it leaves untrue, and whether what it writes into the tree is what the owner's choices settled and
# nothing else. One of three reviews of the change on one line, each answering its questions one by one (decision
# the-change-is-reviewed-in-three).
title = "Design tree review of the change"
kind = "agent"
line = "code_reviewer"
effort = "high"
task = '''
Review the change in `code` against the design tree, in a session of your own, and change no files. Read the diff from
main to `head`, and read in full each file of decisions whose topic the change touches. Judge the code and the tests
only for these questions.

1. Does the change go against a principle or a decision of the tree, where no question asked the owner about that
   change?
2. Is the option taken in each question marked `tree` written into the tree, and does every other change of the tree
   mend an entry the change made untrue?
3. Did the work make a choice that the tree's rules give the owner, in the plan, in `decisions` or in the code, that no
   question put to him?
4. Does the change leave an entry of the tree untrue, or a comment that goes against the tree?

In the why of `design_ok`, answer each question by its number: what you checked and what you found. A question you did
not check is a point: say what must be shown. Write every point in `design_review` at once: this is your one chance,
and nothing that could be raised now is raised later. Leave out preferences: the engineer fixes nearly everything a
review raises, so a wrong point makes good code worse. If `design_ok` is yes, leave `design_review` out of your return.
'''
watches = ["change", "design_review"]
reads = ["plan", "background", "tree", "tree_entries"]
outputs = ["design_review", "design_ok"]
must_write = ["design_ok"]

# What the cell does when each datum it watches is new; a datum with none is the task's alone.
[do]
# The change is watched as one, what the implementation and the testing hand in; the plan is only read, since the
# implementation brings the code to it first, and no session is watched, since a reopened session gives a reviewer
# nothing to do again.
change = """Look at what changed since the version you last reviewed (all of it, if you have reviewed none), and review it."""
design_review = """Look at what changed: accept each answer in `design_review` or say why not, and raise nothing new that the fix did not bring up."""

# `all` for a dialogue, `last_and_latest` where the cell works from what changed, `latest` for the rest.
[kinds]
# Given as the files that changed since the tree this session read.
tree = "last_and_latest"
# The entries of the design tree the plan was worked from, whole.
tree_entries = "latest"
design_review = "all"
code = "last_and_latest"
title = "latest"
decisions = "last_and_latest"
evidence = "latest"
plan_owner = "last_and_latest"
plan_agent = "last_and_latest"
acceptance = "last_and_latest"
plan_files = "last_and_latest"
tests = "last_and_latest"
head = "last_and_latest"
background = "latest"
