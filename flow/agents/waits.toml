# What the engine says to the owner of why a work waits on them, a sentence for each thing it waits for, which the
# page shows on the card the owner acts on and in the browser's notifications, and `wf-agents wait` says; and why the
# engine paused a work as a round of it failed, which the pause keeps and its card says. Read with each flow.

# Why the engine paused a work as a round of it failed, `{why}` what carried the round out said: `too_long` where the
# prompt is too long for the model; `passing` where it failed in passing `{failed}` times in a row; `outside` where it
# failed `{failed}` times in a row for a cause outside every work; `flagged_again` where the service's safety check
# flagged it again, in the new session its line was given. Any other cause is said by what carried the round out alone.
[paused]
too_long = "running the round again cannot help: {why}"
passing = "the round failed in passing {failed} times in a row, and running it again has not helped: {why}"
outside = "the round failed {failed} times in a row for a cause outside every work, tried again each time the engine's check found the outside well: {why}"
flagged_again = "the service's safety check flagged the round again, in the new session its line was given: {why}"

# Why a work waits on the owner, by what it waits for; a question put to the owner is said by what it asks. Filled in a
# run: `{cell}` the cell by its id; `limit` and `calls`, the cell's last `{runs}` runs in a row, each for what a cell
# after it wrote, or each asking for calls and dealing with nothing; `returns` and `made`, its run at its limit of
# `{sent_back}` returns sent back or of `{made}` calls made; `ruling`, a block the owner may write, `{block}`, keeping
# the cell's `requires` key `{key}` from holding; `paused`, the engine's pause, `{why}` its reason, and
# `no_reason` where it gave none; `held`, the pause of every work the engine set as it started again; `agents`, the
# agents' command line that cannot run, `{why}` what it said, and `mend`, what the owner does about it, which the page
# has no control for. What `{why}` stands for is said as whatever said it wrote it, its own stop included.
[owner]
limit = "{cell} ran {runs} times in a row for what a cell after it wrote, its limit."
calls = "{cell} ran {runs} times in a row asking for calls and dealing with nothing, its limit."
returns = "The run of {cell} had {sent_back} returns sent back, its limit."
made = "The run of {cell} made {made} calls, its limit."
ruling = "{cell} requires {key}, which {block} keeps from holding."
paused = "The engine paused the work: {why}"
no_reason = "The engine paused the work and gave no reason."
held = "The engine paused every work as it started again."
agents = "The agents' command line cannot run: {why}"
mend = "Sign it in again or install it; the engine lets the work go on once its check finds it runs."
