name: ci

# Every check of the code: the page's types, lint, tests and build; the Rust format and clippy with warnings as errors;
# and the Rust tests, which take most of the time, split across three jobs beside the others. The job `check` is red
# whenever the page, the lint or a job of the tests is. It is the project's full workflow (`ci.full` of
# flow/project.toml): what the check before a work's merge runs on the exact commit to merge, once, and what a request of
# an agent's `run_tests` that names no test runs. The engine dispatches it by hand on main's file, with the commit to
# test and a value only its request knows, which the run's name holds, and judges the run by the jobs' conclusions and
# by the JUnit of every test in the artifact `test-results`: nextest's of each third of the Rust tests and vitest's of
# the page's, each in a file of its own. It runs on each pull request into `main` and on each push to `main` as well,
# on GitHub's machines from a clean start. What an agent names to `run_tests` while it works, the fast CI runs instead
# (fast.yml), on the owner's machine.
run-name: ${{ inputs.call && format('ci {0}', inputs.call) || '' }}

on:
  workflow_dispatch:
    inputs:
      commit:
        description: The commit to check out and test, pushed to a branch of the repository already
        required: true
      call:
        description: A value only the request that asks for this run knows, which the run's name holds
        required: true
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

# A newer push to the same pull request makes the older run pointless; `main` keeps every run, and so does every run an
# engine asked for by hand, which an agent or a merge waits for.
concurrency:
  group: ci-${{ github.event_name == 'workflow_dispatch' && inputs.call || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' && github.ref != 'refs/heads/main' }}

jobs:
  # The owner's page (client/): checked and tested on its own, so that what is wrong with it shows without waiting for
  # the Rust build.
  page:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The commit an engine's request gives; for a pull request or a push, empty, which is the commit of the event.
          ref: ${{ inputs.commit }}
          # No later step pushes, so the token is not left in the checkout.
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.21.0
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm ci
      - name: Type-check the page
        run: npm run typecheck
      - name: Lint the page
        run: npm run lint
      # The page's browser tests (`*.browser.test.tsx`) draw it in headless Chromium: the headless shell of the one the
      # version of Playwright the lock file locks drives, with the system libraries it needs, and nothing more.
      - name: Chromium for the page's browser tests
        run: npx --no-install playwright install --with-deps --only-shell chromium
      # With vitest's JUnit beside its own report: what became of each test, by its describes and its title joined by
      # ` > `, which is the name an agent asks for it by.
      - name: Test the page
        run: npm test -- --reporter=default --reporter=junit --outputFile.junit="$RUNNER_TEMP/page.xml"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: junit-page
          path: ${{ runner.temp }}/page.xml
          if-no-files-found: ignore
      - name: Build the page
        run: npm run build

  # The Rust format and clippy with warnings as errors, beside the tests.
  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The commit an engine's request gives; for a pull request or a push, empty, which is the commit of the event.
          ref: ${{ inputs.commit }}
          # No later step pushes, so the token is not left in the checkout.
          persist-credentials: false
      # Installs the toolchain rust-toolchain.toml pins, with its components.
      - run: rustup toolchain install
      # Formatting first: it needs no build, so a misformatted push fails in seconds.
      - name: Format
        run: cargo fmt --all --check
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      # The page is built into the binary (crates/web/build.rs), so it is built before anything compiles that crate. Its
      # build is kept for the files of client/ as they are, so that a change that touches none of them has it already:
      # the page is built once for each state of its files, not once in each job of each run.
      - id: page
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: client/dist
          key: page-node-24.21.0-${{ hashFiles('client/**') }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: ${{ steps.page.outputs.cache-hit != 'true' }}
        with:
          node-version: 24.21.0
          cache: npm
          cache-dependency-path: client/package-lock.json
      - name: Build the page
        if: ${{ steps.page.outputs.cache-hit != 'true' }}
        working-directory: client
        run: |
          npm ci
          npm run build
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

  # The Rust tests, which take most of the time, split across three jobs: each builds every test binary and runs a
  # third of each binary's tests (nextest's partition count:k/3).
  test:
    name: test ${{ matrix.partition }} of 3
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      # Every job runs to its end, so that a red run shows every test that fails.
      fail-fast: false
      matrix:
        partition: [1, 2, 3]
    env:
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The commit an engine's request gives; for a pull request or a push, empty, which is the commit of the event.
          ref: ${{ inputs.commit }}
          # No later step pushes, so the token is not left in the checkout.
          persist-credentials: false
      - run: rustup toolchain install
      # The three jobs build the same, so one of them keeps the cache.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ matrix.partition == 1 }}
      # cargo-nextest at the version fast.yml checks for on the owner's machine, installed where it is absent.
      - id: nextest
        run: if cargo nextest --version 2>/dev/null | grep -q '0.9.146'; then echo "have=true" >> "$GITHUB_OUTPUT"; fi
      - uses: taiki-e/install-action@183e4297cca2404691e9380e1307288dced5c82a # v2.87.25
        if: steps.nextest.outputs.have != 'true'
        with:
          tool: cargo-nextest@0.9.146
      # The page is built into the binary (crates/web/build.rs): its build is kept as the lint job keeps it.
      - id: page
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: client/dist
          key: page-node-24.21.0-${{ hashFiles('client/**') }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: ${{ steps.page.outputs.cache-hit != 'true' }}
        with:
          node-version: 24.21.0
          cache: npm
          cache-dependency-path: client/package-lock.json
      - name: Build the page
        if: ${{ steps.page.outputs.cache-hit != 'true' }}
        working-directory: client
        run: |
          npm ci
          npm run build
      # With the cargo profile ci (Cargo.toml) and nextest's profile ci (.config/nextest.toml), as fast.yml runs them:
      # a test still running at 60 s (the tests of random histories at 300 s) is stopped and fails under its own name.
      # Every test of the job's third runs to its end, so that a red run shows every test that fails, not the first one's.
      - name: Test
        env:
          PARTITION: ${{ matrix.partition }}
        run: |
          cargo nextest run --workspace --locked --cargo-profile ci --profile ci --no-fail-fast \
            --partition "count:$PARTITION/3"
      # What became of each test of the job's third, as nextest's JUnit, in a file named by the third so that the thirds
      # are one artifact together, whatever became of the step before.
      - name: Name the results
        if: ${{ !cancelled() }}
        env:
          PARTITION: ${{ matrix.partition }}
        run: |
          junit=target/nextest/ci/junit.xml
          if [ -f "$junit" ]; then mv "$junit" "target/nextest/ci/rust-$PARTITION.xml"; fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: junit-${{ matrix.partition }}
          path: target/nextest/ci/rust-${{ matrix.partition }}.xml
          if-no-files-found: ignore

  # Red whenever the page, the lint or a job of the tests did not pass, cancelled ones included; and the one place the
  # JUnit of every job is made one artifact, `test-results`, which the engine reads.
  #
  # The jobs of a run are what the engine judges the run by, each by its conclusion; this job prints, in its own log,
  # the steps of each job that did not pass, each after a line as a step begins that names the job, with GitHub's times
  # taken off and its workflow commands stopped, so that they are printed as the job printed them, for whoever reads the
  # run on GitHub.
  check:
    needs: [page, lint, test]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      # To read the logs of the run's other jobs.
      actions: read
    steps:
      # The JUnit of the page and of each third of the Rust tests, in one artifact. Where none was kept (each job was
      # cancelled, say) there is nothing to merge, and the engine says the run uploaded none.
      - uses: actions/upload-artifact/merge@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        continue-on-error: true
        with:
          name: test-results
          pattern: junit-*
      # The ten slowest tests of the run, read from the JUnit the jobs of the tests kept, in the run's summary and its
      # log: what a test costs, for whoever adds one. It never makes the check red.
      - name: The slowest tests
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        # Where no job of the tests kept its results (each was cancelled, say), there is nothing to list, and the step
        # ends without an error all the same: the engine gives an agent every step of this log that holds one. Results
        # kept half written end it so too, the status of the lines below being that of `tee`.
        run: |
          gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --pattern 'junit-[123]' --dir "$RUNNER_TEMP/junit" \
            || { echo "No job of the tests kept its results."; exit 0; }
          python3 -I - "$RUNNER_TEMP/junit" <<'EOF' | tee -a "$GITHUB_STEP_SUMMARY"
          import pathlib, sys, xml.etree.ElementTree as ET
          rows = []
          for path in sorted(pathlib.Path(sys.argv[1]).rglob("*.xml")):
              for case in ET.parse(path).iter("testcase"):
                  rows.append((float(case.get("time") or 0), f"{case.get('classname')} {case.get('name')}"))
          rows.sort(key=lambda r: -r[0])
          print(f"### The ten slowest of the {len(rows)} Rust tests\n")
          print("| Seconds | Test |")
          print("|---:|---|")
          for time, name in rows[:10]:
              print(f"| {time:.1f} | `{name}` |")
          EOF
      - name: Every other job passed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "page, lint and test: $RESULTS"
          red=false
          for r in $RESULTS; do [ "$r" = success ] || red=true; done
          [ $red = true ] || exit 0
          jobs="repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/attempts/$GITHUB_RUN_ATTEMPT/jobs"
          mapfile -t not_passed < <(gh api --paginate "$jobs" --jq '.jobs[]
            | select(.name == "page" or .name == "lint" or (.name | startswith("test ")))
            | select(.conclusion != "success") | "\(.id)\t\(.name)\t\(.conclusion // .status)"')
          stop="stop-$(cat /proc/sys/kernel/random/uuid)"
          for line in "${not_passed[@]}"; do
            IFS=$'\t' read -r id name how <<< "$line"
            echo "##[group]Run the steps of the job $name, which ended in $how"
            echo "##[endgroup]"
            echo "##[error]The job $name ended in $how; its steps follow."
            echo "::stop-commands::$stop"
            # From its first step to the runner's clean-up, as the job printed it: with the escapes that colour it,
            # which gh gives only when told to, and the engine reads a job's log with them.
            if gh api --allow-escape-sequences "repos/$GITHUB_REPOSITORY/actions/jobs/$id/logs" \
              > "$RUNNER_TEMP/log" 2> "$RUNNER_TEMP/why"; then
              sed -E 's/^\xEF\xBB\xBF//; s/^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9:.]+Z ?//' "$RUNNER_TEMP/log" \
                | awk '/^##\[group\]Run /{on=1} /^Post job cleanup/{on=0} on'
            else
              echo "Its log could not be read: $(cat "$RUNNER_TEMP/why")"
            fi
            echo "::$stop::"
          done
          echo "##[group]Run what check found"
          echo "##[endgroup]"
          names=$(printf '%s\n' "${not_passed[@]}" | cut -f2 | paste -sd ',' | sed 's/,/, /g')
          echo "Did not pass: ${names:-no job found; the page of the run says which}."
          exit 1
