# Item 21 on main: the month cut to six characters. A test the work added of the monthly report fails while the
# code cuts six characters. It fails whatever its dates are, where the hand model failed it only where its dates put
# two months among January to September in one key, and says no numbers of the test's own.
[[results.defect_monthly.fails]]
names = ["*"]
new = true
holds = ["monthly"]
where = { file = "crates/tally/src/report.rs", has = "e.date[..6]" }
said = "assertion `left == right` failed: the months January to September share one key, `2026-0`"

# Item 26: refunds are subtracted already. A test the work added that expects the total to count the refund as
# spent fails, saying the total.
[[results.refund.fails]]
names = ["*"]
new = true
holds = ["3330.60"]
said = "assertion `left == right` failed\n  left: \"3318.10\"\n right: \"3330.60\""
