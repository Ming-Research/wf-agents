# Why this cell exists: so that the design tree is read before any work on the item. The principles and decisions it
# holds bind every later step, and one missed costs dearly.
title = "Understand the problem and the design tree"
kind = "agent"
line = "study"
effort = "high"
takes_main = true
task = '''
First, understand what the item's `background` asks for, just enough to know where to look in the design tree. Then
read the tree for this work, as the tree's rules say. The research comes next, in this same session, and starts from
what you read here. This run is only for this project's design tree: read anything else the `background` names during
the research. What you read stays in this session for the research, so hand in only `dealt_with`.
'''
watches = ["background", "study_session"]
reads = ["tree"]
outputs = []

# What the cell does when each datum it watches is new; a datum with none is the task's alone.
[do]
background = """Look at what changed since the version you last worked from (all of it, if you have worked from none), and read what the change touches."""
# So that the tree is read again in a session that was reopened.
study_session = """Do all of this from the start: this session holds nothing you read before."""

[kinds]
# Given as the files that changed since the tree this session read.
tree = "last_and_latest"
# It says what the item asks for, and so where in the tree to look.
background = "last_and_latest"
# What began the new session.
study_session = "latest"
