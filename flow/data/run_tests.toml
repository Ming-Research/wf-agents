# The test runs the cells ask for: one record, each entry the tests and checks a run of a cell asked for, as it wrote
# them in `outputs`. The cell the record runs runs each asking cell's latest entry, and writes the result into that
# cell's own block of `../triggers/of_a_cell/on_tested.toml`. `words` is told to a cell that writes it, after the list
# of what it returns, `{named_checks}` filled as `../agents/acts/run_tests.toml` says, and `[shape]` is what the form of
# its line holds it to.
what = "The tests and checks each cell asked to have run, an entry for each time it asked."
words = '''
`run_tests`: the project's tests to run on the last commit of the work's branch, which the engine pushes; what is not
committed is not run. Write `{"tests": [...], "checks": [...]}`, naming tests as `project.test_names` says and checks
among {named_checks}; what is named is run alone, by the project's fast workflow. Name none to run the project's full
workflows. The work waits at this cell, and you are entered again with the result: each test, passed or failed, with
the time it took and what a failed one said, and each job, how it ended and its wall time.'''

[shape]
type = "object"
properties = { tests = { type = "array", items = { type = "string" } }, checks = { type = "array", items = { type = "string" } } }
additionalProperties = false
