# The trial flow (crates/service/tests/trial/flow) with a plan that also loads the engineer's session: it reads the
# block the engine writes as the line begins a new session, so that it runs again before the line goes on.
name = "loading"
order = ["plan", "build", "review", "merge"]

[limits]
runs = 3
returns = 2
calls = 4

[lines.engineer]
[lines.reviewer]
reads_only = true

[blocks.request]
people = true

[blocks.dependencies]
values = ["waiting", "merged"]
outside = "dependencies"

[blocks.dependencies.writes]
merged = "Every item this one depends on has merged."
waiting = "Waits for the items {items} to merge."
cancelled = "{item} (cancelled)"
between = ", "

[blocks.session]
outside = "session"

[blocks.session.writes]
text = "A new session of the line `{line}`: {why}."
limit = "its context was {context} tokens as its last round ended, past the limit of {limit}"
model = "its rounds now run on another model than {was}, which it was begun on"
account = "its rounds now run under another account than it was begun under"
owner = "the owner asked for one"
flagged = "the service's safety check flagged its last round"
lost = "the agents' program no longer had the session it was in"
compacted = "The session of the line `{line}` was compacted: it holds only a summary of what it read."

[blocks.plan]

[blocks.opinions]
people = true

# What the engine writes as the owner answers a question of the build's: `{question}` its name, `{option}` the option's
# number, `{does}` the option's, `{why}` the owner's reason as `why` says it.
[blocks.answered]
outside = "answer"

[blocks.answered.writes]
text = "The owner answered {question} with option {option}, {does}.{why}"
why = " {why}"

[blocks.code]

[blocks.verdict]
values = ["yes", "no"]

[blocks.merged]
shown = true

[tests.ready]
says = "Every item this one depends on has merged"
kind = "all"
reads = ["dependencies"]
is = "merged"

[tests.content]
says = "The review is content"
kind = "all"
reads = ["verdict"]
is = "yes"
