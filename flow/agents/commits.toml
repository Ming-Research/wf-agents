# The commits the engine makes in the project's repository, which the agents see in its history: who they are by, and
# the words of each. The engine knows a merge of main as its own by this address and its whole message, so that a merge
# made before it stopped is not made again.
name = "wf-agents"
email = "wf-agents@localhost"

# The words of each. Filled in a run: `{main}` the main branch's name, `{head}` the head of main merged, `{run}` the
# run's number, `{branch}` the work's branch, `{name}` the name of the work's merge.
#
# A run of a cell that takes main in merges main's head into the work's branch as it starts.
run = "Merge {main} at {head} into the work's branch as run {run} starts"
# The check before the merge merges main's head into the work's branch, where the branch does not hold it. Its words
# are not a run's, so that neither takes the other's merge for its own.
check = "Merge {main} at {head} into the work's branch"
# The merge of the work's branch into main, where no host merges it.
merge = "{name}"

# The name of a work's merge, which its pull request and the commit its merge makes take, where the work has written
# nothing in the block its flow's merge is named by. Filled in a run: `{work}` the work's number.
unnamed = "Work {work}"

# The two lines every commit of a work ends with, the agents' commits and the engine's alike, so that the item and the
# work are found from a commit by `git log --grep='^Item: 36$'`. They follow the message after a blank line. Filled in
# a run: `{item_number}` the item's number alone, without the `#` its other mentions have, which the host would link to
# a pull request; `{work}` the work's number as it is written everywhere, `W12`.
item_line = "Item: {item_number}"
work_line = "Work: {work}"
