name: fast

# The fast CI of a work: what the engine's ci tool waits for while the code is being written. It runs only when asked,
# by hand, on the work's branch, with the tests to run: those tests and the lint, which run side by side. It never runs
# the whole set of tests, and has no job named `check`, the one a merge waits for (ci.yml): a head that only this
# workflow has run is not one that may merge. The project's configuration names this workflow (`fast`) and its input
# (`tests_input`).
#
# The engine's ci_before tool runs it too, on its temporary branches `wf-agents-before/...`, which hold the code before
# a change with the tests of the change put on it. On those it runs exactly the tests listed, and skips the lint: the
# lint would check the code before the change against the page's types of now, and say nothing of the tests.
#
# The tests job uploads what became of each test it ran as JUnit XML, in the artifact `test-results`, which the engine
# reads: the project's configuration names it (`ci.results`), and the documentation of that setting in the engine gives
# the conventions this workflow holds to. A unit of the Rust tests that did not compile is in it too, as a testsuite
# with no testcase and an error, and the tests of the other units still run.
on:
  workflow_dispatch:
    inputs:
      tests:
        description: >-
          The tests to run, each name followed by a line break, so that a name may hold spaces (names separated by
          spaces, with no line break, are read too, as an older engine gives them); each runs to its end. Empty for the
          lint only
        required: false
        default: ''

permissions:
  contents: read

# A newer run on the same branch makes the older one pointless. This group is not ci.yml's, so that a run of either
# does not cancel the other's on the same branch.
concurrency:
  group: fast-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    # The engine's temporary branches of the code before a change are named by this prefix; ci.yml leaves them alone by
    # the same prefix.
    if: ${{ !startsWith(github.ref_name, 'wf-agents-before/') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/lint

  # The tests named, in one job: they are few, so that the build of the page and the compiling are paid once.
  test:
    if: ${{ inputs.tests != '' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The names given: one a line when the input holds a line break, as the engine gives them; else split at white
      # space, as an engine before that gave them. Each is trimmed, as the engine trims a name, and listed in the log.
      #
      # The engine alone decides which test a name names, by the rule the documentation of `ci.results` gives; this
      # workflow runs at least every test a name names by that rule: more, never fewer. Each name is taken for a Rust
      # test and for a page test both. The selection below holds for the separators `::` and ` > `, the project's
      # `ci.results.separators`: whoever changes that rule or the separators widens it in the same change.
      #
      # A Rust test is named by its name, by its unit (its test binary) and its name joined by a space, `::` or ` > `,
      # or by what follows a separator in one of these. Neither the unit nor the name holds a space, nor the unit a
      # ` > `, so what follows a name's last ` > ` holds at most one space, and what follows its last `::` or space is
      # the test's name, or the end of it after a `::`, which `(^|::)…$` selects.
      #
      # A page test is named by its title, joined by ` > ` after the titles of the describes it is in and the file it is
      # in, or by a space or `::` after the file. What follows a name's last ` > ` is the end of the test's own title,
      # whole, or after the file and a space, or after the file and `::`: three candidates. Every page test is defined
      # in a `*.test.*` or `*.spec.*` file with its title written there as a string, so the files that hold a
      # candidate, as written or as a string in the code writes it, hold every test the name names; only those files are
      # run, and in them only the tests whose name holds a candidate found. Whoever defines a test elsewhere, or with a
      # title made when the tests run, widens this in the same change.
      - name: Read the names
        id: names
        env:
          TESTS: ${{ inputs.tests }}
        run: |
          set -f
          names="$RUNNER_TEMP/names" results="$RUNNER_TEMP/test-results"
          mkdir -p "$names" "$results"
          if [[ $TESTS == *$'\n'* ]]; then mapfile -t given <<< "$TESTS"; else read -ra given <<< "$TESTS"; fi
          sq="'" dq='"' bt='`'
          rust=() titles=() files=()
          for n in "${given[@]}"; do
            n=$(sed 's/^[[:space:]]*//; s/[[:space:]]*$//' <<< "$n")
            [ -n "$n" ] || continue
            echo "Named: $n"
            last=${n##* > }
            if [[ $last != *' '*' '* ]]; then
              end=${last##*::}
              end=${end##* }
              [ -z "$end" ] || rust+=("test(/(^|::)$(sed 's/[][\\.^$*+?(){}|/]/\\&/g' <<< "$end")\$/)")
            fi
            for title in "$last" "${last#* }" "${last#*::}"; do
              [ -n "$title" ] || continue
              # As written, and as a string in single quotes, double quotes or backquotes writes it.
              escaped=${title//\\/\\\\}
              found=$(git grep -l -F -e "$title" -e "${escaped//$sq/\\$sq}" -e "${escaped//$dq/\\$dq}" \
                -e "${escaped//$bt/\\$bt}" -- ':(glob)client/**/*.test.*' ':(glob)client/**/*.spec.*' || true)
              [ -n "$found" ] || continue
              titles+=("$(sed 's/[][\\.^$*+?(){}|]/\\&/g' <<< "$title")")
              mapfile -t -O "${#files[@]}" files < <(sed 's|^client/||' <<< "$found")
            done
          done
          rust_selected=false page_selected=false
          if [ ${#rust[@]} -gt 0 ]; then
            mapfile -t rust < <(printf '%s\n' "${rust[@]}" | sort -u)
            filter=""
            for f in "${rust[@]}"; do filter="${filter:+$filter | }$f"; done
            printf '%s' "$filter" > "$names/filter"
            rust_selected=true
          fi
          if [ ${#titles[@]} -gt 0 ]; then
            mapfile -t titles < <(printf '%s\n' "${titles[@]}" | sort -u)
            (IFS='|'; printf '%s' "${titles[*]}") > "$names/pattern"
            printf '%s\n' "${files[@]}" | sort -u > "$names/files"
            echo "Page tests in: $(paste -sd ' ' "$names/files")"
            page_selected=true
          fi
          # A run that names no test it can run says so, and reports no test.
          if [ $rust_selected = false ] && [ $page_selected = false ]; then echo '<testsuites/>' > "$results/none.xml"; fi
          echo "rust=$rust_selected" >> "$GITHUB_OUTPUT"
          echo "page=$page_selected" >> "$GITHUB_OUTPUT"
      - run: rustup toolchain install
      - uses: taiki-e/install-action@183e4297cca2404691e9380e1307288dced5c82a # v2.87.25
        with:
          tool: cargo-nextest@0.9.146
      # What ci.yml saves on main is what this restores; a run on a branch saves nothing, which would only add to its
      # time.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: false
      # The incremental state of the workspace's own crates that ci.yml keeps on main, so that this run recompiles only
      # what the work changed: a one-line change to the engine compiled in some 29 s with it against 124 s without.
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: target/ci
          key: target-ci-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}-${{ github.sha }}
          restore-keys: target-ci-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}-
      - run: echo "CARGO_INCREMENTAL=1" >> "$GITHUB_ENV"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.21.0
          cache: npm
          cache-dependency-path: client/package-lock.json
      # Before any cargo step that compiles the crate the page is built into.
      - name: Build the page
        working-directory: client
        run: |
          npm ci
          npm run build
      # With the cargo profile ci (Cargo.toml) and nextest's profile ci (.config/nextest.toml), which stops any test at
      # 60 s and writes its JUnit: the Rust tests the step Read the names selected, each to its end.
      #
      # Nextest builds every test binary in one cargo command, and runs none when one does not compile (its exit code
      # 101). Only then are the units that did compile found, by building again past the failure: `cargo build --tests
      # --keep-going` compiles the units nextest's `cargo test --no-run` does, with the same profile and flags, so it
      # takes what that built as it is. Each unit expected (a target of the workspace with tests) that it did not build
      # is written as a testsuite with no testcase and an error, named as nextest names its binary: the first error the
      # compiler gave for it, or else that a unit it depends on did not compile. The named tests of the units built are
      # run again, selected by target with --workspace, so that cargo resolves the features as for the whole workspace
      # and compiles nothing again: one run when no library's tests failed to compile; else one for the other targets
      # and one for the libraries that compiled; and, apart, by its package, which may compile some again, any target
      # with the name of one that did not compile in another package. The step is red still. This is done only when a
      # unit does not compile: whoever changes it makes one fail on a branch and reads the artifact.
      - name: Test
        if: ${{ steps.names.outputs.rust == 'true' }}
        run: |
          set -f
          filter=$(cat "$RUNNER_TEMP/names/filter")
          results="$RUNNER_TEMP/test-results"
          junit=target/nextest/ci/junit.xml
          # What a run of nextest wrote, kept under a name of its own; nothing when it wrote nothing.
          keep() { if [ -f "$junit" ]; then mv "$junit" "$results/$1"; fi; }
          rm -f "$junit"
          code=0
          cargo nextest run --workspace --locked --cargo-profile ci --profile ci \
            --no-fail-fast --no-tests=pass -E "$filter" || code=$?
          keep rust.xml
          [ "$code" -eq 101 ] || exit "$code"
          tmp="$RUNNER_TEMP/unbuilt"
          mkdir -p "$tmp"
          cargo build --tests --workspace --locked --profile ci --keep-going --message-format json > "$tmp/build.json" \
            || true
          cargo metadata --no-deps --format-version 1 --locked > "$tmp/metadata.json"
          jq -n --slurpfile meta "$tmp/metadata.json" --slurpfile build "$tmp/build.json" '
            def lib: .kind | IN("lib", "rlib", "dylib", "cdylib", "staticlib", "proc-macro");
            def binary_id:
              if lib then .pkg elif .kind == "test" then "\(.pkg)::\(.name)" else "\(.pkg)::\(.kind)/\(.name)" end;
            def unit: "\(.id) \(.kind) \(.name)";
            ($meta[0].packages | map({key: .id, value: .name}) | from_entries) as $pkgs
            | [$meta[0].packages[] | . as $p | .targets[] | select(.test)
               | {pkg: $p.name, id: $p.id, kind: .kind[0], name}] as $all
            | [$build[] | select(.reason == "compiler-artifact" and .profile.test and .executable != null)
               | {id: .package_id, kind: .target.kind[0], name: .target.name} | unit] as $made
            | [$build[] | select(.reason == "compiler-message" and .message.level == "error")
               | {pkg: ($pkgs[.package_id] // .package_id), id: .package_id, kind: .target.kind[0], name: .target.name,
                  text: .message.rendered}] as $errors
            | [$all[] | select(unit as $u | any($made[]; . == $u) | not)] as $unbuilt
            | [$all[] | select(unit as $u | any($made[]; . == $u))] as $built
            | ($errors | map(binary_id) | unique | join(", ")) as $failing
            | ([$unbuilt[] | select(lib) | .pkg] | unique) as $broken_libs
            | ($unbuilt | map(select(lib | not) | "\(.kind) \(.name)")) as $taken
            | [$built[] | select((lib | not) and ("\(.kind) \(.name)" as $k | any($taken[]; . == $k)))] as $apart
            | ([$built[] | select((lib | not) and ("\(.kind) \(.name)" as $k | any($taken[]; . == $k) | not))
                | ["--\(.kind)", .name]] | unique | add // []) as $targets
            | ([$built[] | select(lib)] | length > 0) as $libs
            | {
                xml: ([
                  "<testsuites>",
                  ($unbuilt[] | . as $u
                    | ([$errors[] | select(.id == $u.id and .kind == $u.kind and .name == $u.name)] | first | .text)
                      // "not built: a unit it depends on did not compile (\(
                           if $failing == "" then "the log says which" else $failing end))"
                    | "  <testsuite name=\"\($u | binary_id | @html)\" tests=\"0\" errors=\"1\">",
                      "    <error message=\"not built\">\(@html)</error>",
                      "  </testsuite>"),
                  "</testsuites>"
                ] | join("\n")),
                unbuilt: ($unbuilt | map(binary_id)),
                runs: (
                  if ($broken_libs | length) == 0 then
                    [["--workspace"] + (if $libs then ["--lib"] else [] end) + $targets | select(length > 1)]
                  else
                    [(["--workspace"] + $targets | select(length > 1)),
                     (["--workspace"] + ($broken_libs | map("--exclude", .)) + ["--lib"] | select($libs))]
                  end
                  + ($apart | group_by(.pkg) | map(["-p", .[0].pkg] + (map(["--\(.kind)", .name]) | add)))
                )
              }' > "$tmp/plan.json"
          jq -r .xml "$tmp/plan.json" > "$results/unbuilt.xml"
          echo "Units not built: $(jq -r '.unbuilt | join(", ")' "$tmp/plan.json")"
          mapfile -t runs < <(jq -c '.runs[]' "$tmp/plan.json")
          n=0
          for run in "${runs[@]}"; do
            mapfile -t targets < <(jq -r '.[]' <<< "$run")
            n=$((n + 1))
            echo "The named tests of the units built: ${targets[*]}"
            rm -f "$junit"
            cargo nextest run --locked --cargo-profile ci --profile ci --no-fail-fast --no-tests=pass -E "$filter" \
              "${targets[@]}" < /dev/null || true
            keep "rust-$n.xml"
          done
          exit 101
      # The page's tests named, in the files Read the names found them in, writing vitest's JUnit beside its own report;
      # also when the step before is red. They read the flow as the engine stores it, which the first command writes,
      # with the cargo profile and the workspace's features of the step before, so that it compiles nothing that step
      # compiled.
      - name: Test the page
        if: ${{ !cancelled() && steps.names.outputs.page == 'true' }}
        run: |
          WF_AGENTS_GENERATE=1 cargo test --workspace --locked --profile ci --test typescript
          mapfile -t files < "$RUNNER_TEMP/names/files"
          cd client
          npx vitest run "${files[@]}" --testNamePattern="$(cat "$RUNNER_TEMP/names/pattern")" --passWithNoTests \
            --reporter=default --reporter=junit --outputFile.junit="$RUNNER_TEMP/test-results/page.xml"
      # What became of the tests, for the engine to read, whatever became of the steps before.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: test-results
          path: ${{ runner.temp }}/test-results

  # The one check the engine reads, red whenever a job that ran is. A job that did not run is skipped: the lint on a
  # temporary branch of the code before a change, the tests when none are named.
  fast:
    needs: [lint, test]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Every job that ran passed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "lint and test: $RESULTS"
          for r in $RESULTS; do [ "$r" = success ] || [ "$r" = skipped ] || exit 1; done
