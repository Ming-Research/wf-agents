# The flow of a deliverable item: an item with nothing to do of its own, made of the items it depends on, and done when
# they are all done. It waits for them at its one cell, before it ends, which is all it does.
name = "deliver"

# The order of the walk: the one cell, which is the last.
order = ["V1"]

# The engine's own data this flow uses, each defined once in `../data/`. `background` is what the item is to deliver,
# as it is added: the owner reads it and no cell does, so that an edit of it runs nothing. `dependencies` says whether
# the items it is made of have merged.
data = ["background", "dependencies"]

# The cell is an act of the engine's, which makes no call, is no way round and hands in what the flow requires.
[limits]
runs = 1
returns = 1
calls = 1
