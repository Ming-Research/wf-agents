[package]
name = "engine"
description = "The wf-agents engine: runs each work through the compiled flow."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
repository.workspace = true

[dependencies]
config = { path = "../config" }
db = { path = "../db" }
flow = { path = "../flow" }
# Compresses the daily copy of the database before it is kept off the machine; pure Rust, on every platform.
flate2 = "1.1.10"
# Reads the JUnit XML files a project's fast CI reports its tests' results in; it only reads, and refuses a DTD.
roxmltree = "0.21.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["preserve_order"] }
# The session manager: which session a round runs in, what it holds and costs, and the command line it runs in.
sessions = { path = "../sessions" }
unicode-segmentation.workspace = true

[dev-dependencies]
# What the owner decides, as the page writes it: the tests pause works and let them go on as the owner does.
api = { path = "../api" }

[lints]
workspace = true
