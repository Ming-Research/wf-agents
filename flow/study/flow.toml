# The flow of a study: an item whose work reads the design tree, researches what the item asks and hands in a conclusion
# instead of a change, and ends with the conclusion. Nothing of it merges; the items that follow are made from the
# conclusion, and depend on this one.
name = "study"

# The order of the walk, from the first cell to the one that ends the work.
order = ["S1", "R0", "R1", "C1"]

# The engine's own data this flow uses, each defined once in `../data/`; a datum each cell or each line has its own of,
# in `../data/of_a_cell/` or `../data/of_a_line/`, is used where a cell names it. The flow's own data are in `blocks/`,
# its lines in `lines/` and its cells in `cells/`, one file each.
data = ["start", "background", "dependencies", "asked", "tree"]

# What the item's card shows the owner of the work, in this order: the page shows what this names, and names no datum
# of its own.
card = ["background", "conclusion"]

# The engine's tools every agent cell of the flow may ask for, each defined once in `../agents/tools/`. The form of a
# return holds them, the same for every line of the flow (`../agents/return/return.toml`).
tools = ["query", "run_tests"]

# The table of earlier ids (principle cell-numbering). Only added to.
earlier_ids = []

# What every agent cell of the flow reads beside what its own file names, given first: every cell's questions and every
# cell's words, so that what was asked, answered and said is known to the whole work. `{each}_` names each cell's own
# datum.
[every_agent]
reads = ["{each}_questions", "{each}_words"]

[every_agent.kinds]
"{each}_questions" = "all"
"{each}_words" = "all"

# Chosen, not measured: no work yet showed what these should be.
[limits]
runs = 3
returns = 3
calls = 40
