what = "Fires when the session of the cell's line was reopened: the session holds nothing, and the cell is filled again from the top."
do = """Read what you need from the start: the session holds nothing of what you read before."""
block = "session"
from = "session"

# What the engine writes into the block as a line begins a new session: `text`, with `{line}` the line and `{why}` the
# words below of why it began one; and, as its session is compacted during a round, which begins none, `compacted`
# with `{line}`. Filled in a run: `{context}` the tokens of the session's context as its last round ended, `{limit}`
# the limit; `{was}` the model it was begun on.
[writes]
text = "A new session of the line `{line}`: {why}."
limit = "its context was {context} tokens as its last round ended, past the limit of {limit}"
model = "its rounds now run on another model than {was}, which it was begun on"
account = "its rounds now run under another account than it was begun under"
owner = "the owner asked for one"
flagged = "the service's safety check flagged its last round"
lost = "the agents' program no longer had the session it was in"
compacted = "The session of the line `{line}` was compacted: it holds only a summary of what it read."
