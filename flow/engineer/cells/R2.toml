# Why this cell exists: a plan, once written, is thought through again by its writer, in the same session: asked so, a
# writer most often finds a better way (the old flow's cell that asked it, on the line that wrote the design, found one
# 40 times in 52). It runs once a work, until it has handed in, and hands the better way it finds to the plan's writer
# in the dialogue of the two, writing no plan itself (decision the-better-way-is-looked-for-once).
title = "Is there a better way"
kind = "agent"
line = "engineer"
effort = "xhigh"
task = { file = "tasks/better_way.md" }
when = { deep_needed = "no", r2_handed_in = "no" }
watches = ["plan", "better_found"]
reads = ["background", "tree"]
outputs = ["better_found"]

# What the cell does when each datum it watches is new; a datum with none is the task's alone. An answer in
# `better_found` comes once the cell has handed in, which skips it.
[do]
plan = """Think the plan through."""

[kinds]
# Given as the files that changed since the tree this session read.
tree = "last_and_latest"
background = "latest"
plan_owner = "latest"
plan_agent = "latest"
acceptance = "latest"
plan_files = "latest"
better_found = "all"
