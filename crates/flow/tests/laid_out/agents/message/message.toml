# A message of the tests, its parts in this order: one written anew each time, one sent only to a cell that takes
# main in, the data by the cell's kinds, what the cell writes and its task as the session keeps them, and the triggers.
[[parts]]
part = "heading"
text = "# {title}"

[[parts]]
part = "main"
only = "takes_main"

[[parts]]
part = "context"

[[parts]]
part = "outputs"
kind = "latest"

[[parts]]
part = "task"
kind = "latest"
text = "{task}"
held = "As given before in this session."

[[parts]]
part = "triggers"
text = "## Why you are run\n"
each = "\n- `{trigger}`{detail}{do}"
detail = " ({detail})"
do = ": {do}"
after = "\n\nName in `dealt_with` each of these you have dealt with."
