# What the engine says as it runs the agents' program, guards what its rounds cost and keeps their sessions' prompt
# caches: to a session it keeps warm, to a session it forks, and to the owner, of a run of the program that failed, of
# a round it stopped and of a work it paused.

# Why a run of the agents' program, a round's, a keep-warm ping's or the check of the outside's, failed where it ended
# with no result to read: `exited` where it exited with the code `{code}`, `signal` where the signal `{signal}` ended
# it; `{command}` the command line, and `{said}` the end of what it said. `cut_off`, with `{command}` alone, where the
# process of the engine that ran a round's program ended before it saw the program end, and what the program printed
# until then holds no result.
[program]
exited = "{command} exited with code {code}: {said}"
signal = "{command} was ended by signal {signal}: {said}"
cut_off = "The engine that ran {command} ended before it saw the program end, and what the program printed until then has no result in it."

# What the engine's check of the outside of the agents' rounds found down, where it says it itself, a sentence each:
# `no_account` where no account is in use, which a round, a ping or a fork that is given no token says too; `offline`
# where the network does not reach the agents' service.
[check]
no_account = "No account is in use: choose one on the Settings view."
offline = "The network does not reach the agents' service."

# Why the run guard stopped a round, as the round's failure says it, in sentences: `stopped` that it stopped the round,
# or `again` where it stopped the run's round before too, in the new session its line was given; then, after `then`,
# what it measured, `growth` where its context grew past the line of its history both in all and for each call,
# `jump` where its first prompt rose past the session's last by more than the line both in all and for each character
# of the message it was given. Filled in a run: `{value}` and `{line}` the first measure and its line, `{per}` and
# `{per_line}` the second; `{from}` how many values gave the lines and of what, in `from` below, `{scope}` one of
# `[guard.scope]`; `{tools}` the last tools the round used, each as `tool`, `between` between two, and `no_tools` where
# it used none.
[guard]
stopped = "The run guard stopped the round."
again = "The run guard stopped the round again, in the new session its line was given."
then = " "
growth = "Its context grew by {value} tokens, past the limit of {line}, and by {per} a call, past the limit of {per_line}. The limits come from {from}. Its last tools: {tools}."
jump = "Its first prompt was {value} tokens larger than its session's last prompt, past the limit of {line}, and {per} larger for each character of its message, past the limit of {per_line}. The limits come from {from}. Its last tools: {tools}."
from = "{samples} rounds {scope}"
tool = "{tool} {on}"
between = "; "
no_tools = "none"

[guard.scope]
cell = "of its cell"
flow = "of its flow"
works = "of the flow's other works"
line = "of its line"

# Why the engine paused a work whose spend or time, since it started or was last let on after the engine paused it,
# is past the line the flow's other works give, `spent` and `time`; or whose spend is over the budget the settings
# give, `budget`; each a sentence, said beside its work. Filled in a run: `{value}` its spend in dollars or its time in
# minutes, `{line}` the line, `{works}` how many works gave it, `{since}` the words below of since when, `{budget}`
# the budget in dollars, `{more}` what letting the work on allows it beyond that, in dollars; `between` between two
# reasons it waits for, or a reason and why its round failed.
[work]
spent = "It has spent ${value} since {since}, past the limit of ${line} that {works} other works of its flow give."
time = "It has taken {value} minutes in its rounds since {since}, past the limit of {line} that {works} other works of its flow give."
budget = "It has spent ${value}, over its budget of ${budget}. If you let it go on, it may spend ${more} more."
started = "it started"
let_on = "it was last resumed"
between = " "

# What a keep-warm ping sends a session whose line waits, so that the prompt cache does not let the session go: the
# whole message, `message`, whose answer is not read. Why one failed, kept with the ping: `under_way`, a round of its
# line being under way; `no_round`, with `{line}`, no round of the line having run; `no_system`, with `{why}`, the
# session's system prompt not being kept; `stopped`, with `{minutes}`, its not ending while the cache kept the session;
# and where its program ended with no result, as `[program]` says.
[ping]
message = """# Keep-warm ping

Your line is waiting for its next round. This message only keeps your session's prompt cache from expiring. Do nothing and use no tools: hand in the smallest return the format allows."""
under_way = "a round of its line is under way"
no_round = "no round of the line `{line}` has run"
no_system = "the session's system prompt is not kept: {why}"
stopped = "the ping did not end within {minutes} minutes, while the cache kept the session, and was stopped"

# What a fork of a round's session is sent first, before its question, the same for every fork of the round, so that
# the session's history is written to the prompt cache once for all the forks asked after it: the whole message,
# `first`, whose answer is not read.
[fork]
first = """# A question follows

The next message is a question. Until it comes, hand in the smallest return the format allows."""
