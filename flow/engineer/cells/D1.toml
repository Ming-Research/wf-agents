# Why this cell exists: so that a direction the facts could not settle in the research is settled by a deeper look, in
# a session of its own with a stronger model, before anything is built on it.
title = "Deep research"
kind = "agent"
line = "deep_researcher"
effort = "xhigh"
takes_main = true
task = '''
Research what `found` left open, and work out how to do what `background` asks. This session has not read the tree:
read it for the work as the tree's rules say, and the code yourself. Take `found` as a hypothesis to verify, and use
what the research left in `project.research` rather than run it again; anything you make goes there too, committed.
Find out a fact left open, try the ways to try, analyse a fault of the design itself as a design; verify a fact that
would change the direction before using it, and weigh the upkeep the solution adds.

Write the plan: `plan_owner`, `plan_agent`, `acceptance`, and `tree_edits`. In `plan_owner` say also
what it leaves out. Settle what a fact settles and decide what is cheap to change later: ask the owner only the rest.

If the solution falls into parts each mergeable on its own, too large for one work, ask the owner with a question
that waits, naming them in order.
'''
when = { deep_needed = "yes" }
watches = [
  "background",
  "found",
  "plan_review",
  "tree_review",
  "plan_doubts",
  "r1_questions",
  "d1_questions",
  "d1_words",
]
reads = ["plan_owner", "plan_agent", "acceptance", "tree_edits", "tree"]
outputs = [
  "plan_owner",
  "plan_agent",
  "d1_questions",
  "acceptance",
  "tree_edits",
  "plan_review",
  "tree_review",
  "plan_doubts",
  "d1_words",
]

# What the cell does when each datum it watches is new; a datum with none is the task's alone. No session is watched:
# the task has the cell read the tree where its session has not.
[do]
background = """See what changed from the version you last worked from, the whole of it where you worked from none, and bring the research and the plan up to date for it."""
plan_review = """Take each point of `plan_review`: change the plan where it touches, only there, or say why not, and answer it in `plan_review`."""
tree_review = """Take each point of `tree_review`: change the plan where it touches, only there, or say why not, and answer it in `tree_review`."""
plan_doubts = """Take each point of `plan_doubts`: change the plan where it touches, only there, or say why not, and answer it in `plan_doubts`."""
r1_questions = """The owner has answered a question in `r1_questions` with another option than it recommends, or one that waited: bring the plan to it."""
d1_questions = """The owner has answered one of your questions in `d1_questions` with another option than yours, or one you wait for: bring the plan to it."""
d1_words = """The owner has said something to you in `d1_words`: that comes first. Take each point of it: change the plan where it touches, only there, or say why not, and answer it in `d1_words`."""

# `all` for a dialogue, `last_and_latest` where the cell works from what changed, `latest` for the rest. The cell's own
# questions and words, and the research's questions, are of the kind every agent cell takes them in.
[kinds]
# Given as the files that changed since the tree this session read.
tree = "last_and_latest"
background = "last_and_latest"
found = "latest"
plan_review = "all"
tree_review = "all"
plan_doubts = "all"
plan_owner = "latest"
plan_agent = "latest"
acceptance = "latest"
tree_edits = "latest"
