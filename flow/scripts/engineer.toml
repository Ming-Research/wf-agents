# What the agents, the engine's acts and the tools do when the engineer's flow is tried with no agent behind it
# (`wf-agents run --script`). One work goes through every cell: the research asks the owner a question, answers it and
# sends the work to deep research; the plan's review objects to the plan once; the implementation records a decision
# of its own; the review objects once and then asks for adversarial testing, which finds a fault; after the fix the
# review keeps asking for it and the testing is content; the check before the merge fails once, and after the fix the
# review, the testing and the check look again and pass.

[took]
ms = 4000
usd_micros = 180000
input_tokens = 21000
cached_tokens = 160000
output_tokens = 3200

[tools.check]
answer = "Every check passed."
ms = 6000

# Understanding the problem and the design tree: what it read stays in the session, and it hands in no block.
[[flows.engineer.rounds]]
cell = "R0"
hands_in = []

# Research: a question to the owner, which ends its run; then, entered again for the answer, what it found, which
# needs deep research, and its answer to the owner.
[[flows.engineer.rounds]]
cell = "R1"
asks = [{ question = "Should the cost of a round be kept for each call of a tool as well?", who = "owner" }]

[[flows.engineer.rounds]]
cell = "R1"
run = 2
hands_in = [
    { block = "deep_needed", value = "yes" },
    { block = "found", content = "The rounds keep their cost; the calls keep none. Two ways to keep it were found; which one holds after a restart is open." },
    { block = "discussion", content = "As you answered, the cost is kept for each call as well." },
]

# Deep research: the plan in full, and after the objection of the plan's review a revised plan with an answer.
[[flows.engineer.rounds]]
cell = "D1"
hands_in = [
    { block = "plan_owner", content = "Keep what each call took beside its result, as a round's is kept, and show both on the work's page." },
    { block = "plan_agent", content = "Give a call's result what it took; keep it in the store beside the result; sum rounds and calls into the run." },
    { block = "questions", content = "None." },
    { block = "acceptance", content = "A call's cost shows on the work's page, is counted in the total, and outlives a restart." },
    { block = "tree_edits", content = "A decision that what a call took is kept with its result, in a table only added to." },
    { block = "edits_tree", value = "yes" },
]

[[flows.engineer.rounds]]
cell = "D1"
run = 2
hands_in = [
    { block = "plan_agent", content = "Give a call's result what it took; keep it in the table of results; sum rounds and calls into the run; a call withdrawn takes nothing." },
    { block = "reply_plan_review", content = "Agreed: a withdrawn call takes nothing, and the plan now says so." },
]

# The plan's review: one objection to the plan, then content.
[[flows.engineer.rounds]]
cell = "D2"
hands_in = [
    { block = "plan_review", content = "The plan does not say what a call that was withdrawn took." },
    { block = "plan_ok", value = "no" },
]

[[flows.engineer.rounds]]
cell = "D2"
run = 2
hands_in = [{ block = "plan_ok", value = "yes" }]

# Implementation: asks for the check, which ends its run, and, entered again for its result, hands in the code with a
# decision of its own; then a fix for the review, one for the testing and one for the check before the merge.
[[flows.engineer.rounds]]
cell = "I1"
asks = [{ tool = "check", input = "the work's branch" }]

[[flows.engineer.rounds]]
cell = "I1"
run = 2
hands_in = [
    { block = "code", content = "The call's cost is kept with its result and summed into the run." },
    { block = "decisions", content = "A call's cost is kept in millionths of a dollar, as a round's is, so that the two add up exactly." },
    { block = "evidence", content = "The check passed on the head; three new tests." },
]

[[flows.engineer.rounds]]
cell = "I1"
run = 3
hands_in = [
    { block = "code", content = "The call's cost is kept with its result and summed into the run; the page shows it per call." },
    { block = "reply_review", content = "Done: the step's panel now shows what each call took." },
]

[[flows.engineer.rounds]]
cell = "I1"
run = 4
hands_in = [
    { block = "code", content = "As before, and a call with no result yet is counted as taking nothing." },
    { block = "reply_testing", content = "Fixed: the sum no longer fails on a call that has no result." },
]

[[flows.engineer.rounds]]
cell = "I1"
run = 5
hands_in = [
    { block = "code", content = "As before, with the latest main taken in and the work's migration renamed to follow main's." },
    { block = "reply_check", content = "Fixed: the work's migration now follows the one main added." },
]

# The review: objects once, then asks for adversarial testing, and keeps asking for it while the summing that made it
# ask is in the change.
[[flows.engineer.rounds]]
cell = "T1"
hands_in = [
    { block = "review", content = "The acceptance says the cost shows on the page; the page does not show it per call." },
    { block = "review_ok", value = "no" },
    { block = "needs_testing", value = "no" },
]

[[flows.engineer.rounds]]
cell = "T1"
run = 2
hands_in = [
    { block = "review_ok", value = "yes" },
    { block = "needs_testing", value = "yes" },
]

[[flows.engineer.rounds]]
cell = "T1"
run = 3
hands_in = [
    { block = "review_ok", value = "yes" },
    { block = "needs_testing", value = "yes" },
]

[[flows.engineer.rounds]]
cell = "T1"
run = 4
hands_in = [
    { block = "review_ok", value = "yes" },
    { block = "needs_testing", value = "yes" },
]

# Adversarial testing: finds one fault, then none on its fix and none on the fix for the check.
[[flows.engineer.rounds]]
cell = "T2"
hands_in = [
    { block = "tests", content = "Four tests; one fails: the sum of a run with a call that has no result." },
    { block = "testing", content = "Summing a run fails when one of its calls has no result yet." },
    { block = "testing_ok", value = "no" },
]

[[flows.engineer.rounds]]
cell = "T2"
run = 2
hands_in = [
    { block = "tests", content = "Four tests, all passing on the fix; the one that failed fails on the commit before it." },
    { block = "testing_ok", value = "yes" },
]

[[flows.engineer.rounds]]
cell = "T2"
run = 3
hands_in = [
    { block = "tests", content = "The same four tests, all passing with the latest main taken in." },
    { block = "testing_ok", value = "yes" },
]

# The check before the merge: fails once with the latest main taken in, then passes on the fix.
[[flows.engineer.rounds]]
cell = "M1"
took = { ms = 8000 }
hands_in = [
    { block = "checked", value = "no" },
    { block = "check", content = "With the latest main taken in, the migrations fail: main added one of the same minute as the work's." },
]

[[flows.engineer.rounds]]
cell = "M1"
run = 2
took = { ms = 8000 }
hands_in = [{ block = "checked", value = "yes" }]

[[flows.engineer.rounds]]
cell = "M2"
took = { ms = 1000 }
