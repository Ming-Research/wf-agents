# A return: one of two kinds, which the form holds apart. The form is the shape alone, the same for every cell of a
# line, so the same on every call of a session: the engine's fields, which every agent cell has alike; the blocks the
# line's cells write, each a field of `outputs` under its name, in its own shape; and the tools the flow names (`tools`
# in its `flow.toml`). Each field is a file in `fields/`, each block a file of its flow's or of `../../data/`, each tool
# a file in `../tools/`.
#
# A field's `told` says where its words go in the part on returning: `alone`, a paragraph of its own; `with_outputs`,
# after the words of `outputs`, in their paragraph; `listed`, in the list of the fields that are not blocks.

# The form, given with every call. The program makes of it a tool it hands a return in with, which stands with its own
# tools, before the system prompt. Of its two kinds, `tools`, which asks the engine for tools, holds each tool the flow
# names, in the order it names them, and nothing else, and is left out where the flow names none; `outcome`, which
# does the cell's work, holds these fields in this order, short ones first and long texts last.
[form]
outcome = ["dealt_with", "meaning_unchanged", "observations", "protected_changes", "outputs"]

# The part on returning of a line's system prompt, after the engine's words (`../session.toml`): the same for every
# cell of the flow. `heading`, `first` and `kinds`; each field told `alone`, in the order of the form, with those told
# `with_outputs` after the words of `outputs`; `every_time`; `fields`, over the fields told `listed`, each field's
# `also` after the list; `owner_reads`, `{fields}` the names in `reads` joined by `", "` and `and`; where the flow
# names tools, `tools`, then each tool's words.
[how_you_return]
heading = "## How you return"
first = "You end every round with one return, in the form given to you."
kinds = '''
A return is one of two kinds, never both: `outcome`, which ends the round with the cell's work and holds the fields
told below; or `tools`, which asks the engine for tools, as "What you may ask the engine for" says, and holds them
alone.'''
# An item of the list of the fields, and of the tools.
item = "- {text}"
# The fields told `listed`, in this order.
listed = ["observations", "protected_changes"]
every_time = '''
Handing in again a block marked "hand it in every time", its value unchanged, runs no cell again.'''
fields = '''
Fields that are not blocks of the work:'''
owner_reads = "The owner reads {fields}: write it in `owner.language`, with technical terms in their English original."
# The fields the owner reads, in the order `owner_reads` names them.
reads = ["protected_changes"]
and = " and "
tools = '''
## What you may ask the engine for

Each tool is a field of `tools` under its name, holding a list of requests; those of one return are run together, and
the cell is entered again once their results are there.'''

# What a cell is told it writes, with its task, where the session lacks it: its blocks, each on a line, after the
# heading; after the list, `owner_reads`, once, where a block of the list is one the owner reads; then the words of
# each block it writes that has words of its own (`words` in the block's file), each a paragraph, in the order of the
# list; `none` where it writes none. A line says after the block's name each mark that holds: that it is a choice,
# `{values}` its values; that the owner reads it; that the cell hands it in every time.
[outputs]
heading = "## What this cell returns"
block = "- `{block}`{choice}{shown}{must_write}: {what}"
none = "This cell writes no block."
choice = ", a choice, one of {values}"
shown = " (the owner reads it)"
must_write = " (hand it in every time)"
owner_reads = '''
Write what the owner reads in `owner.language`, with technical terms in their English original. Where a diagram says
it more plainly than words, draw it in a small ```mermaid or ```dot fence, and do not say it again in words.'''
