# Why this cell exists: so that the work starts from facts checked in the code: what the item says, found to hold, and
# a plan the implementation can follow; or, where the facts cannot settle the direction in a round or two, the deep
# research is called with what it must settle.
title = "Initial research"
kind = "agent"
line = "engineer"
effort = "high"
task = '''
Research how to do what the item asks with code, going on from the tree you read. Check that what the item says
holds, where it shows: a fault it reports, seen as it happens, such as on the page in a real browser or in the
program on its own data, and its root cause (a cause read from the code, or a test in a stand-in such as a simulated
page, has not seen it); what it asks for, not there already. Where it does not hold after looking as far as the tools
reach, ask the owner how to go on, with a question that waits. A test goes with the project's tests, anything else you
make in `project.research`, committed. If the design itself is at fault, say so.

Decide `deep_needed`. With yes, write only `found`, and ask no question. With no, write the plan (`plan_owner`, `plan_agent`,
`acceptance`, and `tree_edits`) and no `found`. Where the solution needs the design tree changed, propose that in
`tree_edits` rather than bend the solution. Before handing in, ask yourself where the plan is most likely wrong, and
check that point.
'''
when = { deep_needed = "no" }
watches = [
  "background",
  "better_found",
  "plan_review",
  "tree_review",
  "plan_doubts",
  "r1_questions",
  "r1_words",
]
reads = ["tree"]
outputs = [
  "deep_needed",
  "found",
  "plan_owner",
  "plan_agent",
  "r1_questions",
  "acceptance",
  "tree_edits",
  "better_found",
  "plan_review",
  "tree_review",
  "plan_doubts",
  "r1_words",
]
must_write = ["deep_needed"]

# What the cell does when each datum it watches is new; a datum with none is the task's alone.
[do]
background = """See what changed from the version you last worked from, the whole of it where you worked from none, and bring the research and the plan up to date for it."""
better_found = """Take the way in `better_found`: change the plan to it, or say why not, and answer it in `better_found`."""
plan_review = """Take each point of `plan_review`: change the plan where it touches, only there, or say why not, and answer it in `plan_review`."""
tree_review = """Take each point of `tree_review`: change the plan where it touches, only there, or say why not, and answer it in `tree_review`."""
plan_doubts = """Take each point of `plan_doubts`: change the plan where it touches, only there, or say why not, and answer it in `plan_doubts`."""
r1_questions = """The owner has answered one of your questions in `r1_questions` with another option than yours, or one you wait for: bring the plan to it."""
r1_words = """The owner has said something to you in `r1_words`: that comes first. Take each point of it: change the plan where it touches, only there, or say why not, and answer it in `r1_words`."""

# `all` for a dialogue, `last_and_latest` where the cell works from what changed, `latest` for the rest. The cell's own
# questions and words are of the kind every agent cell takes them in.
[kinds]
# Given as the files that changed since the tree this session read.
tree = "last_and_latest"
background = "last_and_latest"
better_found = "all"
plan_review = "all"
tree_review = "all"
plan_doubts = "all"
