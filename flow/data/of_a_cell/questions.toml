# The questions a cell asks the owner and the owner's answers: a datum of each cell that may ask, which it writes and
# watches (design document `data-and-context`, 30). Its versions are the engine's: a question as the run that asks it,
# asks it anew or withdraws it finishes, or as the engine asks it (in the questions of the cell its flow names), each
# new to no cell; an answer as the owner answers a version of a question, new to the cells that watch the datum only
# where it changes the option the work goes by. A cell that writes it in `outputs` asks the owner: `words` is told to
# it, after the list of what it returns, and `[shape]` is what the form of its line holds it to.
name = "{cell}_questions"
what = "The questions the cell asks the owner, each under its name, and the owner's answers to them, each the question, the version answered and the option taken."
from = "answer"
shown = true
words = '''
`{cell}_questions`: what you ask the owner. Ask what your task tells you to ask, and otherwise only what you cannot go
on without; decide the rest yourself. A question asks what to do, not how to change the design tree. Set `waits` if you
cannot go on without the answer, or if going on by your recommendation would likely have to be undone at a cost: the
work stops at this cell, and you are run again with the answer. Otherwise the work goes on by your recommendation. In a
text, point to a question as `{{name}}`; `recommends` counts the options from 1. To rewrite a question, write it again
under its name; to withdraw it, give its name and why. A question you do not write again stands, with its answer.

A return with a question you wait for may leave out the blocks marked "hand it in every time", since the work stops at this cell until the answer comes.'''

[shape]
type = "array"

[[shape.items.anyOf]]
type = "object"
properties = { name = { type = "string" }, waits = { type = "boolean" }, recommends = { type = "integer" }, ask = { type = "string" }, options = { type = "array", items = { type = "object", properties = { does = { type = "string" }, follows = { type = "string" } }, required = ["does", "follows"], additionalProperties = false } } }
required = ["name", "waits", "recommends", "ask", "options"]
additionalProperties = false

[[shape.items.anyOf]]
type = "object"
properties = { name = { type = "string" }, withdrawn = { type = "string" } }
required = ["name", "withdrawn"]
additionalProperties = false

# What the engine writes of each version. An answer, as the owner answers a version of a question: `{question}` its
# name, `{version}` the version answered, `{option}` the option's number, `{does}` and `{follows}` the option's. A
# question asked: `{question}` its name, `{version}` its version, `{ask}` what it asks, `{options}` each option as
# `option` says it, with `{option}` its number, `{recommends}` the option it recommends as `recommends` says it, where
# it recommends one, and `{waits}` whether its cell waits for the answer, as `waits` or `goes_on` says it; asked anew,
# `{was}` the version it replaces. A question withdrawn: `{version}` the version that withdraws it, `{was}` the version
# withdrawn, `{why}` why, as `why` says it.
[writes]
text = "`{question}`, version {version}, answered: option {option}, {does}: {follows}."
why = " Why: {why}"
asked = "`{question}`, version {version}, asked: {ask}{options}{recommends}{waits}"
asked_anew = "`{question}`, version {version}, asked anew in place of version {was}: {ask}{options}{recommends}{waits}"
option = "\n- option {option}, {does}: {follows}"
recommends = "\nRecommended: option {option}."
waits = "\nThe work waits for the answer."
goes_on = "\nThe work goes on by the recommendation."
withdrawn = "`{question}`, version {was}, withdrawn.{why}"
