[package]
name = "web"
description = "The owner's interface as wf-agents run serves it: HTTP and JSON under /api/v1, the event stream, and the page built into the binary."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
api = { path = "../api" }
config = { path = "../config" }
axum = { version = "0.8.9", default-features = false, features = ["http1", "json", "query", "tokio"] }
db = { path = "../db" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["preserve_order"] }
tokio = { version = "1.53.1", features = ["rt-multi-thread", "net", "sync"] }
tokio-stream = { version = "0.1.19", default-features = false, features = ["sync"] }

[lints]
workspace = true
