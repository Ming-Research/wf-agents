what = "The head of the branch the works merge into, as the engine last read it, so that the check before a merge runs again on what main is now."
from = "main"

# What the engine writes each time it reads the head of main. Filled in a run: `{main}` the main branch's name,
# `{head}` its head.
[writes]
text = "The main branch {main} is at {head}."
