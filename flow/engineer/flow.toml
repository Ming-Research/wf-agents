name = "engineer"

# The order of the walk, from the first cell to the merge.
order = ["S1", "R0", "R1", "D1", "D2", "I1", "T1", "T2", "M1", "M2"]

[limits]
runs = 3
returns = 3
calls = 40

[lines.engineer]
[lines.designer]
[lines.plan_review]
[lines.review]
[lines.adversarial]

[tests]
may_start = "The item may start: the items it depends on are merged, and it is not held"
plan_needs_review = "The plan changes the design tree, or went through the design"
may_merge = "The work may merge: every question is confirmed as recommended, and every cell that judges is content"

