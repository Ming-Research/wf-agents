# What the place `{your_line}` in `how_you_work_here.md` says: what the line may do in the worktree, which no rule says
# by itself. A line that only reads (`reads_only` in its file) is told `reads_only`; a line that writes is told
# `writes`; a line that changes only the project's tests (`tests_only` in its file) is told `tests_only` after `writes`,
# `{paths}` the paths of its tests (`[tests]` of the declaration), each between backticks, joined by commas and the last
# by `or`; and, where the project protects paths (`[protected]` of the declaration), `protected` last, `{paths}` those
# paths, each between backticks, joined by commas and the last by `and`; a line that only reads is told
# `protected_read` after `reads_only`, with the same paths, so that whoever judges the change knows which of its files are the owner's.
reads_only = "You only read it, and change no file."
writes = "Make your changes there and commit them there."
or = " or "
tests_only = " Change only the project's tests, the files that {paths} match. If a test must go into another file, say so in what you hand in."
protected = " The project protects {paths}: change what is there only where the work needs it."
protected_read = " The project protects {paths}: the work may change what is there only where it needs to."
and = " and "
