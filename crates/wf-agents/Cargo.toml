[package]
name = "wf-agents"
description = "Runs coding agents through a defined flow."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
api = { path = "../api" }
clap = { version = "4.6.7", features = ["derive", "env"] }
config = { path = "../config" }
db = { path = "../db" }
engine = { path = "../engine" }
flow = { path = "../flow" }
serde_json = { version = "1.0.154", features = ["preserve_order"] }
# The session manager, for what the flow check says of each line's sessions.
sessions = { path = "../sessions" }
web = { path = "../web" }

[lints]
workspace = true
