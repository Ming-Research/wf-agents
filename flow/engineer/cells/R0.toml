# Why this cell exists: so that the design tree is read before any work on the item. The principles and decisions it
# holds bind every later step, and one missed costs dearly.
title = "Understand the problem and the design tree"
kind = "agent"
line = "engineer"
effort = "high"
takes_main = true
task = '''
First understand what the item's `background` asks for, only as far as you need to know where in the design tree to
look. Then read the tree for it as the tree's rules say. The research comes next, in this session, and starts from
what you read here: this run is for the tree of this repository, `design/`, and whatever else the `background` names
is read in the research. What you read stays in this session for the research: hand in only `dealt_with`.
'''
triggered_by = ["on_background", "on_session"]
context = ["background", "tree"]
outputs = []

# What the cell does when each trigger fires; a trigger with none is the task's alone.
[do]
on_background = """See what changed from the version you last worked from, the whole of it where you worked from none, and read what the change touches."""
# So that the tree is read again in a session that was reopened.
on_session = """Do all of this from the start: the session holds nothing of what you read before."""

[kinds]
# Given as the files that changed since the tree this session read.
tree = "last_and_latest"
# It says what the item asks for, and so where in the tree to look.
background = "last_and_latest"
