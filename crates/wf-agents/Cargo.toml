[package]
name = "wf-agents"
description = "Runs coding agents through a defined flow: the engine's command"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
repository.workspace = true

[dependencies]
carry = { path = "../carry" }
clap = { version = "4.6.7", features = ["derive"] }
driver = { path = "../driver" }
flow = { path = "../flow" }
# The commands that talk to a running engine send their requests with the HTTP library the engine serves with.
http-body-util = "0.1.3"
hyper = { version = "1.12.0", features = ["client", "http1"] }
hyper-util = { version = "0.1.21", features = ["tokio"] }
serde.workspace = true
serde_json = "1.0.154"
service = { path = "../service" }
store = { path = "../store" }
tokio = { version = "1.53.1", features = ["macros", "net", "rt-multi-thread"] }
web = { path = "../web" }

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true
