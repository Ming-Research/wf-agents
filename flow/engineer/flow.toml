name = "engineer"

# The order of the walk, from the first cell to the merge.
order = ["S1", "R0", "R1", "D1", "D2", "I1", "T1", "T2", "M1", "M2"]

[limits]
runs = 3
returns = 3
calls = 40

[lines.engineer]
[lines.designer]
[lines.plan_review]
[lines.review]
[lines.adversarial]

[tests.may_start]
says = "The items it depends on are merged"
kind = "all"
reads = ["dependencies"]
is = "merged"

[tests.plan_needs_review]
says = "The plan changes the design tree, or went through the design"
kind = "any"
reads = ["needs_design", "changes_tree"]
is = "yes"

[tests.checked]
says = "The check before the merge passed"
kind = "all"
reads = ["checked"]
is = "yes"

# What people and the outside write.
[blocks.background]
people = true
shown = true
[blocks.dependencies]
values = ["waiting", "merged"]
outside = "dependencies"
[blocks.tree]
outside = "tree"
[blocks.session]
outside = "session"
[blocks.main]
outside = "main"

# What the first cells make of the item.
[blocks.place]
shown = true
[blocks.context]
[blocks.related]
[blocks.supplement]

# The plan.
[blocks.needs_design]
values = ["yes", "no"]
[blocks.found]
[blocks.plan_owner]
shown = true
[blocks.plan_agent]
[blocks.questions]
shown = true
[blocks.acceptance]
[blocks.tree_changes]
[blocks.changes_tree]
values = ["yes", "no"]
[blocks.plan_settled]
values = ["yes", "no"]
shown = true

# The change.
[blocks.code]
[blocks.evidence]
[blocks.more_testing]
values = ["yes", "no"]
[blocks.review_settled]
values = ["yes", "no"]
shown = true
[blocks.tests]
[blocks.testing_settled]
values = ["yes", "no"]
shown = true
[blocks.checked]
values = ["yes", "no"]
shown = true
[blocks.merged]
shown = true

# What the owner says to each cell on the page: blocks only people write.
[blocks.opinions_context]
people = true
[blocks.opinions_research]
people = true
[blocks.opinions_design]
people = true
[blocks.opinions_plan_review]
people = true
[blocks.opinions_implement]
people = true
[blocks.opinions_review]
people = true
[blocks.opinions_testing]
people = true

# What each cell that judges says to the cell it judges: a block for each pair, which only the judging cell writes, so
# that no one writes over what another said.
[blocks.plan_review_on_research]
[blocks.plan_review_on_design]
[blocks.implement_on_research]
[blocks.implement_on_design]
[blocks.review_on_implement]
[blocks.testing_on_implement]
[blocks.check_on_implement]

# What a cell answers to what was said to it, for the cell that judges it to read. The implementation answers each
# of its judges in a block of that judge's, so that an answer to one runs no other again.
[blocks.answers_research]
[blocks.answers_design]
[blocks.answers_review]
[blocks.answers_testing]
[blocks.answers_check]
