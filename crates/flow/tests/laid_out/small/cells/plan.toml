# A cell that reads what people asked for and the opinions on its plan, and writes the plan.
title = "Plan"
kind = "agent"
effort = "high"
line = "engineer"
task = "Write the plan from the request."
triggers = ["request_changed", "opinions_changed"]
context = ["request", "opinions"]
outputs = ["plan"]

[kinds]
request = "last_and_latest"
opinions = "last_and_latest"
