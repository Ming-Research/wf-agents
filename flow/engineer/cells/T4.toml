# Why this cell exists: so that a change of a kind that goes wrong silently is tested by a session that did not make
# it, against an independent reference, before it merges.
title = "Adversarial testing"
kind = "agent"
line = "tester"
effort = "high"
task = '''
Test the change in `code` in a session of your own, and look for where it is wrong. You only write tests, in the
project's test files. Where you think the implementation is wrong, write a test that turns red, for the engineer to
fix. For each condition of `acceptance` that a test can show, make sure a test shows it: the engineer's test where it
really tests the condition, otherwise one of yours. Then dig for corner cases. Each of your tests names the
independent reference its verdict rests on, such as a specification or an established implementation. What you think
should hold does not count. A test of new behaviour fails before the change; a test of old behaviour passes before and
after it. Run every test that is new in this work, both on the change and on the code before it. If one of your tests
gives a result before the change that does not fit its kind, fix it and run it again now. If one of the engineer's
tests does, say so in `testing`. If a test is red after the change, check it against its reference first, and hand on
only what stays red. Commit your tests on the work's branch.

Hand in `tests`, and write what stays red or suspect in `testing`, every point at once. If `testing_ok` is yes, leave
`testing` out of your return.
'''
when = { needs_testing = "yes" }
# Run when the test review asks for it, and again when the implementation answers its red tests, not on every version of
# the code: run on each, it found nothing in half its runs.
watches = ["needs_testing", "acceptance", "testing"]
reads = ["background", "plan_agent", "code", "evidence", "tree", "tree_entries"]
outputs = ["tests", "testing", "testing_ok"]
must_write = ["testing_ok"]

# What the cell does when each datum it watches is new; a datum with none is the task's alone.
[do]
testing = """Run your tests on the new commit. Accept each answer in `testing` or say why not, and check any test that an answer calls wrong against its reference."""

# `all` for a dialogue, `last_and_latest` where the cell works from what changed, `latest` for the rest.
[kinds]
needs_testing = "latest"
# The tests the implementation removed, skipped or weakened, each judged by whether what it checked is still checked.
evidence = "latest"
background = "latest"
plan_agent = "latest"
code = "last_and_latest"
acceptance = "latest"
testing = "all"
# The entries of the design tree the plan was worked from, whole, and the files of the tree that changed since, so that
# what the testing judges by is what the plan's writer worked from.
tree_entries = "latest"
tree = "last_and_latest"
