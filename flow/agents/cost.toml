# What the engine says as it guards what the agents' rounds cost and keeps their sessions' prompt caches: to a session
# it keeps warm, and to the owner, of a round it stopped and of a work it paused.

# Why the run guard stopped a round, as the round's failure says it: `growth` where its context grew past the line of
# its history both in all and for each call, `jump` where its first prompt rose past the session's last by more than
# the line both in all and for each character of the message it was given; `again`, with `{stopped}` one of those,
# where it stopped the run's round before too, in the new session its line was given. Filled in a run: `{value}` and
# `{line}` the first measure and its line, `{per}` and `{per_line}` the second; `{from}` how many values gave the lines
# and of what, in `from` below, `{scope}` one of `[guard.scope]`; `{tools}` the last tools the round used, each as
# `tool`, `between` between two, and `no_tools` where it used none.
[guard]
growth = "the run guard stopped the round: its context grew by {value} tokens, past the line of {line}, and by {per} a call, past the line of {per_line}, lines that {from} give; its last tools: {tools}"
jump = "the run guard stopped the round: its first prompt rose over its session's last by {value} tokens, past the line of {line}, and by {per} for each character of its message, past the line of {per_line}, lines that {from} give; its last tools: {tools}"
again = "the run guard stopped the round again, in the new session its line was given: {stopped}"
from = "{samples} rounds {scope}"
tool = "{tool} {on}"
between = "; "
no_tools = "none"

[guard.scope]
cell = "of its cell"
flow = "of its flow"
works = "of the flow's other works"
line = "of its line"

# Why the engine paused a work whose spend or time, since it started or was last let on after the engine paused it,
# is past the line the flow's other works give. Filled in a run: `{work}` the work's number, `{value}` its spend in
# dollars or its time in minutes, `{line}` the line, `{works}` how many works gave it, `{since}` the words below of
# since when; `between` between two reasons it waits for.
[work]
spent = "work W{work} has spent ${value} since {since}, past the line of ${line} that {works} other works of its flow give"
time = "work W{work} has taken {value} minutes in its rounds since {since}, past the line of {line} that {works} other works of its flow give"
started = "it started"
let_on = "it was last let on"
between = "; and "

# What a keep-warm ping sends a session whose line waits, so that the prompt cache does not let the session go: the
# whole message, `message`, whose answer is not read. Why one failed, kept with the ping: `under_way`, a round of its
# work being under way; `no_round`, with `{line}`, no round of the line having run; `no_system`, with `{why}`, the
# session's system prompt not being kept; `stopped`, with `{minutes}`, its not ending while the cache kept the session;
# `exited`, with `{command}`, `{status}` and the end of what it said, `{said}`.
[ping]
message = """# Keep-warm ping

Your line waits for its next round, and this message only keeps your session's prompt cache from expiring. Do nothing and use no tool: hand in the smallest return the format allows."""
under_way = "a round of the work is under way"
no_round = "no round of the line `{line}` ran"
no_system = "the session's system prompt is not kept: {why}"
stopped = "the ping did not end within {minutes} minutes, while the cache kept the session, and was stopped"
exited = "{command} exited with {status}: {said}"
